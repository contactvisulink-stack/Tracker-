.wg { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 96px; padding: 12px 6px; border: 1px solid var(--line); background: var(--panel-bg); border-radius: 3px; }
.wg-v { font-family: var(--fx); font-weight: 700; font-size: 34px; line-height: 1; color: var(--gold-1); }
.wg-l { font-size: 12.5px; color: var(--mu); }
.wg.rank .wg-l { font-family: var(--fd); font-weight: 800; font-size: 14px; color: var(--gold-1); }
.welc-crea { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; margin-top: 8px; padding: 12px; border: 1px solid var(--line); background: var(--panel-bg); border-radius: 3px; text-align: left; }
.welc-crea .sgrid { --cols: 14 !important; }
.welc-cl { font-family: var(--fx); font-weight: 700; font-size: 13.5px; color: var(--gold-1); width: 74px; line-height: 1.2; }
.welc-cs { font-family: var(--fx); font-weight: 700; font-size: 15px; color: var(--hex-1); }

/* ═════════════════════════════════════════════════════════════
   Isma Daily · patch 8.1 « L'Affiche »
   Chaque onglet s'ouvre sur une affiche peinte à partir de tes données,
   chacun avec son ambiance : Base astrale (le ciel suit l'heure), Farm braise,
   Arène cramoisie (damas), Profil or et art déco.
   Cinzel Decorative : un titre d'affiche par écran. Cinzel : noms et sections.
   Anton : les grands chiffres. Barlow : le texte. Permanent Marker : les tags.
   Mr Dafoe : la signature au pinceau, une par affiche au maximum.
   ═════════════════════════════════════════════════════════════ */
:root {
  --fd: 'Cinzel', Georgia, serif;
  --fdx: 'Cinzel Decorative', 'Cinzel', Georgia, serif;
  --fn: 'Anton', 'Barlow Semi Condensed', Impact, sans-serif;
  --fx: 'Barlow Semi Condensed', 'Barlow', -apple-system, system-ui, sans-serif;
  --fb: 'Barlow', -apple-system, system-ui, sans-serif;
  --fg: 'Permanent Marker', 'Barlow Semi Condensed', cursive;
  --fs: 'Mr Dafoe', 'Snell Roundhand', cursive;
  --safe-b: env(safe-area-inset-bottom);
  --safe-t: env(safe-area-inset-top);
  /* les couleurs du jeu, identiques partout */
  --c-gold: #F2C66D; --c-hp: #4FE39A; --c-mana: #5BA4FF; --c-red: #FF4B5E;
  --hp: #3DD68C; --red: #E84057; --flesh: #FF8A3D; --purple: #B97CFF; --up: #3DD68C; --down: #E84057; --amber: #F0B84A; --mint: #3DD68C; --moon: #9C8BFF;
  --goldbar: linear-gradient(90deg, #A87A2C, #E6C26A 55%, #FFF1C4);
  --paper: #EEE2CC; --paper-2: #E2D0B4; --paper-ink: #2B1712; --seal: #A3122A;
  --bevel: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
  --bevel8: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px);
  --bevel8i: polygon(7.3px 0, calc(100% - 7.3px) 0, 100% 7.3px, 100% calc(100% - 7.3px), calc(100% - 7.3px) 100%, 7.3px 100%, 0 calc(100% - 7.3px), 0 7.3px);
  --hexa: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
}

/* ── Les ambiances ──
   ink : fond ; hi : métal clair ; a1 : accent du décor ; b2 : accent d'action ; metal : dégradé des titres */
:root, .mood-astral {
  --ink: #0D0820; --ink-2: #160F30; --ink-3: #251A4C;
  --hi: #F8F2FF; --a1: #CDB6FF; --a1d: #5B44A8; --b1: #FFD9EF; --b2: #FF77BC; --b3: #A9306F;
  --tx: #F1EAFF; --mu: #A99EC6; --dim: #6F6692;
  --metal: linear-gradient(178deg, #FFFFFF 10%, #F2EAFF 38%, #B99EF6 56%, #7A5ACF 70%, #F4ECFF 98%);
  --glow: rgba(167, 128, 255, .5);
}
.mood-braise {
  --ink: #120604; --ink-2: #1E0A05; --ink-3: #321409;
  --hi: #FFF4E6; --a1: #FFB547; --a1d: #8C4A10; --b1: #FFE0C2; --b2: #FF6A2B; --b3: #A8320E;
  --tx: #FFF0E2; --mu: #CCAA96; --dim: #85665A;
  --metal: linear-gradient(178deg, #FFF8E8 10%, #FFD98A 38%, #F08A32 58%, #A83A0E 72%, #FFE1A8 98%);
  --glow: rgba(255, 106, 43, .5);
}
.mood-sang {
  --ink: #0E0406; --ink-2: #1A070B; --ink-3: #2D0C14;
  --hi: #FBF2EA; --a1: #EBD9C4; --a1d: #7E6550; --b1: #FFC9CF; --b2: #F0364A; --b3: #8E0E1E;
  --tx: #F7EDE7; --mu: #C0A2A3; --dim: #7E6264;
  --metal: linear-gradient(178deg, #FFFFFF 10%, #F8EEE4 40%, #CBB09A 60%, #8E7560 73%, #FFF5EA 98%);
  --glow: rgba(240, 54, 74, .45);
}
.mood-or {
  --ink: #0E0B07; --ink-2: #19140C; --ink-3: #2A2214;
  --hi: #FFF8E6; --a1: #E2BF72; --a1d: #7C5A2A; --b1: #FFE9B8; --b2: #F2B54E; --b3: #9A6A22;
  --tx: #F6EFE1; --mu: #B8AB92; --dim: #7C725F;
  --metal: linear-gradient(178deg, #FFFBEA 10%, #F6DB94 38%, #C9973F 58%, #7C5A2A 72%, #FFE8A8 98%);
  --glow: rgba(226, 191, 114, .45);
}
.mood-neon {
  --ink: #07040C; --ink-2: #110A1D; --ink-3: #1F1234;
  --hi: #FFFFFF; --a1: #FF4FB0; --a1d: #8C1A5E; --b1: #C8FCFF; --b2: #33F0FF; --b3: #10939E;
  --tx: #F6F0FF; --mu: #AC9FCB; --dim: #6E6492;
  --metal: linear-gradient(178deg, #FFFFFF 10%, #FFD1EC 40%, #FF3DA8 64%, #FFE6F6 98%);
  --glow: rgba(255, 61, 168, .55);
}
.mood-abysse {
  --ink: #010C11; --ink-2: #04171F; --ink-3: #082733;
  --hi: #E8FFFC; --a1: #5FE6D4; --a1d: #136660; --b1: #CDEBFF; --b2: #2FB7FF; --b3: #1A6E9E;
  --tx: #E6FAF8; --mu: #8FB5B5; --dim: #587878;
  --metal: linear-gradient(178deg, #FFFFFF 10%, #D9FFFA 40%, #5FE6D4 62%, #136660 74%, #E8FFFC 98%);
  --glow: rgba(95, 230, 212, .45);
}
/* les anciens noms de couleurs suivent l'ambiance */
:root, .app, .endg, .welc, .load {
  --abyss: var(--ink); --navy: var(--ink-2);
  --gold-1: var(--hi); --gold-2: var(--a1); --gold-3: var(--a1); --gold-4: var(--a1d);
  --hex-1: var(--b1); --hex-2: var(--b2); --hex-3: var(--b3);
  --line: color-mix(in srgb, var(--a1) 15%, transparent);
  --line-2: color-mix(in srgb, var(--a1) 32%, transparent);
  --panel-bg: linear-gradient(180deg, color-mix(in srgb, var(--ink-2) 96%, transparent), color-mix(in srgb, var(--ink) 97%, transparent));
  --frame-bd: linear-gradient(180deg, var(--hi), var(--a1) 35%, var(--a1d) 75%, var(--a1));
  --glow-a: color-mix(in srgb, var(--b2) 12%, transparent); --glow-b: color-mix(in srgb, var(--a1) 10%, transparent);
  --sun: var(--a1); --sky: var(--b2);
}
html:has(.mood-astral), html:has(.mood-astral) body { background-color: #0D0820; }
html:has(.mood-braise), html:has(.mood-braise) body { background-color: #120604; }
html:has(.mood-sang), html:has(.mood-sang) body { background-color: #0E0406; }
html:has(.mood-or), html:has(.mood-or) body { background-color: #0E0B07; }
html:has(.mood-neon), html:has(.mood-neon) body { background-color: #07040C; }
html:has(.mood-abysse), html:has(.mood-abysse) body { background-color: #010C11; }

/* ── Fond et mise en page ── */
.app { position: relative; min-height: 100dvh; padding-bottom: calc(100px + var(--safe-b)); background: var(--ink); color: var(--tx); }
.app::before { content: ""; position: fixed; left: 0; right: 0; top: 0; height: var(--safe-t); z-index: 150; pointer-events: none; opacity: 0; transition: opacity .25s;
  background: color-mix(in srgb, var(--ink) 84%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.app.scrolled::before { opacity: 1; }
.main { position: relative; z-index: 1; animation: pageIn .22s ease both; }
@keyframes pageIn { from { opacity: 0; } to { opacity: 1; } }
.page { max-width: 480px; margin: 0 auto; padding: 0 16px; }
:focus-visible { outline: 2px solid var(--b2); outline-offset: 2px; border-radius: 3px; }

.metal { background: var(--metal); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }

/* Sections : un titre en Cinzel, pas de boîte autour */
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.sec-h h2 { font-family: var(--fd); font-weight: 700; font-size: 18px; letter-spacing: .03em; color: var(--hi); }
.sec-r { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--mu); white-space: nowrap; }
.sec-r b { font-family: var(--fn); font-weight: 400; font-size: 16px; color: var(--tx); letter-spacing: .02em; }
button.sec-r.link { color: var(--b2); font-weight: 600; }
.kname { font-family: var(--fg); font-weight: 400; font-size: 16px; color: var(--b2); text-shadow: 0 0 12px color-mix(in srgb, var(--b2) 55%, transparent); letter-spacing: .01em; }

/* Cartes : fond d'encre, coins en équerre (comme un cadre d'affiche) */
.card, .panel, .block { position: relative; border-radius: 2px; padding: 16px; margin-bottom: 14px; background: var(--panel-bg); border: 1px solid var(--line); box-shadow: 0 18px 36px -24px rgba(0, 0, 0, .9); }
.stat, .tl-card, .ex, .fav, .rules li { position: relative; border: 1px solid var(--line); background: var(--panel-bg); }
.card::before, .panel::before, .block::before { content: ""; position: absolute; inset: -1px; pointer-events: none; opacity: .75;
  background: linear-gradient(var(--a1), var(--a1)) left top / 12px 1.5px, linear-gradient(var(--a1), var(--a1)) left top / 1.5px 12px,
    linear-gradient(var(--a1), var(--a1)) right top / 12px 1.5px, linear-gradient(var(--a1), var(--a1)) right top / 1.5px 12px,
    linear-gradient(var(--a1), var(--a1)) left bottom / 12px 1.5px, linear-gradient(var(--a1), var(--a1)) left bottom / 1.5px 12px,
    linear-gradient(var(--a1), var(--a1)) right bottom / 12px 1.5px, linear-gradient(var(--a1), var(--a1)) right bottom / 1.5px 12px;
  background-repeat: no-repeat; }
.frame { position: relative; border: 1px solid var(--line-2); background: var(--panel-bg); border-radius: 2px; }

/* Boutons principaux : métal de l'ambiance */
.cta.sun, .wide-btn:not(.ghost) { color: var(--ink); text-shadow: none; border: none;
  background: linear-gradient(180deg, color-mix(in srgb, var(--b2) 45%, #fff), var(--b2) 48%, color-mix(in srgb, var(--b2) 72%, #000)); box-shadow: 0 10px 26px -12px var(--b2), inset 0 1px 0 rgba(255, 255, 255, .45); }
.cta.ghost, .wide-btn.ghost, .pill-btn { background: color-mix(in srgb, var(--ink) 55%, transparent); border: 1px solid var(--line-2); color: var(--hi); }
.seg { background: transparent; border: none; border-bottom: 1px solid var(--line); border-radius: 0; padding: 0; gap: 0; margin: 4px 0 16px; }
.seg button { position: relative; padding: 12px 4px 11px; border-radius: 0; font-family: var(--fd); font-weight: 700; font-size: 13.5px; letter-spacing: .05em; color: var(--dim); }
.seg button.on { color: var(--hi); background: none; box-shadow: none; }
.seg button.on::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: -1px; height: 2px; background: var(--b2); box-shadow: 0 0 10px var(--b2); }
.seg button small { font-family: var(--fb); letter-spacing: 0; color: var(--b2); }

/* ═════════════════════════════════════════════════════════════
   Les affiches
   ═════════════════════════════════════════════════════════════ */
.poster { position: relative; isolation: isolate; overflow: hidden; margin: 0 -16px 20px; padding: calc(var(--safe-t) + 64px) 20px 0; color: var(--hi); }
.poster > .pa { position: absolute; inset: 0; z-index: -3; }
.poster::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; background-image: var(--grain); background-size: 128px; opacity: .55; mix-blend-mode: overlay; }
.bd { overflow: hidden; }
.bd-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; animation: bdIn .9s ease both; }
@keyframes bdIn { from { opacity: 0; } to { opacity: 1; } }

/* Barre du haut posée sur l'affiche */
.tbar { position: absolute; left: 0; right: 0; top: calc(var(--safe-t) + 8px); z-index: 6; display: flex; align-items: center; gap: 8px; padding: 0 14px; }
.tbar-c { flex: 1; min-width: 0; text-align: center; }
.tbar-r { display: flex; gap: 8px; }
.round-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; color: var(--hi); transition: transform .12s;
  background: color-mix(in srgb, var(--ink) 50%, transparent); border: 1px solid color-mix(in srgb, var(--hi) 22%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.round-btn:active { transform: scale(.92); }
.round-btn:disabled { opacity: .3; }
.stamp-d { font-family: var(--fd); font-weight: 700; font-size: 16px; line-height: 1.1; letter-spacing: .14em; text-transform: uppercase; color: var(--hi); text-shadow: 0 2px 14px rgba(0, 0, 0, .55); }
.stamp-n { margin-top: 4px; padding-left: .55em; font-family: var(--fd); font-weight: 600; font-size: 10.5px; letter-spacing: .55em; text-transform: uppercase; color: var(--a1); text-shadow: 0 1px 8px rgba(0, 0, 0, .6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Médaillon (niveau et XP) */
.portrait { position: relative; flex-shrink: 0; border-radius: 50%; }
.portrait svg { position: absolute; inset: 0; overflow: visible; }
.pt-track { fill: none; stroke: color-mix(in srgb, var(--hi) 22%, transparent); stroke-width: 2.5; }
.pt-xp { fill: none; stroke: var(--a1); stroke-width: 2.5; stroke-linecap: round; filter: drop-shadow(0 0 4px var(--a1)); transition: stroke-dashoffset 1s cubic-bezier(.22, 1, .36, 1); }
.pt-in { position: absolute; inset: 5px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 50% 30%, var(--ink-3), var(--ink) 78%);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--a1) 60%, transparent), inset 0 0 0 3px var(--ink), inset 0 0 0 4px color-mix(in srgb, var(--a1) 22%, transparent); }
.pt-l { font-family: var(--fdx); font-weight: 900; font-size: 18px; line-height: 1; color: var(--hi); text-shadow: 0 0 10px var(--glow); transform: translateY(1px); }
.pt-lvl { position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); min-width: 22px; height: 17px; padding: 0 5px; display: grid; place-items: center; border-radius: 9px;
  font-family: var(--fn); font-size: 11.5px; letter-spacing: .03em; line-height: 1; color: var(--ink); background: var(--a1); box-shadow: 0 2px 6px rgba(0, 0, 0, .6); }

/* Montagnes, particules, lune */
.ridges { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 116px; pointer-events: none; }
.rg-back { z-index: 0; }
.rg-front { z-index: 2; }
.tw-gem { fill: var(--b2); filter: drop-shadow(0 0 4px var(--b2)); }
.ptc { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.ptc i { position: absolute; width: calc(3px * var(--s)); height: calc(3px * var(--s)); border-radius: 50%; background: var(--pc, #fff); box-shadow: 0 0 6px var(--pc, #fff); opacity: 0;
  animation: ptcRise var(--d) linear infinite; animation-delay: var(--dl); }
@keyframes ptcRise { 0% { transform: translate(0, 40px); opacity: 0; } 15% { opacity: .9; } 85% { opacity: .7; } 100% { transform: translate(var(--x), -140px); opacity: 0; } }
.ptc-star i { --pc: #FFFFFF; animation-name: ptcTwinkle; width: calc(2px * var(--s)); height: calc(2px * var(--s)); }
@keyframes ptcTwinkle { 0%, 100% { opacity: .1; transform: scale(.6); } 50% { opacity: 1; transform: scale(1.2); } }
.ptc-dust i { --pc: #FFE7B8; width: calc(2px * var(--s)); height: calc(2px * var(--s)); }
.ptc-ember i { --pc: #FF8A3D; border-radius: 1px; }
.ptc-firefly i { --pc: #E6D6FF; animation-name: ptcFloat; }
@keyframes ptcFloat { 0%, 100% { transform: translate(0, 0); opacity: .15; } 50% { transform: translate(var(--x), -26px); opacity: .95; } }
.ptc-bokeh i { --pc: color-mix(in srgb, var(--a1) 55%, transparent); width: calc(18px * var(--s)); height: calc(18px * var(--s)); box-shadow: none; filter: blur(3px); animation-name: ptcFloat; }
.moon { display: block; overflow: visible; }

/* Cadre art déco, séparateur, papier déchiré */
.deco { position: relative; }
.deco > .dc { position: absolute; width: 30px; height: 30px; color: var(--a1); pointer-events: none; z-index: 2; }
.dc-tl { left: -3px; top: -3px; }
.dc-tr { right: -3px; top: -3px; transform: scaleX(-1); }
.dc-bl { left: -3px; bottom: -3px; transform: scaleY(-1); }
.dc-br { right: -3px; bottom: -3px; transform: scale(-1, -1); }
.orn { display: block; width: 100%; height: 14px; color: var(--a1); }
.torn { display: block; width: 100%; height: 16px; color: var(--paper); }
.torn.flip { transform: scaleY(-1); }

/* ── Base, de jour ── */
.p-home { margin-bottom: 18px; }
.ph-head { position: relative; z-index: 3; text-align: center; padding-top: 22px; }
.ph-title { font-family: var(--fdx); font-weight: 900; font-size: 42px; line-height: .98; letter-spacing: .01em; filter: drop-shadow(0 0 18px var(--glow)) drop-shadow(0 3px 3px rgba(0, 0, 0, .4)); }
.ph-tag { margin: 12px auto 0; max-width: 32ch; font-size: 15px; line-height: 1.4; color: color-mix(in srgb, var(--hi) 90%, transparent); text-shadow: 0 1px 12px rgba(0, 0, 0, .6); }
.ph-tag b { color: #FFE3A0; font-weight: 600; }
.ph-stage { position: relative; display: block; width: calc(100% + 40px); height: 206px; margin: 0 -20px; z-index: 2; }
.ph-stage:active .hero-big { filter: drop-shadow(0 0 30px rgba(255, 196, 96, .6)); }
.hero-big { position: absolute; left: 0; right: 0; bottom: 30px; z-index: 1; text-align: center; font-family: var(--fn); font-weight: 400; font-size: 136px; line-height: .8; letter-spacing: .005em; white-space: nowrap;
  background: linear-gradient(180deg, #FFFAEA 4%, #FFE5A0 32%, #EDB252 56%, #A2691F 74%, #F7D58A 96%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
  -webkit-text-stroke: 1px rgba(50, 18, 30, .28); filter: drop-shadow(0 3px 0 rgba(40, 12, 30, .25)) drop-shadow(0 0 24px rgba(255, 190, 90, .38)); }
.ph-foot { position: relative; z-index: 3; margin: 0 -20px; padding: 0 20px 4px; background: var(--ink); }
.ph-of { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px 8px; font-size: 13.5px; color: var(--mu); }
.ph-of b { color: var(--hi); font-weight: 600; }
.ph-of .coin { vertical-align: -3px; margin-right: 3px; }
.ph-chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 99px; font-family: var(--fx); font-weight: 600; font-size: 12.5px; color: var(--hi);
  background: color-mix(in srgb, var(--hi) 7%, transparent); border: 1px solid color-mix(in srgb, var(--hi) 16%, transparent); }
.ph-chip.ok { color: #9DF5C8; border-color: rgba(61, 214, 140, .42); background: rgba(61, 214, 140, .1); }
.ph-chip.late { color: #FFB3BE; border-color: rgba(255, 75, 94, .45); background: rgba(255, 75, 94, .1); }
.ph-chip.camp { color: #FFD9A0; border-color: rgba(255, 181, 71, .42); background: rgba(255, 181, 71, .08); animation: campPulse 2.4s ease-in-out infinite; }
.phb { margin: 14px 2px 0; }
.phb-t { position: relative; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--hi) 10%, transparent); }
.phb-f { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--goldbar); box-shadow: 0 0 12px rgba(242, 198, 109, .55); transition: width 1s cubic-bezier(.22, 1, .36, 1); }
.phb-x { position: absolute; top: -3px; bottom: -3px; width: 1px; background: color-mix(in srgb, var(--hi) 45%, transparent); }
.phb-m { position: absolute; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; transform: rotate(45deg); background: var(--hi); box-shadow: 0 0 0 2px var(--ink), 0 0 10px var(--hi); }
.phb-l { display: flex; margin-top: 7px; font-family: var(--fd); font-weight: 700; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
.phb-l span { flex: none; text-align: center; white-space: nowrap; overflow: hidden; }
.phb-l span:last-child { flex: 1; }
.phb-l span.on { color: var(--a1); }
.ph-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 16px -6px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.ph-stat { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; padding: 11px 2px 10px; text-align: center; }
.ph-stat + .ph-stat::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 1px; background: var(--line); }
.ph-stat:active { background: color-mix(in srgb, var(--hi) 4%, transparent); }
.ps-v { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; font-family: var(--fn); font-size: 19px; line-height: 1.1; letter-spacing: .02em; color: var(--hi); white-space: nowrap; }
.ps-l { max-width: 100%; font-size: 11px; line-height: 1.2; color: var(--mu); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ph-stat.hp svg { color: var(--c-hp); filter: drop-shadow(0 0 4px var(--c-hp)); }
.ph-stat.mana svg { color: var(--c-mana); filter: drop-shadow(0 0 4px var(--c-mana)); }
.ph-stat.streak svg { color: #FF9A4A; filter: drop-shadow(0 0 4px #FF9A4A); }
.ph-stat.streak.flash .ps-l { color: #FFE27A; }

/* ── Base, la nuit ── */
.p-night .ph-head { text-align: left; padding-right: 128px; }
.p-night .ph-tag { margin-left: 0; }
.p-night .pn-moon { position: absolute; right: 2px; top: calc(var(--safe-t) + 70px); z-index: -2; filter: drop-shadow(0 0 34px rgba(205, 182, 255, .5)); animation: moonIn 1.4s ease both; }
@keyframes moonIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.p-night .ph-title { font-size: 48px; }
.p-night .hero-big { font-size: 118px; background: linear-gradient(180deg, #FFFFFF 6%, #E8DEFF 36%, #A58BEE 60%, #5B44A8 76%, #F1EBFF 96%); -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 0 24px rgba(167, 128, 255, .45)); }
.p-night .gbar { margin-top: 4px; }
.pn-s { margin: 10px 0 6px; text-align: center; font-size: 14px; color: var(--mu); }

/* ── Farm : jour de match ── */
.p-farm { min-height: 452px; padding-bottom: 30px; }
.pf-paper { position: absolute; left: 0; top: var(--safe-t); bottom: 0; width: 40%; z-index: -2; overflow: hidden; clip-path: polygon(0 0, 100% 0, 78% 100%, 0 100%);
  background: radial-gradient(120% 80% at 30% 20%, #FBF3E6, #EADBC2 70%, #D9C4A3); }
.pf-paper::after { content: ""; position: absolute; inset: 0; background-image: var(--grain); background-size: 128px; opacity: .9; mix-blend-mode: multiply; }
.pf-word { position: absolute; left: 44%; top: 52%; transform: translate(-50%, -50%) rotate(-90deg); font-family: var(--fn); font-size: 196px; line-height: .78; letter-spacing: -.005em; white-space: nowrap;
  background: linear-gradient(90deg, #7A1606 0%, #D23E14 38%, #FF7A26 70%, #FFB547 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
.pf-main { position: relative; z-index: 2; margin-left: 36%; padding-top: 6px; text-align: right; }
.p-farm .daynav { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin: 0; padding: 0; }
.daynav-t { font-family: var(--fd); font-weight: 700; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--hi); text-shadow: 0 1px 10px rgba(0, 0, 0, .5); }
.dn-b { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; color: var(--hi); background: color-mix(in srgb, var(--ink) 45%, transparent); border: 1px solid color-mix(in srgb, var(--hi) 22%, transparent); }
.dn-b:disabled { opacity: .3; }
.pf-back { display: block; margin: 6px 0 0 auto; color: var(--a1); }
.pf-num { margin-top: 18px; font-family: var(--fn); font-size: 88px; line-height: .84; color: #FFF3DF; text-shadow: 0 0 34px rgba(255, 106, 43, .6), 0 3px 0 rgba(90, 20, 4, .6); }
.pf-of { margin-top: 8px; font-size: 13.5px; color: color-mix(in srgb, var(--hi) 82%, transparent); }
.pf-of .coin { vertical-align: -2px; margin-right: 3px; }
.pf-vs { margin-top: 20px; font-family: var(--fn); font-size: 23px; line-height: 1.02; letter-spacing: .02em; text-transform: uppercase; color: var(--hi); }
.pf-vs span { display: block; margin-bottom: 3px; font-family: var(--fd); font-weight: 700; font-size: 11px; letter-spacing: .34em; color: var(--a1); }
.pf-list { margin-top: 18px; display: grid; gap: 8px; }
.pf-list div { display: flex; justify-content: flex-end; align-items: baseline; gap: 12px; }
.pf-list dt { font-family: var(--fx); font-weight: 600; font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--mu); }
.pf-list dd { font-family: var(--fn); font-size: 20px; letter-spacing: .03em; color: var(--hi); min-width: 3.2em; }
.pf-list dd small { font-family: var(--fb); font-size: 12px; letter-spacing: 0; color: var(--mu); }
.pf-list .ok dd { color: #9DF5C8; }
.pf-bars { position: relative; z-index: 2; margin-top: 24px; }
.pf-bars .pbar { margin: 0; }
.pf-bars .pbar-top { display: none; }
.pf-bars .pbar-track { height: 8px; background: color-mix(in srgb, var(--ink) 70%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--hi) 14%, transparent); }
.pf-hint { display: block; margin-top: 7px; font-size: 12px; color: color-mix(in srgb, var(--hi) 62%, transparent); text-align: right; }
.pf-torn { position: absolute; left: 0; right: 0; bottom: -2px; z-index: 3; color: var(--ink); }

/* ── Arène : damas et cramoisi ── */
.p-arene { padding-bottom: 20px; }
.pr-damask { position: absolute; inset: 0; z-index: -2; background-size: 64px 96px; background-position: center top;
  -webkit-mask-image: linear-gradient(162deg, #000 0, #000 38%, transparent 62%); mask-image: linear-gradient(162deg, #000 0, #000 38%, transparent 62%); }
.pr-cut { position: absolute; inset: 0; z-index: -2; background: linear-gradient(164deg, transparent 0, transparent 46%, color-mix(in srgb, var(--ink) 92%, transparent) 46.3%, var(--ink) 100%); }
.pr-head { position: relative; padding-top: 22px; }
.pr-k { font-family: var(--fd); font-weight: 700; font-size: 12px; letter-spacing: .28em; text-transform: uppercase; color: var(--a1); text-shadow: 0 1px 10px rgba(0, 0, 0, .6); }
.pr-title { margin-top: 6px; font-family: var(--fdx); font-weight: 900; font-size: 64px; line-height: .9; filter: drop-shadow(0 4px 16px rgba(0, 0, 0, .6)); }
.pr-script { position: absolute; left: 108px; top: 84px; font-family: var(--fs); font-size: 58px; line-height: 1; color: #FF2E4A; transform: rotate(-9deg); white-space: nowrap; pointer-events: none;
  text-shadow: 0 2px 0 #3A0008, 0 0 20px rgba(255, 46, 74, .55); }
.pr-mana { position: relative; margin-top: 54px; }
.pr-num { display: flex; align-items: baseline; gap: 8px; font-family: var(--fn); }
.pr-num span { font-size: 80px; line-height: .84; color: #F4F8FF; text-shadow: 0 0 28px rgba(91, 164, 255, .6); }
.pr-num small { font-size: 18px; letter-spacing: .04em; color: var(--mu); }
.pr-mana .gbar { margin-top: 14px; }
.pr-adv { margin-top: 10px; font-size: 14px; line-height: 1.45; color: color-mix(in srgb, var(--hi) 86%, transparent); }
.pr-adv b { color: var(--hi); font-weight: 600; }
.pr-crea { display: grid; gap: 8px; width: 100%; margin-top: 14px; padding: 11px 12px; border-radius: 2px; text-align: left; font-size: 12.5px; color: var(--mu);
  background: color-mix(in srgb, var(--ink) 60%, transparent); border: 1px solid color-mix(in srgb, var(--hi) 12%, transparent); }
.pr-crea b { color: var(--hi); font-weight: 600; margin-right: 4px; }

/* ── Profil : carte art déco ── */
.p-profil { padding-bottom: 22px; text-align: center; }
.po-rays { position: absolute; inset: 0; z-index: -2; background: repeating-conic-gradient(from 0deg at 50% 64%, color-mix(in srgb, var(--a1) 13%, transparent) 0deg 3deg, transparent 3deg 11deg);
  -webkit-mask-image: radial-gradient(70% 55% at 50% 64%, #000 10%, transparent 72%); mask-image: radial-gradient(70% 55% at 50% 64%, #000 10%, transparent 72%); }
.po-card { position: relative; max-width: 330px; margin: 20px auto 0; padding: 22px 22px 30px; color: var(--a1);
  background: linear-gradient(180deg, color-mix(in srgb, var(--ink) 58%, transparent), color-mix(in srgb, var(--ink) 84%, transparent)); border: 1px solid color-mix(in srgb, var(--a1) 34%, transparent); }
.po-card::before { content: ""; position: absolute; inset: 6px; border: 1px solid color-mix(in srgb, var(--a1) 18%, transparent); pointer-events: none; }
.po-lvl { font-family: var(--fd); font-weight: 600; font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--mu); }
.po-name { margin-top: 10px; font-family: var(--fdx); font-weight: 900; font-size: 46px; line-height: .95; filter: drop-shadow(0 0 16px var(--glow)); overflow-wrap: anywhere; }
.po-title { margin: 2px 0 4px; font-family: var(--fs); font-size: 36px; line-height: 1.1; color: var(--b2); transform: rotate(-4deg); text-shadow: 0 0 16px color-mix(in srgb, var(--b2) 45%, transparent); }
.po-card .gbar { margin-top: 10px; }
.po-orn { width: 170px; margin: 12px auto 0; }
.po-emb { position: relative; z-index: 3; width: 104px; margin: -22px auto 0; filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .65)) drop-shadow(0 0 22px var(--glow)); }
.po-emb .emblem { display: block; }
.po-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 8px; }
.po-stats div { display: flex; flex-direction: column; gap: 2px; padding: 6px 4px; }
.po-stats div + div { border-left: 1px solid var(--line); }
.po-stats b { font-family: var(--fn); font-weight: 400; font-size: 20px; letter-spacing: .02em; color: var(--hi); }
.po-stats span { font-size: 11px; line-height: 1.25; color: var(--mu); }
.po-btns { display: flex; justify-content: center; gap: 10px; margin-top: 14px; }

/* ═════════════════════════════════════════════════════════════
   L'accueil, sous l'affiche
   ═════════════════════════════════════════════════════════════ */
.home { padding-top: 0; }
/* Maintenant : la prochaine action */
.now { --pc: var(--c-gold); position: relative; margin: 0 0 24px; padding: 16px 16px 15px 18px; border-radius: 2px;
  background: linear-gradient(100deg, color-mix(in srgb, var(--pc) 13%, var(--ink-2)), var(--ink-2) 62%); border: 1px solid color-mix(in srgb, var(--pc) 28%, transparent); }
.now::before { content: ""; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 3px; background: var(--pc); box-shadow: 0 0 14px var(--pc); }
.now.ping-recall { --pc: #A99BFF; }
.now.ping-vision { --pc: #FFE27A; }
.now.ping-prot { --pc: #FF8A3D; }
.now.ping-heal { --pc: var(--c-hp); }
.now.quiet { --pc: var(--a1); }
.now-h { display: flex; align-items: flex-start; gap: 13px; }
.now-ic { width: 34px; height: 34px; margin: 3px 2px 0; flex-shrink: 0; display: grid; place-items: center; color: var(--pc); border: 1px solid color-mix(in srgb, var(--pc) 50%, transparent); border-radius: 3px; transform: rotate(45deg);
  background: color-mix(in srgb, var(--pc) 10%, transparent); }
.now-ic svg { transform: rotate(-45deg); }
.now-tx { min-width: 0; }
.now-t { font-family: var(--fd); font-weight: 700; font-size: 18px; line-height: 1.22; color: var(--hi); }
.now-s { margin-top: 3px; font-size: 14px; color: var(--mu); }
.now-act { display: flex; gap: 10px; margin-top: 14px; }
.now-act.col { flex-direction: column; gap: 6px; }
.now-btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 16px; border-radius: 2px; font-family: var(--fx); font-weight: 700; font-size: 16px; letter-spacing: .02em; color: var(--ink);
  background: linear-gradient(180deg, color-mix(in srgb, var(--pc) 50%, #fff), var(--pc) 52%, color-mix(in srgb, var(--pc) 72%, #000)); box-shadow: 0 10px 24px -12px var(--pc), inset 0 1px 0 rgba(255, 255, 255, .5); }
.now-btn:active { transform: scale(.98); }
.now-btn.moon { --pc: #B3A6FF; }
.now-btn.ghost { color: var(--tx); background: transparent; border: 1px solid var(--line-2); box-shadow: none; }
.now-fav { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 11px 12px 11px 14px; border-radius: 2px; text-align: left;
  background: color-mix(in srgb, var(--pc) 9%, var(--ink)); border: 1px solid color-mix(in srgb, var(--pc) 34%, transparent); }
.now-fav:active { transform: scale(.985); }
.nf-tx { display: flex; flex-direction: column; min-width: 0; }
.nf-n { font-weight: 600; font-size: 15.5px; color: var(--hi); }
.nf-k { font-size: 12.5px; color: var(--c-gold); }
.nf-plus { width: 36px; height: 36px; margin-right: 4px; flex-shrink: 0; display: grid; place-items: center; color: var(--ink); background: var(--pc); border-radius: 3px; transform: rotate(45deg); box-shadow: 0 0 16px color-mix(in srgb, var(--pc) 55%, transparent); }
.nf-plus svg { transform: rotate(-45deg); }
.now-alt { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; padding: 5px 2px; font-size: 13.5px; color: var(--mu); }
.now-next { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
.now-nl { font-size: 12px; color: var(--dim); }
.nx { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 99px; font-size: 13px; color: var(--tx); border: 1px solid var(--line-2); }

/* Objectifs du jour : l'escouade de 5 kills */
.kills { margin-bottom: 26px; }
.squad { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.kcard { --kc: var(--c-gold); display: flex; flex-direction: column; align-items: center; gap: 7px; min-width: 0; transition: transform .12s; }
.kcard:active { transform: scale(.95); }
.k-prot { --kc: #FF8A3D; }
.k-sleep { --kc: #4FE39A; }
.k-crea { --kc: #44D7FF; }
.k-train { --kc: #FF4B5E; }
.kcard-f { position: relative; isolation: isolate; width: 100%; aspect-ratio: 3 / 4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; padding-top: 8px;
  clip-path: polygon(0 13%, 50% 0, 100% 13%, 100% 100%, 0 100%); background: color-mix(in srgb, var(--hi) 18%, transparent); }
.kcard-f::before { content: ""; position: absolute; inset: 1.5px; z-index: -2; clip-path: polygon(0 13%, 50% 0, 100% 13%, 100% 100%, 0 100%); background: linear-gradient(180deg, var(--ink-3), var(--ink) 82%); }
.kcard-fill { position: absolute; left: 1.5px; right: 1.5px; bottom: 1.5px; z-index: -1; height: calc((100% - 3px) * var(--kp)); transition: height .8s cubic-bezier(.22, 1, .36, 1);
  background: linear-gradient(0deg, color-mix(in srgb, var(--kc) 38%, transparent), color-mix(in srgb, var(--kc) 8%, transparent)); }
.kcard-ic { display: grid; place-items: center; color: color-mix(in srgb, var(--hi) 42%, transparent); }
.kcard-v { max-width: 100%; padding: 0 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--fx); font-weight: 600; font-size: 11px; line-height: 1.1; color: var(--mu); }
.kcard-n { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--fd); font-weight: 700; font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
.kcard.on { filter: drop-shadow(0 0 10px color-mix(in srgb, var(--kc) 55%, transparent)); }
.kcard.on .kcard-f { background: linear-gradient(180deg, #FFFFFF, var(--kc) 26%, color-mix(in srgb, var(--kc) 45%, #000)); }
.kcard.on .kcard-f::before { background: linear-gradient(180deg, color-mix(in srgb, var(--kc) 30%, var(--ink-3)), var(--ink) 85%); }
.kcard.on .kcard-ic { color: var(--kc); filter: drop-shadow(0 0 6px var(--kc)); }
.kcard.on .kcard-v { color: var(--hi); }
.kcard.on .kcard-n { color: var(--hi); }
.kcard.mini { gap: 5px; }
.kcard.mini .kcard-f { aspect-ratio: 1 / 1.12; }

/* Inventaire : médaillons ronds */
.inv { margin-bottom: 26px; }
.inv-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px 8px; }
.islot { --ic: var(--a1); position: relative; display: flex; flex-direction: column; align-items: center; gap: 7px; min-width: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.islot-f { position: relative; width: 64px; height: 64px; padding: 2px; border-radius: 50%; transition: transform .12s;
  background: conic-gradient(from 200deg, color-mix(in srgb, var(--hi) 34%, transparent), color-mix(in srgb, var(--hi) 8%, transparent) 40%, color-mix(in srgb, var(--hi) 34%, transparent) 70%, color-mix(in srgb, var(--hi) 8%, transparent)); }
.islot-in { width: 100%; height: 100%; display: grid; place-items: center; border-radius: 50%; background: radial-gradient(circle at 50% 30%, var(--ink-3), var(--ink) 78%);
  box-shadow: inset 0 0 0 3px var(--ink), inset 0 0 0 4px color-mix(in srgb, var(--hi) 10%, transparent); }
.islot-in .iart { filter: grayscale(.9) brightness(.62); transition: filter .3s; }
.islot.on .islot-f { background: conic-gradient(from 200deg, #FFFFFF, var(--ic) 25%, color-mix(in srgb, var(--ic) 40%, #000) 50%, var(--ic) 75%, #FFFFFF); box-shadow: 0 0 20px -4px color-mix(in srgb, var(--ic) 75%, transparent); }
.islot.on .islot-in .iart { filter: none; }
.islot:active .islot-f { transform: scale(.93); }
.islot-n { position: absolute; top: 46px; left: calc(50% + 15px); min-width: 22px; height: 20px; padding: 0 5px; display: grid; place-items: center; border-radius: 10px;
  font-family: var(--fn); font-size: 12px; line-height: 1; color: var(--hi); background: var(--ink); border: 1px solid color-mix(in srgb, var(--ic) 70%, transparent); }
.islot-pip { position: absolute; top: -3px; left: calc(50% + 17px); width: 19px; height: 19px; display: grid; place-items: center; border-radius: 50%; font-family: var(--fn); font-size: 12px; color: #fff;
  background: var(--c-red); box-shadow: 0 0 10px var(--c-red); animation: campPulse 1.6s ease-in-out infinite; }
.islot-l { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11.5px; line-height: 1.15; color: var(--mu); }
.islot.on .islot-l { color: var(--hi); }
.islot.big .islot-f { width: 88px; height: 88px; }
.islot.big .islot-n { top: 66px; left: calc(50% + 22px); }

/* Quêtes : des contrats sur parchemin */
.parch { position: relative; margin: 0 -4px 26px; color: var(--paper-ink); filter: drop-shadow(0 14px 22px rgba(0, 0, 0, .5)); }
.parch-edge { color: var(--paper); margin: 0; }
.parch-in { position: relative; padding: 8px 18px 10px; background: var(--paper); }
.parch-in::after { content: ""; position: absolute; inset: 0; background-image: var(--grain); background-size: 128px; opacity: .85; mix-blend-mode: multiply; pointer-events: none; }
.parch-h { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 8px; margin-bottom: 4px; border-bottom: 1px solid rgba(43, 23, 18, .2); }
.parch-h h2 { font-family: var(--fd); font-weight: 800; font-size: 18px; letter-spacing: .03em; color: #5E0E18; }
.parch-n { font-size: 12.5px; color: #6B5246; }
.parch-n b { font-family: var(--fn); font-weight: 400; font-size: 16px; color: #5E0E18; }
.parch .qst { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; padding: 10px 0; }
.parch .qst + .qst { border-top: 1px dashed rgba(43, 23, 18, .22); }
.qst-c { width: 22px; height: 22px; flex-shrink: 0; display: grid; place-items: center; border: 1.5px solid rgba(43, 23, 18, .55); border-radius: 2px; color: #FFF6EA; transform: rotate(45deg); }
.qst-c svg { transform: rotate(-45deg); }
.qst.on .qst-c { background: var(--seal); border-color: var(--seal); box-shadow: 0 0 0 3px rgba(163, 18, 42, .16); }
.qst-tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.qst-tx b { font-family: var(--fd); font-weight: 700; font-size: 15px; color: var(--paper-ink); }
.qst-tx span { font-size: 13px; color: #6B5246; }
.qst.on .qst-tx b { text-decoration: line-through; text-decoration-color: rgba(163, 18, 42, .7); text-decoration-thickness: 2px; }
.qst-xp { font-family: var(--fn); font-size: 15px; letter-spacing: .02em; color: #8A1222; white-space: nowrap; }

/* Boss de la semaine : affiche cramoisie */
.bossc { position: relative; isolation: isolate; overflow: hidden; display: flex; align-items: center; gap: 14px; width: 100%; margin-bottom: 26px; padding: 16px 16px 16px 10px; text-align: left; border-radius: 2px;
  background: linear-gradient(115deg, #3A0610 0%, #1C0408 55%, #0E0205 100%); border: 1px solid rgba(255, 75, 94, .32); box-shadow: 0 18px 34px -22px rgba(0, 0, 0, .9); transition: transform .12s; }
.bossc:active { transform: scale(.985); }
.bossc-dm { position: absolute; inset: 0; z-index: -1; background-size: 64px 96px; -webkit-mask-image: linear-gradient(90deg, #000, transparent 70%); mask-image: linear-gradient(90deg, #000, transparent 70%); }
.bossc-art { flex-shrink: 0; margin: -8px -2px -14px -4px; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .7)) drop-shadow(0 0 18px rgba(255, 46, 74, .35)); }
.bossc-m { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.bossc-k { font-family: var(--fd); font-weight: 700; font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase; color: #FF8A98; }
.bossc-n { font-family: var(--fdx); font-weight: 900; font-size: 21px; line-height: 1.05; color: #FFF1EE; text-shadow: 0 2px 12px rgba(255, 46, 74, .45); }
.bossc-s { font-size: 12.5px; color: #D7AFB3; }
.bossc.rage { border-color: rgba(255, 106, 61, .6); }
.bossc.dead { background: linear-gradient(115deg, #20171A, #100B0D); border-color: rgba(255, 255, 255, .14); }
.bossc.dead .bossc-n { color: #B9A9AC; text-decoration: line-through; text-decoration-color: rgba(255, 75, 94, .7); }
.bossart { display: block; overflow: visible; }

/* Coach, plan, semaine */
.cbar { border-radius: 2px; margin-bottom: 26px; }
.cbar-ic { clip-path: none; width: 36px; height: 36px; border-radius: 3px; transform: rotate(45deg); margin: 0 4px; background: radial-gradient(circle at 50% 40%, var(--b2), var(--b3)); color: var(--ink); }
.cbar-ic svg { transform: rotate(-45deg); }
.cbar-tx b { font-family: var(--fd); font-size: 15.5px; }
.wks { margin-bottom: 26px; }
.wk-r { width: 32px; height: 32px; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); font-family: var(--fn); font-weight: 400; font-size: 15px; line-height: 1; }
.wk.today { background: color-mix(in srgb, var(--b2) 8%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--b2) 32%, transparent); }
.wk.today .wk-d { color: var(--b2); }

/* Classé : cadre art déco, l'emblème déborde */
.rankc { display: flex; align-items: center; gap: 14px; width: 100%; margin: 14px 0 26px; padding: 18px 16px; text-align: left; border-radius: 0; color: var(--a1);
  background: linear-gradient(180deg, var(--ink-2), var(--ink)); border: 1px solid var(--line-2); }
.rankc::after { content: ""; position: absolute; inset: 5px; border: 1px solid var(--line); pointer-events: none; }
.rankc-e { flex-shrink: 0; margin: -30px -4px -24px 0; filter: drop-shadow(0 10px 16px rgba(0, 0, 0, .65)) drop-shadow(0 0 16px var(--glow)); }
.rankc-m { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.rankc-k { font-size: 12px; color: var(--mu); }
.rankc-n { font-family: var(--fdx); font-weight: 900; font-size: 24px; line-height: 1; color: var(--hi); }
.rankc-s { font-size: 12.5px; color: var(--mu); }
.rankc-s .up { color: #9DF5C8; }
.rankc-s .down { color: #FFB3BE; }

/* Barres de jeu : plus fines, plus nettes */
.gbar-track { height: 17px; border-radius: 1px; background: color-mix(in srgb, var(--ink) 80%, #000); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--hi) 18%, transparent), inset 0 2px 6px rgba(0, 0, 0, .85); }
.gbar.mana { --bc: var(--c-mana); --bf: linear-gradient(90deg, #163A9A, #3C83FF 55%, #8FD4FF); }
.gbar.xp { --bc: var(--a1); --bf: linear-gradient(90deg, var(--a1d), var(--a1) 70%, var(--hi)); }
.gbar.lp { --bc: var(--a1); --bf: linear-gradient(90deg, var(--a1d), var(--a1) 60%, var(--hi)); }
.gbar.hp { --bf: linear-gradient(90deg, #0E5A36, #2BB873 60%, #8BF5C2); }
.gbar-track::after { opacity: .55; }
.gbar-t { font-size: 11.5px; letter-spacing: .02em; }
.gbar.big .gbar-track { height: 22px; }

/* ═════════════════════════════════════════════════════════════
   Barre du bas
   ═════════════════════════════════════════════════════════════ */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 100; padding: 0 0 var(--safe-b); pointer-events: none;
  background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--ink) 92%, transparent) 30%, var(--ink)); }
.nav-in { pointer-events: auto; position: relative; max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr 84px 1fr 1fr; align-items: end; padding: 10px 8px 6px;
  background: color-mix(in srgb, var(--ink-2) 86%, transparent); border-top: 1px solid var(--line-2); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.nav-in::before { content: ""; position: absolute; left: 0; right: 0; top: 3px; height: 1px; background: linear-gradient(90deg, transparent, var(--line) 20%, var(--line) 80%, transparent); pointer-events: none; }
.nb { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0 3px; color: var(--dim); font-family: var(--fd); font-weight: 700; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; }
.nb svg { transition: color .25s, filter .25s; }
.nb.on { color: var(--hi); }
.nb.on svg { color: var(--b2); filter: drop-shadow(0 0 6px var(--b2)); }
.nb.on::before { content: ""; position: absolute; top: -14px; left: 50%; width: 7px; height: 7px; margin-left: -3.5px; transform: rotate(45deg); background: var(--b2); box-shadow: 0 0 10px var(--b2); }
.nb:active svg { transform: scale(.92); }
.fab { position: relative; justify-self: center; width: 60px; height: 60px; margin-top: -34px; display: grid; place-items: center; transition: transform .14s; filter: drop-shadow(0 0 14px color-mix(in srgb, var(--b2) 50%, transparent)) drop-shadow(0 8px 10px rgba(0, 0, 0, .7)); }
.fab::before { content: ""; position: absolute; inset: 0; border-radius: 6px; transform: rotate(45deg); background: linear-gradient(180deg, #FFFFFF, var(--a1) 40%, var(--a1d)); }
.fab-in { position: relative; width: 52px; height: 52px; display: grid; place-items: center; color: #fff; }
.fab-in::before { content: ""; position: absolute; inset: 0; border-radius: 5px; transform: rotate(45deg); background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--b2) 60%, #fff), var(--b2) 45%, var(--b3) 100%); }
.fab-in svg { position: relative; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .5)); }
.fab:active { transform: scale(.9); }

/* ═════════════════════════════════════════════════════════════
   Les grands moments
   ═════════════════════════════════════════════════════════════ */
.load, .endg, .welc { position: fixed; inset: 0; z-index: 500; isolation: isolate; overflow: hidden; color: var(--hi); }
.load > .pa, .endg > .pa, .welc > .pa { position: absolute; inset: 0; z-index: -3; }
.load::after, .endg::after, .welc::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; background-image: var(--grain); background-size: 128px; opacity: .55; mix-blend-mode: overlay; }

/* Écran de chargement : affiche de match, toi contre le boss */
.load { display: flex; flex-direction: column; padding: calc(var(--safe-t) + 26px) 22px calc(var(--safe-b) + 22px); animation: fadeIn .25s ease both; }
.load-dm { position: absolute; inset: 0; z-index: -2; background-size: 64px 96px; -webkit-mask-image: linear-gradient(180deg, transparent, #000 40%, transparent); mask-image: linear-gradient(180deg, transparent, #000 40%, transparent); }
.load-paper { position: absolute; left: 0; right: 0; top: var(--safe-t); height: 47%; z-index: -2; clip-path: polygon(0 0, 100% 0, 100% 72%, 0 100%); background: radial-gradient(120% 90% at 30% 10%, #FBF3E6, #E8D8BE 70%, #D4BE9B); }
.load-paper::after { content: ""; position: absolute; inset: 0; background-image: var(--grain); background-size: 128px; mix-blend-mode: multiply; }
.load-head { display: flex; justify-content: space-between; align-items: baseline; color: #3A1A0F; }
.load-k { font-family: var(--fd); font-weight: 800; font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: #8A1222; }
.load-d { font-size: 13px; color: #5A3B2E; }
.load-vs { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.lcard { display: flex; flex-direction: column; animation: cardIn .6s cubic-bezier(.22, 1, .36, 1) both; }
.lcard.me { align-items: flex-start; color: #2B1712; }
.lcard.foe { align-items: flex-end; text-align: right; animation-delay: .12s; }
.lcard-art { filter: drop-shadow(0 8px 14px rgba(0, 0, 0, .45)); }
.lcard-n { font-family: var(--fn); font-weight: 400; font-size: 60px; line-height: .9; letter-spacing: .01em; text-transform: uppercase; }
.lcard.me .lcard-n { background: linear-gradient(90deg, #7A1606, #D23E14 55%, #FF7A26); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
.lcard.foe .lcard-n { font-size: 40px; color: #FFF1EE; text-shadow: 0 0 26px rgba(255, 46, 74, .55); }
.lcard-s { margin-top: 4px; font-size: 13.5px; }
.lcard.me .lcard-s { color: #5A3B2E; }
.lcard.foe .lcard-s { color: #E9C2C6; }
.load-x { align-self: center; margin: 6px 0; font-family: var(--fs); font-size: 76px; line-height: .8; color: #FF2E4A; transform: rotate(-10deg); text-shadow: 0 3px 0 #3A0008, 0 0 24px rgba(255, 46, 74, .6); }
.load-last, .load-tip { position: relative; font-size: 14px; line-height: 1.45; color: color-mix(in srgb, var(--hi) 86%, transparent); text-align: center; margin: 0 auto 10px; max-width: 34ch; }
.load-last { color: var(--mu); font-size: 13px; }
.load-bar { position: relative; height: 3px; margin: 10px 16px 10px; background: rgba(255, 255, 255, .12); overflow: hidden; }
.load-bar i { position: absolute; inset: 0; transform-origin: left; background: linear-gradient(90deg, #FF2E4A, #FFB547); animation: loadFill 2.6s linear both; }
@keyframes loadFill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.load-skip { text-align: center; font-size: 12px; color: var(--dim); }

/* Fin de partie : or pour une victoire, cramoisi pour une défaite */
.endg.win { --ink: #0E0B07; --ink-2: #19140C; --ink-3: #2A2214; --hi: #FFF8E6; --a1: #E2BF72; --a1d: #7C5A2A; --b1: #FFE9B8; --b2: #F2B54E; --b3: #9A6A22; --tx: #F6EFE1; --mu: #B8AB92; --dim: #7C725F; }
.endg.lose { --ink: #0E0406; --ink-2: #1A070B; --ink-3: #2D0C14; --hi: #FBF2EA; --a1: #EBD9C4; --a1d: #7E6550; --b1: #FFC9CF; --b2: #F0364A; --b3: #8E0E1E; --tx: #F7EDE7; --mu: #C0A2A3; --dim: #7E6264; }
.endg { display: flex; align-items: center; justify-content: center; padding: calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 14px); overflow-y: auto; animation: fadeIn .3s ease both; }
.endg-rays { position: absolute; inset: 0; z-index: -2; background: repeating-conic-gradient(from 0deg at 50% 24%, rgba(255, 228, 160, .12) 0deg 3deg, transparent 3deg 10deg);
  -webkit-mask-image: radial-gradient(70% 45% at 50% 24%, #000, transparent 75%); mask-image: radial-gradient(70% 45% at 50% 24%, #000, transparent 75%); }
.endg.lose .endg-rays { display: none; }
.endg-in { position: relative; width: 100%; max-width: 400px; margin: auto; padding: 24px 18px 18px; color: #E2BF72; text-align: center;
  background: linear-gradient(180deg, rgba(14, 11, 7, .72), rgba(14, 11, 7, .9)); border: 1px solid rgba(226, 191, 114, .4); animation: endIn .5s cubic-bezier(.22, 1, .36, 1) both; }
.endg.lose .endg-in { color: #F0364A; background: linear-gradient(180deg, rgba(20, 4, 8, .74), rgba(14, 3, 6, .92)); border-color: rgba(240, 54, 74, .38); }
.endg-in::before { content: ""; position: absolute; inset: 6px; border: 1px solid currentColor; opacity: .22; pointer-events: none; }
.endg-k { font-family: var(--fd); font-weight: 700; font-size: 11.5px; letter-spacing: .3em; text-transform: uppercase; color: rgba(255, 244, 222, .7); }
.endg-t { margin-top: 6px; font-family: var(--fdx); font-weight: 900; font-size: 52px; line-height: 1; letter-spacing: .01em;
  background: linear-gradient(178deg, #FFFBEA 10%, #F6DB94 38%, #C9973F 58%, #7C5A2A 72%, #FFE8A8 98%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 20px rgba(226, 191, 114, .45)); }
.endg.lose .endg-t { background-image: linear-gradient(178deg, #FFFFFF 10%, #F8E4E0 38%, #E0283F 60%, #6E0F1E 74%, #FFD6DC 98%); filter: drop-shadow(0 0 20px rgba(240, 54, 74, .45)); }
.endg-orn { width: 180px; margin: 10px auto 12px; }
.endg-g { display: flex; align-items: center; justify-content: center; gap: 12px; font-family: var(--fg); font-size: 20px; color: #FFF4DE; }
.endg-kills { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin: 16px 0 14px; }
.endg-stats { display: grid; gap: 2px; margin-bottom: 12px; text-align: left; }
.es { padding: 8px 12px; border-top-color: rgba(255, 244, 222, .1); }
.es-l { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; color: rgba(255, 244, 222, .72); }
.es-v { font-size: 12.5px; color: rgba(255, 244, 222, .55); }
.es-v b { font-family: var(--fn); font-weight: 400; font-size: 17px; letter-spacing: .02em; color: #FFF4DE; }
.es.ok .es-l { color: #9DF5C8; }
.endg-xp b { font-family: var(--fn); font-weight: 400; letter-spacing: .02em; color: var(--b2); }
.endg-rc { margin-bottom: 14px; padding: 12px; text-align: left; background: rgba(0, 0, 0, .3); border-left: 2px solid currentColor; }
.endg-rc h3 { margin-bottom: 6px; font-family: var(--fd); font-weight: 700; font-size: 14px; color: #FFF4DE; }
.endg-rc p { display: flex; gap: 8px; font-size: 13.5px; color: rgba(255, 244, 222, .8); margin-top: 4px; }
.endg-rc p svg { flex-shrink: 0; margin-top: 2px; }
.endg.lose .cta.sun { color: #fff; }

/* Import du compte (première ouverture) */
.welc { display: flex; align-items: center; justify-content: center; padding: calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 16px); overflow-y: auto; animation: fadeIn .3s ease both; }
.welc-in { position: relative; width: 100%; max-width: 400px; margin: auto; padding: 26px 18px 18px; text-align: center; color: var(--a1);
  background: linear-gradient(180deg, color-mix(in srgb, var(--ink) 60%, transparent), color-mix(in srgb, var(--ink) 88%, transparent)); border: 1px solid var(--line-2); }
.welc-k { font-family: var(--fd); font-weight: 700; font-size: 11.5px; letter-spacing: .3em; text-transform: uppercase; color: var(--mu); }
.welc-t { margin-top: 8px; font-family: var(--fdx); font-weight: 900; font-size: 40px; line-height: 1; background: var(--metal); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
.welc-p { margin: 12px auto 16px; max-width: 32ch; font-size: 14.5px; color: var(--tx); }

/* ═════════════════════════════════════════════════════════════
   Les annonces : des tags au marqueur néon
   ═════════════════════════════════════════════════════════════ */
.ann { --n1: #FFE14D; position: fixed; left: 0; right: 0; top: 18%; z-index: 600; display: flex; flex-direction: column; align-items: center; pointer-events: none; animation: annIn 2s ease both; }
.ann.big { animation-duration: 2.7s; }
.ann.t-red { --n1: #FF3D6E; } .ann.t-cyan { --n1: #33F0FF; } .ann.t-blue { --n1: #5BA4FF; } .ann.t-green { --n1: #5CFF9D; } .ann.t-purple { --n1: #B05CFF; } .ann.t-gold { --n1: #FFE14D; }
.ann-glow { position: absolute; left: 50%; top: 50%; width: 140vw; height: 300px; transform: translate(-50%, -50%); z-index: -1;
  background: radial-gradient(closest-side, rgba(5, 2, 10, .88), rgba(5, 2, 10, .6) 55%, transparent); }
.ann .doodles { position: absolute; left: 50%; top: 50%; width: 340px; height: 230px; transform: translate(-50%, -50%); z-index: -1; }
.doodles svg { position: absolute; margin: -20px 0 0 -20px; color: var(--nc); transform: rotate(var(--rot)); filter: drop-shadow(0 0 4px var(--nc)) drop-shadow(0 0 10px var(--nc)); }
.ann .doodles path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .5s ease-out forwards; animation-delay: calc(.15s + var(--dl)); }
.ann-art { margin-bottom: 4px; filter: drop-shadow(0 6px 16px rgba(0, 0, 0, .7)); animation: pop .4s cubic-bezier(.34, 1.56, .64, 1) both; }
.ann-k { font-family: var(--fd); font-weight: 800; font-size: 12px; letter-spacing: .34em; text-transform: uppercase; color: #fff; text-shadow: 0 0 10px var(--n1); }
.ann-tag { position: relative; margin-top: 2px; transform: rotate(-4deg); }
.ann-t { position: relative; z-index: 1; padding: 0 16px; max-width: 94vw; font-family: var(--fg); font-size: 50px; line-height: 1.02; text-align: center; color: #FFFFFF;
  text-shadow: 0 0 2px #fff, 0 0 8px var(--n1), 0 0 20px var(--n1), 0 0 42px var(--n1), 3px 4px 0 rgba(0, 0, 0, .5); }
.ann.big .ann-t { font-size: 58px; }
.drips { position: absolute; left: 12%; right: 12%; top: 78%; width: 76%; height: 30px; color: var(--n1); opacity: .75; filter: drop-shadow(0 0 5px var(--n1)); transform-origin: top; animation: drip 1.4s ease-out both .2s; }
@keyframes drip { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.ann-s { margin-top: 12px; padding: 0 22px; max-width: 92vw; text-align: center; font-family: var(--fx); font-weight: 600; font-size: 15px; color: #fff; text-shadow: 0 1px 8px #000, 0 0 2px #000; }
@keyframes annIn { 0% { opacity: 0; transform: scale(1.35); filter: blur(4px); } 10% { opacity: 1; transform: scale(1); filter: blur(0); } 85% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-8px); } }
@keyframes draw { to { stroke-dashoffset: 0; } }

/* ── Skin Graffiti : des tags sur les affiches ── */
.skin-neon .ph-title, .skin-neon .pr-title, .skin-neon .po-name { font-family: var(--fg); font-weight: 400; letter-spacing: 0; }
.poster > .doodles { position: absolute; inset: 0; z-index: -2; opacity: .5; pointer-events: none; }

/* ── Fiches (panneaux du bas) ── */
.sheet { background: linear-gradient(180deg, var(--ink-2), var(--ink) 40%); border-top: 1px solid var(--line-2); }
.sheet::before { content: ""; position: absolute; left: 18%; right: 18%; top: -1px; height: 1px; background: linear-gradient(90deg, transparent, var(--a1), transparent); pointer-events: none; }
.sheet-title { font-family: var(--fd); font-weight: 700; font-size: 19px; letter-spacing: .03em; color: var(--hi); }
.patch-h h3 { font-family: var(--fdx); font-weight: 900; font-size: 30px; background: var(--metal); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; text-shadow: none; filter: drop-shadow(0 0 14px var(--glow)); }
.patch-h.sub { margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--line-2); }
.patch-v { display: block; margin-bottom: 4px; font-family: var(--fd); font-weight: 700; font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--mu); }
.patch-s h4 { font-family: var(--fd); letter-spacing: .03em; }
.skin-n { font-family: var(--fd); font-weight: 700; color: var(--hi); }
.s-hextech .skin-sw i:nth-child(1) { background: #CDB6FF; } .s-hextech .skin-sw i:nth-child(2) { background: #FF6A2B; } .s-hextech .skin-sw i:nth-child(3) { background: #E2BF72; }
.s-neon .skin-sw i:nth-child(1) { background: #07040C; box-shadow: inset 0 0 0 1px #FF4FB0; } .s-neon .skin-sw i:nth-child(2) { background: #FF3DA8; } .s-neon .skin-sw i:nth-child(3) { background: #33F0FF; }
.s-infernal .skin-sw i:nth-child(1) { background: #1E0A05; } .s-infernal .skin-sw i:nth-child(2) { background: #FF6A2B; } .s-infernal .skin-sw i:nth-child(3) { background: #FFB547; }
.s-abysse .skin-sw i:nth-child(1) { background: #04171F; } .s-abysse .skin-sw i:nth-child(2) { background: #5FE6D4; } .s-abysse .skin-sw i:nth-child(3) { background: #2FB7FF; }
.s-prestige .skin-sw i:nth-child(1) { background: #19140C; } .s-prestige .skin-sw i:nth-child(2) { background: #E2BF72; } .s-prestige .skin-sw i:nth-child(3) { background: #FFF8E6; }
.s-challenger .skin-sw i:nth-child(1) { background: #0D0820; } .s-challenger .skin-sw i:nth-child(2) { background: #CDB6FF; } .s-challenger .skin-sw i:nth-child(3) { background: #F2C66D; }

/* ── Mouvement réduit ── */
@media (prefers-reduced-motion: reduce) {
  .bd-img, .main, .p-night .pn-moon, .ann, .lcard, .endg-in, .drips, .ph-chip.camp, .islot-pip { animation: none !important; }
  .ann .doodles path { animation: none; stroke-dashoffset: 0; }
}

g par jour. Un shaker whey et lait en apporte une trentaine.`},{id:"sommeil",ic:"heart",n:"Le sommeil, c'est le recall",lol:"Tu ne r\xE9g\xE9n\xE8res pas tes PV en restant en lane. Tu recall.",lines:["La s\xE9ance casse le muscle. C'est pendant que tu dors qu'il se r\xE9pare et grossit.","Une nuit courte, c'est jouer low HP : moins de force, plus envie de sucre, moins de motivation."],real:"La plus grosse partie de l'hormone de croissance est lib\xE9r\xE9e pendant le sommeil profond, en d\xE9but de nuit. Vise 7 h 30 \xE0 9 h. Te coucher \xE0 heure fixe compte presque autant que la dur\xE9e.",you:e=>`Ton objectif : ${String(e.sleep).replace(".",",")} h. Le bouton \xAB Je pose le t\xE9l\xE9phone \xBB lance ton recall.`},{id:"surcharge",ic:"sword",n:"+1 rep, c'est ton scaling",lol:"Un champion qui ne monte pas de niveau se fait rouler dessus en late game.",lines:["M\xEAme charge, m\xEAmes reps pendant des mois : ton corps n'a aucune raison de changer.","+1 rep ou +2,5 kg d\xE8s que tu peux. Chaque petite marche, c'est un niveau."],real:"La r\xE8gle de ton programme : quand tu atteins le haut de la fourchette sur toutes les s\xE9ries, tu montes la charge. En attendant, tu cherches une rep de plus. Arr\xEAte chaque s\xE9rie \xE0 1 ou 2 reps de l'\xE9chec.",you:()=>"Dans l'Ar\xE8ne, chaque exercice t'affiche ton objectif +1 rep calcul\xE9 sur ta derni\xE8re s\xE9ance."},{id:"recup",ic:"hourglass",n:"Le repos, c'est le cooldown",lol:"Tu ne peux pas relancer ton ultime en boucle.",lines:["Un muscle travaill\xE9 a besoin d'environ 48 h pour r\xE9cup\xE9rer.","En full body 3 fois par semaine, ton sort recharge pile entre deux s\xE9ances.","Relancer trop t\xF4t : moins de d\xE9g\xE2ts, plus de risque de blessure."],real:"Un jour de repos entre deux s\xE9ances, c'est le bon rythme pour ton programme. Par exemple lundi, mercredi, vendredi."},{id:"regularite",ic:"flag",n:"Le farm bat les gros plays",lol:"Les meilleurs joueurs ne gagnent pas avec un pentakill par game. Ils gagnent en ne ratant aucun sbire.",lines:["3 200 kcal tous les jours valent mieux que 5 000 un jour puis 2 000 les trois suivants.","Le boss de la semaine compte tout : un jour rat\xE9 se rattrape un peu, jamais compl\xE8tement."],real:"Ton poids r\xE9agit \xE0 ta moyenne sur la semaine, pas \xE0 un repas \xE9norme."},{id:"pesee",ic:"crown",n:"La pes\xE9e, ce sont tes LP",lol:"Une d\xE9faite ne te fait pas descendre de division d'un coup. Un mauvais chiffre sur la balance non plus.",lines:["Ton poids bouge d'un kilo d'un jour \xE0 l'autre : eau, sel, repas de la veille.","C'est pour \xE7a que ton rang suit la moyenne de tes 3 derni\xE8res pes\xE9es."],real:"P\xE8se-toi toujours dans les m\xEAmes conditions : m\xEAme balance, m\xEAme moment de la journ\xE9e, avant de manger ou avant la s\xE9ance. Ce qui compte, c'est la tendance sur plusieurs semaines."},{id:"tilt",ic:"recall",n:"Le tilt",lol:"Une mauvaise teamfight ne perd pas la game. Le tilt qui suit, si.",lines:["Tu as rat\xE9 un repas ou une s\xE9ance ? Ce n'est pas grave.","Ce qui fait perdre, c'est de tout l\xE2cher apr\xE8s. Reprends au prochain camp."],real:"Une journ\xE9e rat\xE9e ne change rien \xE0 ton corps. Une semaine l\xE2ch\xE9e, oui."},{id:"lumiere",ic:"sun",n:"La lumi\xE8re du matin, c'est ta vision",lol:"Sans ward, tu joues dans le noir. Sans lumi\xE8re le matin, ton horloge aussi.",lines:["10 minutes dehors apr\xE8s le r\xE9veil disent \xE0 ton cerveau que la journ\xE9e commence.","Le soir, la fatigue arrive plus t\xF4t : c'est comme \xE7a qu'on avance son coucher sans forcer."],real:"La lumi\xE8re du jour est le signal le plus fort pour r\xE9gler l'horloge interne. M\xEAme par temps couvert, elle est bien plus forte que la lumi\xE8re d'une pi\xE8ce."},{id:"eau",ic:"potion",n:"L'eau, ce sont tes potions",lol:"Sans potions, tu ne tiens pas la lane.",lines:["La cr\xE9atine fait entrer de l'eau dans tes muscles : il faut boire assez.","D\xE9shydrat\xE9, tu perds de la force avant m\xEAme de le sentir."],real:"2 \xE0 3 litres par jour, plus quand il fait chaud ou que tu transpires. Urine jaune clair : tu es bien hydrat\xE9."}],Cp=["La cr\xE9atine, c'est un item \xE0 stacks : un jour rat\xE9 ne vide pas tout, mais chaque jour compte.","Un shaker whey et lait, c'est une trentaine de grammes de prot\xE9ines en 30 secondes.","Ton rang suit la moyenne de tes 3 derni\xE8res pes\xE9es : une mauvaise pes\xE9e ne te fait pas plonger.","Le boss de la semaine perd 1 PV par kcal. Un repas de 900 kcal, c'est un gros coup.","Le Flash sauve ta s\xE9rie une fois par semaine. Pas deux.","Trois heures sans manger : le camp est r\xE9apparu, va farm.","Vise le +1 rep, pas le record. C'est comme \xE7a que tu scales.","Une nuit sous 6 h, c'est jouer low HP toute la journ\xE9e.","10 minutes dehors le matin avancent ton heure de coucher.","Pas faim ? Les calories liquides passent mieux : lait entier, shaker, smoothie.","Un repas L\xE9gendaire : 900 kcal et 40 g de prot\xE9ines dans la m\xEAme assiette.","Chaque nouvel aliment rejoint ton Alimentdex. Varier, c'est aussi mieux farmer.","La journ\xE9e se gagne \xE0 90 % de ton objectif de calories.","Pentakill : calories, prot\xE9ines, sommeil, cr\xE9atine et s\xE9ance (ou posture) le m\xEAme jour.","Un bon early game : premier repas dans les 2 h apr\xE8s le r\xE9veil.","Tu as rat\xE9 un repas ? Ne tilte pas. Reprends au prochain camp.","Le sommeil, c'est le recall : c'est l\xE0 que le muscle se construit.","L'heure de la cr\xE9atine ne compte pas. Le tous les jours, si.","Ta mana de s\xE9ance d\xE9pend de ta nuit et de ton farm d'hier.","Toujours la m\xEAme balance, au m\xEAme moment : sinon tes LP mentent."],n2={v:"8.0",n:"Le Reforge",date:"novembre 2026",intro:"Ton tracker devient une partie de League. Ta vraie vie, c'est la game : chaque repas se farme, chaque nuit est un recall, chaque pes\xE9e te fait gagner des LP. Tout est calcul\xE9 \xE0 partir de tes donn\xE9es : rien n'a \xE9t\xE9 perdu, ton historique a \xE9t\xE9 rejou\xE9.",sections:[{t:"La mana et les stacks (la vid\xE9o)",items:[["NOUVEAU","Barre de mana : l'\xE9nergie de tes muscles pour la s\xE9ance, remplie par ta nuit et ton farm."],["NOUVEAU","La cr\xE9atine monte ta mana max : jusqu'\xE0 +20 \xE0 28 stacks."],["NOUVEAU","Grille de 28 stacks. Un jour rat\xE9 = un stack perdu, comme dans tes muscles."],["NOUVEAU","Tous tes rituels deviennent des items \xE0 stacks, avec leur fiche fa\xE7on boutique."],["NOUVEAU","Objectif +1 rep sur chaque exercice, calcul\xE9 sur ta derni\xE8re s\xE9ance."],["NOUVEAU","Conseil de s\xE9ance selon ta mana : full mana, mana correcte ou low mana."],["NOUVEAU","Codex : la cr\xE9atine, les calories, le sommeil, les prot\xE9ines\u2026 expliqu\xE9s en LoL."]]},{t:"Farm",items:[["REFONTE","Les calories deviennent ton gold : le farm du jour, avec ta courbe et le rythme id\xE9al."],["NOUVEAU","Gold diff : ton avance ou ton retard sur le rythme, en direct."],["NOUVEAU","Phases de jeu : early, mid et late game, avec ce qu'il faut avoir farm\xE9 \xE0 la fin de chacune."],["NOUVEAU","Camp r\xE9apparu : \xE7a fait 3 h que tu n'as pas mang\xE9."],["NOUVEAU","CS du jour : le nombre de repas not\xE9s."],["NOUVEAU","Raret\xE9 des repas : Commun, Rare, \xC9pique, L\xE9gendaire."],["NOUVEAU","Build recommand\xE9 : les repas qui comblent pile ce qu'il te manque."],["NOUVEAU","Alimentdex : chaque nouvel aliment se d\xE9couvre, pour t'aider \xE0 varier."],["NOUVEAU","Vari\xE9t\xE9 de la semaine : le nombre d'aliments diff\xE9rents."],["BUFF","\xAB +X gold \xBB et un petit son \xE0 chaque repas ajout\xE9."]]},{t:"La partie du jour",items:[["NOUVEAU","5 objectifs = 5 kills : First blood, Double kill\u2026 jusqu'au Pentakill."],["NOUVEAU","Note de la journ\xE9e, de D \xE0 S+."],["NOUVEAU","Victoire \xE0 90 % de tes calories, et ton winrate sur 30 jours."],["NOUVEAU","\xC9cran de fin de partie quand tu poses le t\xE9l\xE9phone : victoire ou d\xE9faite."],["NOUVEAU","R\xE9cap de mort : ce qui t'a fait perdre la journ\xE9e, sans filtre."],["NOUVEAU","Historique des parties : chaque jour, sa note et ses kills."],["NOUVEAU","S\xE9rie de victoires et Flash : une journ\xE9e rat\xE9e par semaine est sauv\xE9e."],["NOUVEAU","Score de vision : ce qui est not\xE9 dans ta journ\xE9e."],["NOUVEAU","Qu\xEAtes du jour : 3 d\xE9fis par jour, tir\xE9s selon ta journ\xE9e."],["NOUVEAU","\xC9cran de chargement : ton match du jour et une astuce, une fois par jour."]]},{t:"Progression",items:[["NOUVEAU","Niveau de la partie, de 1 \xE0 18, qui monte avec tes objectifs."],["NOUVEAU","Niveau de compte : toute ton XP depuis ton premier jour."],["NOUVEAU","Class\xE9 : ton poids devient ton rang, de Fer IV \xE0 Challenger, ton poids vis\xE9."],["NOUVEAU","LP \xE0 chaque pes\xE9e, calcul\xE9s sur la moyenne de tes 3 derni\xE8res pes\xE9es."],["NOUVEAU","Date de ta prochaine promotion, \xE0 ton rythme actuel."],["NOUVEAU","Boss de la semaine : chaque kcal lui retire 1 PV."],["NOUVEAU","34 succ\xE8s, rejou\xE9s sur tout ton historique, avec leur date."],["NOUVEAU","Titres \xE0 d\xE9bloquer sous ton pseudo."],["NOUVEAU","Stats de carri\xE8re : gold farm\xE9, nuits, s\xE9ances, kilos, pentakills."]]},{t:"Ar\xE8ne",items:[["REFONTE","Tes s\xE9ances A, B et C deviennent tes sorts Q, W et E, avec leur temps de recharge."],["NOUVEAU","L'ultime : tes records perso, d\xE9tect\xE9s tout seuls \xE0 l'import Hevy."],["NOUVEAU","Triple kill de la semaine : 3 s\xE9ances."],["BUFF","La routine posture compte comme un kill les jours sans s\xE9ance."]]},{t:"Visuel et confort",items:[["REFONTE","Nouveau th\xE8me Hextech : fond abysse, cadres dor\xE9s, mana bleue."],["NOUVEAU","HUD de champion : portrait, niveau, PV et mana."],["NOUVEAU","Embl\xE8mes de rang dessin\xE9s pour chaque palier."],["NOUVEAU","Annonces plein \xE9cran : kills, boss vaincu, promotion, niveau."],["NOUVEAU","Le mode nuit devient ton recall : tes PV se r\xE9g\xE9n\xE8rent pendant que tu dors."],["NOUVEAU","Pings de couleur sur la prochaine action."],["NOUVEAU","6 skins \xE0 d\xE9bloquer, dont N\xE9on v7, le look de ta version d'avant."],["NOUVEAU","Bruitages de jeu et annonceur vocal, \xE0 couper dans les runes."],["NOUVEAU","Forge : cr\xE9e tes propres items \xE0 stacks (anglais, lecture\u2026)."],["BUFF","Le coach conna\xEEt ta partie (rang, boss, stacks) et explique avec des analogies LoL."],["REFONTE","Les r\xE9glages deviennent ta page de runes, avec ton pseudo."],["AJUSTEMENT","Toutes tes donn\xE9es sont gard\xE9es : rien \xE0 ressaisir."]]}]},Be={v:"8.1",n:"L'Affiche",date:"novembre 2026",intro:"M\xEAme partie, nouveau visuel. Chaque onglet s'ouvre sur une affiche peinte \xE0 partir de tes donn\xE9es, comme un poster d'\xE9v\xE9nement. Tes donn\xE9es et les r\xE8gles du jeu n'ont pas boug\xE9.",sections:[{t:"Les affiches",items:[["NOUVEAU","Base : le ciel suit l'heure de ta journ\xE9e. Aube, journ\xE9e, fin d'apr\xE8s-midi, cr\xE9puscule, nuit."],["NOUVEAU","Ton gold du jour en tr\xE8s grand, avec les montagnes qui passent devant."],["NOUVEAU","La nuit, le recall sous la lune : elle se remplit \xE0 mesure que tu dors."],["NOUVEAU","Farm : une affiche de jour de match, toi contre le boss de la semaine."],["NOUVEAU","Ar\xE8ne : damas cramoisi et ta mana de s\xE9ance en grand."],["NOUVEAU","Profil : ta carte d'invocateur dans un cadre art d\xE9co, l'embl\xE8me de ton rang devant."]]},{t:"Les pi\xE8ces du jeu",items:[["REFONTE","Objectifs du jour : cinq cartes d'escouade qui se remplissent, puis s'allument."],["REFONTE","Inventaire : des m\xE9daillons, gris tant que l'item n'est pas fait aujourd'hui."],["REFONTE","Qu\xEAtes du jour : des contrats sur parchemin, tamponn\xE9s quand c'est fait."],["REFONTE","Boss de la semaine : une affiche cramoisie."],["REFONTE","Annonces : des tags au marqueur n\xE9on pour les kills, les niveaux et les records."],["REFONTE","\xC9cran de chargement : l'affiche du match, toi contre le boss."],["REFONTE","Fin de partie : or pour une victoire, cramoisi pour une d\xE9faite."]]},{t:"Skins",items:[
