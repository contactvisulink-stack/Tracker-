<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Isma Daily"/>
<meta name="theme-color" content="#080812"/>
<title>Isma Daily</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>/* ─────────────────────────────────────────────────────────────
   Isma Daily · v4 « Glass »
   Fond nuit avec formes éclairées sur les bords, cartes en verre
   dépoli, lueurs bleues et orange.
   ───────────────────────────────────────────────────────────── */
:root {
  --bg: #03050D;
  --tx: #F3F5FD;
  --mu: #98A1B9;
  --dim: #5E6782;
  --line: rgba(255, 255, 255, .075);
  --line-2: rgba(255, 255, 255, .13);
  --sun: #4F8DFF;      /* calories · accent principal */
  --sun-2: #8B6BFF;
  --flesh: #FF7A35;    /* protéines */
  --moon: #9B7DFF;     /* sommeil */
  --sky: #3ED2F2;      /* eau · poids */
  --amber: #FFC15A;
  --up: #4ADE80;
  --down: #FF6B6B;
  --rim: rgba(255, 96, 40, .78);
  --rim-2: rgba(80, 104, 255, .5);
  --glass: linear-gradient(180deg, rgba(32, 38, 72, .5), rgba(14, 18, 40, .5));
  --fd: 'Inter', -apple-system, 'SF Pro Display', system-ui, sans-serif;
  --fb: 'Inter', -apple-system, 'SF Pro Text', system-ui, sans-serif;
  --safe-b: env(safe-area-inset-bottom);
  --safe-t: env(safe-area-inset-top);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--tx); font-family: var(--fb); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; overflow-x: hidden; font-feature-settings: "cv11", "ss01"; }
body { min-height: 100vh; min-height: 100dvh; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:disabled { cursor: default; }
input, textarea, select { color-scheme: dark; }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; border-radius: 10px; }
::-webkit-scrollbar { width: 0; height: 0; }
b, strong { font-weight: 600; }
h1, h2, h3 { font-weight: inherit; font-size: inherit; }

/* ── Fond : formes éclairées par le bord ── */
.app { position: relative; min-height: 100dvh; padding-top: var(--safe-t); padding-bottom: calc(108px + var(--safe-b)); }
/* bande floutée sous l'heure et la batterie, pour que le contenu ne passe pas dessous en clair */
.app::before { content: ""; position: fixed; left: 0; right: 0; top: 0; height: var(--safe-t); z-index: 150; background: rgba(3, 5, 13, .72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); pointer-events: none; }
.amb-dawn { --rim: rgba(255, 150, 70, .8); --rim-2: rgba(255, 110, 90, .35); }
.amb-day { --rim: rgba(255, 120, 50, .7); --rim-2: rgba(90, 150, 255, .55); }
.amb-dusk { --rim: rgba(255, 90, 40, .82); --rim-2: rgba(110, 100, 255, .5); }
.amb-night { --rim: rgba(150, 110, 255, .75); --rim-2: rgba(60, 90, 255, .55); }
.ambient { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; background: radial-gradient(120% 70% at 50% 0%, #0B1233 0%, #050818 45%, var(--bg) 100%); }
.ambient i { position: absolute; display: block; background: radial-gradient(circle at 40% 40%, #0B1132 0%, #070B22 60%, #0C1236 100%); animation: drift 38s ease-in-out infinite alternate; will-change: transform; }
.ambient .b1 { width: 470px; height: 500px; left: -250px; top: 90px; border-radius: 47% 53% 45% 55% / 52% 46% 54% 48%; box-shadow: inset -30px -10px 50px -12px var(--rim), inset 20px 26px 70px -24px var(--rim-2), 18px 0 70px -30px var(--rim); }
.ambient .b2 { width: 330px; height: 400px; right: -190px; top: 330px; border-radius: 55% 45% 50% 50% / 46% 54% 46% 54%; box-shadow: inset 30px 6px 48px -12px var(--rim), inset -14px -22px 60px -20px var(--rim-2), -18px 0 70px -30px var(--rim); animation-duration: 46s; animation-direction: alternate-reverse; }
.ambient .b3 { width: 170px; height: 110px; right: -40px; top: 6px; border-radius: 50% 50% 46% 54% / 62% 58% 42% 38%; box-shadow: inset 0 -20px 30px -10px var(--rim), inset 0 16px 40px -16px var(--rim-2); animation-duration: 30s; }
.ambient .b4 { width: 760px; height: 430px; left: -140px; bottom: -300px; border-radius: 50% 50% 48% 52% / 58% 54% 46% 42%; box-shadow: inset 0 30px 56px -14px var(--rim), inset 30px 10px 80px -30px var(--rim-2), 0 -20px 80px -40px var(--rim); animation-duration: 52s; }
@keyframes drift { 0% { transform: translate(0, 0) rotate(0deg); } 50% { transform: translate(14px, -18px) rotate(4deg); } 100% { transform: translate(-10px, 12px) rotate(-3deg); } }

/* ── En-tête ── */
.top { position: relative; z-index: 2; max-width: 480px; margin: 0 auto; padding: 14px 16px 8px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.top.home { align-items: center; padding-bottom: 4px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 15px; color: #DCE2F5; letter-spacing: -.1px; }
.brand-dot { width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #B9D0FF, var(--sun)); box-shadow: 0 0 12px var(--sun), 0 0 3px #fff; }
.top-t { font-weight: 700; font-size: 28px; letter-spacing: -.7px; line-height: 1.1; }
.top-d { color: var(--mu); font-size: 14px; margin-top: 3px; }
.top-r { display: flex; align-items: center; gap: 8px; }
.streak { font-weight: 600; font-size: 13.5px; padding: 7px 11px; border-radius: 99px; background: rgba(255, 122, 53, .14); border: 1px solid rgba(255, 122, 53, .3); color: #FFB385; white-space: nowrap; }
.round-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .06); border: 1px solid var(--line); color: var(--tx); flex-shrink: 0; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); transition: transform .12s, background .2s; }
.round-btn:active { transform: scale(.92); }
.round-btn:disabled { opacity: .3; }

.main { position: relative; z-index: 1; animation: pageIn .28s ease both; }
@keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.page { max-width: 480px; margin: 0 auto; padding: 8px 14px 0; }

/* ── Cartes en verre ── */
.card, .panel, .block, .stat, .tl-card, .ex, .fav, .rules li {
  position: relative; background: var(--glass); border: 1px solid var(--line);
  backdrop-filter: blur(24px) saturate(150%); -webkit-backdrop-filter: blur(24px) saturate(150%);
  box-shadow: 0 12px 36px -12px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .07);
}
.card, .panel, .block { border-radius: 22px; padding: 16px; margin-bottom: 12px; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
.card-t { font-size: 15px; font-weight: 600; color: #E6EAF7; letter-spacing: -.1px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 5px 11px; border-radius: 99px; font-size: 12.5px; font-weight: 500; color: var(--mu); background: rgba(255, 255, 255, .06); border: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill.sm { padding: 4px 9px; font-size: 12px; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.g2 > .card { margin-bottom: 12px; min-width: 0; }

/* Salutation */
.greet { padding-bottom: 0; overflow: hidden; }
.greet-top { display: flex; justify-content: space-between; align-items: flex-start; }
.greet-hello { font-size: 15px; color: var(--mu); }
.greet-name { font-size: 34px; font-weight: 700; letter-spacing: -1px; line-height: 1.1; }
.greet-line { color: var(--mu); font-size: 14px; margin-top: 6px; max-width: 78%; }
.glowline { display: block; width: calc(100% + 32px); height: 72px; margin: 4px -16px 0; overflow: visible; }
.greet-cta { margin: 14px 0 16px; }
.greet-cta2 { margin: 12px 0 16px; }
.greet.is-night { border-color: rgba(155, 125, 255, .35); box-shadow: 0 0 0 1px rgba(155, 125, 255, .12), 0 16px 50px -16px rgba(120, 90, 255, .5), inset 0 1px 0 rgba(255, 255, 255, .07); }
.now-dot { animation: nowdot 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes nowdot { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }

/* Calories */
.cal-body { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
.big-num { font-size: 50px; font-weight: 600; letter-spacing: -2px; line-height: 1; font-variant-numeric: tabular-nums; }
.big-num span { font-size: 26px; font-weight: 500; letter-spacing: 0; margin-left: 2px; color: #C9D3F0; }
.cal-msg { font-size: 14.5px; color: #C9D3F0; margin-top: 4px; }
.cal-stats { display: flex; gap: 22px; margin-top: 16px; }
.cal-stats div { display: flex; flex-direction: column; }
.cal-stats span { font-size: 12px; color: var(--mu); }
.cal-stats b { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
.gring { position: relative; flex-shrink: 0; display: grid; place-items: center; }
.gring svg { overflow: visible; }
.gring .arc { transition: stroke-dashoffset 1.2s cubic-bezier(.22, 1, .36, 1); }
.gring-c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.ring-in { display: flex; flex-direction: column; align-items: center; }
.ring-in b { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.ring-in span { font-size: 11.5px; color: var(--mu); }
.suggest { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; margin-top: 14px; padding: 11px 12px 11px 14px; border-radius: 16px; text-align: left; background: linear-gradient(90deg, rgba(79, 141, 255, .16), rgba(139, 107, 255, .12)); border: 1px solid rgba(110, 150, 255, .3); transition: transform .12s; }
.suggest:active { transform: scale(.98); }
.sg-l { display: flex; flex-direction: column; min-width: 0; }
.sg-k { font-size: 12px; color: #A9C1FF; }
.sg-n { font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sg-r { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #C9D3F0; white-space: nowrap; }
.sg-plus { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--sun), var(--sun-2)); color: #fff; box-shadow: 0 4px 16px rgba(79, 141, 255, .5); }

/* Barres fines */
.tbar { display: grid; grid-template-columns: 72px 1fr auto; align-items: center; gap: 10px; margin-top: 10px; font-size: 13px; }
.tbar-l { color: #C9D3F0; }
.tbar-t { height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .07); overflow: hidden; }
.tbar-f { display: block; height: 100%; border-radius: 99px; transition: width 1s cubic-bezier(.22, 1, .36, 1); box-shadow: 0 0 10px rgba(79, 141, 255, .35); }
.tbar-r { color: var(--mu); font-variant-numeric: tabular-nums; text-align: right; min-width: 40px; }

/* Minuteur */
.timer, .weather { display: flex; flex-direction: column; }
.timer .card-h { margin-bottom: 6px; }
.timer-ring { display: grid; place-items: center; margin: 4px 0 10px; }
.t-num { font-size: 25px; font-weight: 600; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
.t-sub { font-size: 10.5px; color: var(--mu); margin-top: 1px; }
.timer-btns { display: flex; gap: 6px; justify-content: center; }
.pill-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 16px; border-radius: 99px; background: rgba(255, 255, 255, .09); border: 1px solid var(--line-2); font-size: 13.5px; font-weight: 600; transition: transform .12s; }
.pill-btn:active { transform: scale(.95); }
.pill-btn.ghost { padding: 8px 12px; background: rgba(255, 255, 255, .04); }
.play-ic { width: 0; height: 0; border-left: 8px solid #fff; border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
.pause-ic { width: 9px; height: 10px; border-left: 3px solid #fff; border-right: 3px solid #fff; }

/* Météo */
.wx-date { font-size: 17px; font-weight: 600; letter-spacing: -.2px; }
.wx-day { font-size: 12.5px; color: var(--mu); }
.wx-now { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 14px; }
.wx-ic { font-size: 36px; line-height: 1; filter: drop-shadow(0 4px 10px rgba(255, 190, 80, .25)); }
.wx-t { font-size: 38px; font-weight: 600; letter-spacing: -1.5px; line-height: 1; }
.wx-l { font-size: 13px; color: #C9D3F0; margin-top: 4px; }
.wx-hl { font-size: 12px; color: var(--mu); margin-top: 8px; white-space: pre; }

/* Missions */
.mlist { display: flex; flex-direction: column; }
.mrow { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 6px; margin: 0 -6px; width: calc(100% + 12px); border-radius: 14px; transition: background .2s; }
.mrow + .mrow { border-top: 1px solid var(--line); border-radius: 0; }
.mrow:active:not(:disabled) { background: rgba(255, 255, 255, .04); }
.mrow.hot { background: linear-gradient(90deg, rgba(255, 122, 53, .14), rgba(255, 122, 53, 0)); border-radius: 14px; border-top-color: transparent; }
.mrow.hot + .mrow { border-top-color: transparent; }
.mcheck { width: 22px; height: 22px; border-radius: 50%; border: 1.6px solid rgba(255, 255, 255, .25); display: grid; place-items: center; flex-shrink: 0; color: #fff; transition: all .25s; }
.mcheck.on { background: linear-gradient(135deg, #5E9BFF, #3E6FFF); border-color: transparent; box-shadow: 0 0 12px rgba(79, 141, 255, .55); animation: pop .3s cubic-bezier(.34, 1.56, .64, 1); }
@keyframes pop { from { transform: scale(.4); } to { transform: scale(1); } }
.mtext { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ml { font-size: 14.5px; font-weight: 500; }
.mrow.done .ml { color: #C9D3F0; }
.ms { font-size: 12px; color: var(--mu); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mstat { font-size: 12.5px; color: var(--dim); white-space: nowrap; font-weight: 500; }
.mstat.now { color: #FF9A55; font-weight: 600; }
.mstat.prog { color: var(--amber); }

/* Sommeil */
.sleepc { cursor: pointer; display: flex; flex-direction: column; }
.sl-main { font-size: 21px; font-weight: 600; color: #A9B8FF; letter-spacing: -.3px; }
.wave { display: block; width: 100%; height: 52px; margin: 6px 0 4px; }
.sl-foot { display: flex; flex-direction: column; margin-top: auto; font-size: 12px; color: var(--mu); }
.sl-foot b { font-size: 14px; }
.good { color: var(--up); } .mid { color: var(--amber); } .low { color: var(--down); }

/* Raccourcis */
.sc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 4px; }
.sc { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.sc-ic { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: linear-gradient(180deg, rgba(255, 255, 255, .1), rgba(255, 255, 255, .04)); border: 1px solid var(--line-2); color: #DCE4FF; transition: transform .12s; }
.sc:active .sc-ic { transform: scale(.9); }
.sc-l { font-size: 11px; color: var(--mu); }

/* Semaine */
.pbars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding-top: 26px; }
.pb { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.pb-track { position: relative; width: 12px; height: 100px; border-radius: 99px; background: rgba(255, 255, 255, .06); overflow: hidden; display: flex; align-items: flex-end; }
.pb-fill { display: block; width: 100%; border-radius: 99px; transition: height 1s cubic-bezier(.22, 1, .36, 1); box-shadow: 0 0 14px rgba(79, 141, 255, .45); }
.pb.sel .pb-track { box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .25); }
.pb-l { font-size: 11.5px; color: var(--mu); }
.pb.sel .pb-l { color: var(--tx); font-weight: 600; }
.pb.fut { opacity: .35; }
.pb-tip { position: absolute; top: -27px; left: 50%; transform: translateX(-50%); padding: 3px 8px; border-radius: 8px; background: rgba(40, 48, 90, .9); border: 1px solid var(--line-2); font-size: 11.5px; font-weight: 600; white-space: nowrap; animation: pop .25s ease; }

/* Moyennes */
.avg-body { display: flex; align-items: center; gap: 16px; }
.avg-bars { flex: 1; min-width: 0; }
.avg-bars .tbar:first-child { margin-top: 0; }
.avg-bars .tbar { grid-template-columns: 64px 1fr auto; }

/* À venir */
.ev { display: flex; align-items: center; gap: 13px; padding: 10px 0; }
.ev + .ev { border-top: 1px solid var(--line); }
.ev-d { width: 44px; height: 46px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(255, 255, 255, .05); border: 1px solid var(--line); flex-shrink: 0; }
.ev-d b { font-size: 17px; line-height: 1.1; }
.ev-d span { font-size: 10.5px; color: var(--mu); }
.ev-t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ev-n { font-size: 14.5px; font-weight: 500; }
.ev-s { font-size: 12px; color: var(--mu); }
.ev-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* ── Boutons d'action ── */
.cta { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 12px 18px; border-radius: 16px; font-weight: 600; font-size: 15px; letter-spacing: -.1px; transition: transform .12s ease, opacity .2s; width: 100%; color: #fff; }
.cta:active { transform: scale(.97); }
.cta:disabled { opacity: .4; }
.cta.sun { background: linear-gradient(135deg, #4F8DFF, #7A5CFF); box-shadow: 0 8px 24px -8px rgba(79, 141, 255, .7); }
.cta.moon { background: linear-gradient(135deg, #8B6BFF, #B49BFF); box-shadow: 0 8px 24px -8px rgba(139, 107, 255, .7); }
.cta.flesh { background: linear-gradient(135deg, #FF6A2B, #FFA54F); box-shadow: 0 8px 24px -8px rgba(255, 106, 43, .6); }
.cta.sky { background: linear-gradient(135deg, #2FB7E0, #5FE0FA); color: #04202B; box-shadow: 0 8px 24px -8px rgba(62, 210, 242, .55); }
.cta.ghost { background: rgba(255, 255, 255, .06); border: 1px solid var(--line-2); font-weight: 500; }
.cta.full { width: 100%; }
.cta.shrink { width: auto; flex: 0 0 auto; }
.cta-sub { margin-left: auto; font-weight: 500; font-size: 13.5px; opacity: .8; white-space: nowrap; }
.cta-row { display: flex; gap: 10px; }
.cta-row > * { flex: 1; }
.cta-col { display: grid; gap: 9px; }
.big-inp { font-weight: 600; font-size: 20px !important; text-align: center; }

/* ── Blocs des autres onglets ── */
.block { margin-top: 4px; }
.block-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.block-head h3 { font-weight: 600; font-size: 15.5px; color: #E6EAF7; }
.count { font-weight: 600; color: var(--mu); font-size: 13.5px; }
.panel.glow-sky { border-color: rgba(62, 210, 242, .45); box-shadow: 0 0 0 4px rgba(62, 210, 242, .07), 0 12px 36px -12px rgba(0, 0, 0, .55); }
.panel-t { font-weight: 600; font-size: 16px; color: #E6EAF7; margin-bottom: 10px; }
.hint { color: var(--dim); font-size: 12.5px; line-height: 1.5; margin-top: 10px; }
.muted { color: var(--mu); }
.small { font-size: 12.5px; }
.center { text-align: center; }
.insight-line { text-align: center; color: var(--mu); font-size: 14px; margin: 18px 8px 8px; }
.insight-line.left { text-align: left; margin: 0 4px 12px; }
.link { color: #8FB4FF; font-size: 14px; font-weight: 600; padding: 2px 0; }
.link.small { font-size: 12.5px; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.mt6 { margin-top: 6px; } .mt8 { margin-top: 8px; } .mt10 { margin-top: 10px; } .mt14 { margin-top: 14px; } .mt18 { margin-top: 18px; }
.mb10 { margin-bottom: 10px; } .mb18 { margin-bottom: 18px; }

/* Barres avec repère */
.pbar { margin-bottom: 14px; }
.pbar-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; font-size: 14px; color: var(--mu); }
.pbar-val { color: var(--mu); font-size: 13px; }
.pbar-val b { color: var(--tx); font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.pbar-track { position: relative; height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .07); }
.pbar-fill { height: 100%; border-radius: 99px; transition: width .9s cubic-bezier(.22, 1, .36, 1); box-shadow: 0 0 12px rgba(79, 141, 255, .4); }
.pbar-mark { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; border-radius: 2px; background: #fff; box-shadow: 0 0 8px rgba(255, 255, 255, .7); }
.macro-row { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--mu); }
.macro-row b { color: var(--tx); }

/* Manger */
.daynav { display: flex; align-items: center; gap: 12px; margin: 4px 0 14px; }
.daynav-l { flex: 1; text-align: center; }
.daynav-t { font-weight: 600; font-size: 18px; }
.timeline { position: relative; margin: 6px 0 14px; }
.tl-row { display: grid; grid-template-columns: 46px 14px 1fr; align-items: start; position: relative; }
.tl-row::before { content: ""; position: absolute; left: 52px; top: 0; bottom: 0; width: 2px; background: linear-gradient(180deg, rgba(79, 141, 255, .35), rgba(79, 141, 255, .1)); }
.tl-row:first-child::before { top: 22px; }
.tl-row:last-child::before { bottom: calc(100% - 22px); }
.tl-time { font-weight: 600; font-size: 13px; color: var(--mu); padding-top: 15px; font-variant-numeric: tabular-nums; }
.tl-dot { position: relative; z-index: 1; width: 12px; height: 12px; margin-top: 17px; border-radius: 50%; background: var(--sun); box-shadow: 0 0 10px var(--sun), 0 0 0 3px rgba(79, 141, 255, .2); }
.tl-card { margin: 0 0 10px 8px; border-radius: 20px; overflow: hidden; }
.tl-row.open .tl-card { border-color: var(--line-2); }
.tl-row.open { grid-template-columns: 0 0 1fr; }
.tl-row.open .tl-time, .tl-row.open .tl-dot { visibility: hidden; }
.tl-row.open .tl-card { margin-left: 0; }
.tl-row.open::before { display: none; }
.tl-head { display: flex; justify-content: space-between; gap: 12px; width: 100%; text-align: left; padding: 13px 15px; }
.tl-main { min-width: 0; }
.tl-title { font-weight: 600; font-size: 15px; }
.tl-items { font-size: 12.5px; color: var(--mu); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tl-kcal { text-align: right; flex-shrink: 0; display: flex; flex-direction: column; }
.tl-kcal b { font-weight: 700; font-size: 18px; color: #A9C4FF; }
.tl-kcal span { font-size: 12px; color: var(--mu); }
.tl-body { padding: 4px 15px 14px; border-top: 1px solid var(--line); }
.tl-body .grid2 { margin-top: 12px; }
.wide-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; border-radius: 16px; background: linear-gradient(135deg, rgba(79, 141, 255, .22), rgba(122, 92, 255, .18)); border: 1px solid rgba(110, 150, 255, .35); color: #D6E2FF; font-weight: 600; margin-bottom: 10px; }
.wide-btn.ghost { background: rgba(255, 255, 255, .05); border-color: var(--line); color: var(--tx); font-weight: 500; }

/* Aliments */
.items { margin: 8px 0 10px; }
.item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: none; }
.item-main { flex: 1; min-width: 0; }
.item-name { font-size: 14.5px; font-weight: 500; }
.item-sub { font-size: 12.5px; color: var(--mu); margin-top: 1px; }
.item.missing .gram { border-color: var(--down); }
.warn-txt { color: var(--amber); font-size: 12.5px; margin-top: 3px; }
.gram { display: flex; align-items: center; gap: 4px; height: 42px; padding: 0 11px; border-radius: 13px; background: rgba(255, 255, 255, .06); border: 1px solid var(--line-2); flex-shrink: 0; }
.gram input { width: 54px; background: none; border: none; outline: none; text-align: right; font-weight: 600; font-size: 16px; }
.gram span { color: var(--mu); font-size: 12.5px; }
.gram.wide { width: 100%; }
.gram.wide input { width: 100%; text-align: left; }
.x-btn { width: 32px; height: 32px; border-radius: 50%; background: rgba(255, 107, 107, .12); color: var(--down); display: grid; place-items: center; flex-shrink: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 13px; border-radius: 99px; background: rgba(255, 255, 255, .07); border: 1px solid var(--line); font-size: 13.5px; font-weight: 500; text-decoration: none; transition: transform .12s; }
.chip:active { transform: scale(.95); }
.chip.on { background: rgba(79, 141, 255, .2); border-color: rgba(79, 141, 255, .45); color: #D6E2FF; }
.chip.danger { color: var(--down); }
.tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; margin-left: 7px; vertical-align: 1px; background: rgba(255, 255, 255, .08); color: var(--mu); }
.tag.ok { background: rgba(74, 222, 128, .14); color: var(--up); }
.tag.ia { background: rgba(155, 125, 255, .18); color: #C7B8FF; }
.tag.new { background: rgba(255, 193, 90, .16); color: var(--amber); }
.tag.warn { background: rgba(255, 107, 107, .15); color: var(--down); }
.tag.sun { background: rgba(79, 141, 255, .2); color: #A9C4FF; }
.unmatched { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 13.5px; padding: 10px 13px; margin: 8px 0; border-radius: 14px; background: rgba(255, 107, 107, .08); border: 1px solid rgba(255, 107, 107, .25); }
.unmatched span { flex: 1; min-width: 150px; }
.list-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; padding: 12px 0; border-bottom: 1px solid var(--line); }
.list-row:last-child { border-bottom: none; }
.nm { font-size: 14.5px; font-weight: 600; }
.row-l { display: flex; align-items: center; gap: 12px; }
.plus-dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--sun), var(--sun-2)); color: #fff; flex-shrink: 0; }

/* Ajout rapide */
.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 4px; border-radius: 16px; background: rgba(255, 255, 255, .05); border: 1px solid var(--line); margin-bottom: 14px; }
.modes button { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 4px; border-radius: 12px; font-size: 14px; font-weight: 500; color: var(--mu); }
.modes button.on { background: linear-gradient(135deg, rgba(79, 141, 255, .3), rgba(122, 92, 255, .25)); color: #fff; box-shadow: 0 4px 14px -4px rgba(79, 141, 255, .5); }
.composer-box { display: grid; gap: 10px; }
.sub-h { font-size: 13.5px; font-weight: 600; color: var(--mu); margin: 18px 0 9px; }
.hscroll { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 16px; margin: 0 -16px; padding: 0 16px 6px; }
.fav { flex: 0 0 172px; scroll-snap-align: start; display: flex; flex-direction: column; border-radius: 20px; overflow: hidden; }
.fav-main { display: flex; flex-direction: column; justify-content: space-between; gap: 10px; min-height: 92px; padding: 13px 14px 10px; text-align: left; transition: background .2s; }
.fav-main:active { background: rgba(79, 141, 255, .14); }
.fav-n { font-weight: 600; font-size: 14.5px; line-height: 1.25; }
.fav-k { font-size: 12.5px; color: var(--mu); }
.fav-k b { color: #A9C4FF; font-size: 16px; }
.fav-adj { padding: 9px 14px; border-top: 1px solid var(--line); text-align: left; font-size: 12.5px; font-weight: 500; color: var(--mu); }
.recent { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.recent:last-child { border-bottom: none; }
.recent-main { flex: 1; min-width: 0; text-align: left; }
.recent-n { display: block; font-weight: 600; font-size: 14.5px; }
.recent-i { display: block; font-size: 12.5px; color: var(--mu); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.recent-r { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0; }
.recent-r b { color: #A9C4FF; }
.total-line { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.total-line b { font-size: 22px; color: #A9C4FF; font-variant-numeric: tabular-nums; }
.field { display: block; margin-bottom: 12px; }
.field > span { display: block; font-size: 13px; color: var(--mu); margin-bottom: 6px; }
.inp { width: 100%; background: rgba(255, 255, 255, .06); border: 1px solid var(--line-2); border-radius: 14px; padding: 12px 13px; outline: none; font-size: 16px; transition: border-color .2s, box-shadow .2s; }
textarea.inp { resize: none; line-height: 1.5; }
.inp:focus { border-color: rgba(110, 150, 255, .6); box-shadow: 0 0 0 4px rgba(79, 141, 255, .12); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid2 > *, .cta-row > *, .inp { min-width: 0; }
/* l'heure sur iPhone gardait une largeur fixe et débordait de la carte */
input[type=time].inp { -webkit-appearance: none; appearance: none; min-height: 48px; display: block; }
input[type=time]::-webkit-date-and-time-value { text-align: left; }
.err { color: #FFB0B0; background: rgba(255, 107, 107, .1); border: 1px solid rgba(255, 107, 107, .28); border-radius: 14px; padding: 11px 13px; font-size: 13.5px; margin: 10px 0; }
.note { background: rgba(255, 255, 255, .06); border: 1px solid var(--line); border-radius: 14px; padding: 11px 13px; font-size: 13.5px; margin-bottom: 10px; }
.loading { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 20px; color: var(--mu); }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .2); border-top-color: currentColor; animation: spin .8s linear infinite; display: inline-block; }
.loading .spinner { border-top-color: var(--sun); }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { text-align: center; padding: 30px 16px; }
.empty-t { font-weight: 600; font-size: 16px; margin-bottom: 4px; }

/* Sport */
.wk-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 16px 0; }
.wk-c { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.wk-l { font-size: 12px; color: var(--mu); }
.wk-d { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: rgba(255, 255, 255, .05); border: 1px solid var(--line); font-weight: 700; font-size: 13px; }
.wk-d.on { background: linear-gradient(135deg, #4F8DFF, #7A5CFF); border-color: transparent; box-shadow: 0 0 14px rgba(79, 141, 255, .5); }
.wk-d.today { box-shadow: 0 0 0 2px rgba(255, 255, 255, .35); }
.wk-d.on.today { box-shadow: 0 0 0 2px rgba(255, 255, 255, .35), 0 0 14px rgba(79, 141, 255, .5); }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 16px; background: rgba(255, 255, 255, .05); border: 1px solid var(--line); margin: 4px 0 14px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.seg button { flex: 1; padding: 9px 4px; border-radius: 12px; font-weight: 600; font-size: 14px; color: var(--mu); line-height: 1.15; }
.seg button.on { background: linear-gradient(135deg, rgba(79, 141, 255, .32), rgba(122, 92, 255, .26)); color: #fff; }
.seg button small { display: block; font-weight: 500; font-size: 10.5px; color: #FF9A55; }
.seg.small { background: none; border: none; padding: 0; gap: 8px; justify-content: flex-start; backdrop-filter: none; -webkit-backdrop-filter: none; }
.seg.small button { flex: 0 0 auto; padding: 7px 14px; font-size: 13.5px; font-weight: 500; border-radius: 99px; background: rgba(255, 255, 255, .06); border: 1px solid var(--line); }
.seg.small button.on { background: rgba(79, 141, 255, .22); border-color: rgba(79, 141, 255, .45); }
.ex-list { display: grid; gap: 10px; }
.ex { --acc: var(--mu); border-radius: 20px; overflow: hidden; }
.ex.up { --acc: var(--up); } .ex.hold { --acc: #8FB4FF; } .ex.new { --acc: var(--sky); }
.ex-head { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 14px 15px; }
.ex-main { flex: 1; min-width: 0; }
.ex-name { font-size: 13.5px; color: var(--mu); font-weight: 500; }
.ex-target { font-weight: 700; font-size: 19px; letter-spacing: -.3px; color: var(--acc); margin-top: 2px; }
.ex-sub { font-size: 12px; color: var(--dim); margin-top: 2px; }
.ex-body { padding: 2px 15px 15px; border-top: 1px solid var(--line); }
.ex-why { font-size: 13.5px; margin: 12px 0 8px; }
.cues { list-style: none; margin: 10px 0 4px; }
.cues li { position: relative; padding-left: 16px; font-size: 13.5px; margin-bottom: 6px; }
.cues li::before { content: ""; position: absolute; left: 2px; top: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 8px var(--acc); }
.hist-row { display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.hist-row:last-child { border-bottom: none; }
.hist-row > span:first-child { color: var(--mu); }
.hist-row > span:last-child { text-align: right; white-space: pre; font-variant-numeric: tabular-nums; }
.rules { list-style: none; display: grid; gap: 8px; }
.rules li { font-size: 14px; padding: 12px 14px; border-radius: 16px; box-shadow: none; }
.block .rules li { background: rgba(255, 255, 255, .04); backdrop-filter: none; -webkit-backdrop-filter: none; }
.wrow { border-bottom: 1px solid var(--line); }
.wrow:last-of-type { border-bottom: none; }
.wrow-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 11px 0; }
.wrow-body { padding-bottom: 12px; }
.chart { display: block; width: 100%; height: auto; overflow: visible; }

/* Poids et stats */
.w-hero { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 14px; }
.w-big { font-weight: 600; font-size: 48px; letter-spacing: -2px; line-height: 1; font-variant-numeric: tabular-nums; }
.w-big span { font-size: 17px; color: var(--mu); font-weight: 500; letter-spacing: 0; }
.w-goal { text-align: right; }
.w-goal-v { font-weight: 600; font-size: 22px; color: #8FB4FF; }
.w-ok { font-weight: 600; font-size: 22px; color: var(--up); }
.up-txt { color: var(--up); font-size: 12.5px; }
.down-txt { color: var(--down); font-size: 12.5px; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.stat { border-radius: 20px; padding: 14px 15px; }
.stat-v { font-weight: 600; font-size: 25px; letter-spacing: -.6px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat-v small { font-weight: 500; font-size: 13px; color: var(--mu); letter-spacing: 0; }
.stat-l { font-size: 12.5px; color: var(--mu); margin-top: 4px; line-height: 1.35; }

/* Sommeil (panneau) */
.energy { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.energy button { height: 50px; border-radius: 15px; background: rgba(255, 255, 255, .05); border: 1px solid var(--line); font-size: 22px; opacity: .5; transition: all .15s; }
.energy button.on { opacity: 1; background: rgba(155, 125, 255, .2); border-color: rgba(155, 125, 255, .55); box-shadow: 0 0 14px rgba(155, 125, 255, .35); }

/* ── Panneaux du bas ── */
.sheet-wrap { position: fixed; inset: 0; z-index: 200; display: flex; align-items: flex-end; justify-content: center; background: rgba(2, 3, 10, .55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); animation: fadeIn .2s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.sheet { width: 100%; max-width: 520px; max-height: calc(100dvh - var(--safe-t) - 24px); display: flex; flex-direction: column; background: linear-gradient(180deg, rgba(26, 31, 62, .88), rgba(10, 13, 30, .94)); backdrop-filter: blur(30px) saturate(150%); -webkit-backdrop-filter: blur(30px) saturate(150%); border: 1px solid var(--line-2); border-bottom: none; border-radius: 28px 28px 0 0; animation: rise .34s cubic-bezier(.22, 1, .36, 1); transition: transform .25s ease; box-shadow: 0 -20px 60px rgba(0, 0, 0, .55); }
.sheet.tall { height: calc(100dvh - var(--safe-t) - 24px); }
@keyframes rise { from { transform: translateY(100%); } to { transform: none; } }
.sheet-head { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 22px 16px 12px; touch-action: none; }
.handle { position: absolute; top: 8px; left: 50%; width: 40px; height: 5px; margin-left: -20px; border-radius: 99px; background: rgba(255, 255, 255, .22); }
.sheet-title { font-weight: 700; font-size: 20px; letter-spacing: -.4px; }
.sheet-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 4px 16px 18px; }
.sheet-foot { padding: 12px 16px calc(12px + var(--safe-b)); border-top: 1px solid var(--line); background: rgba(10, 13, 30, .6); }
.sheet .fav, .sheet .stat, .sheet .panel { backdrop-filter: none; -webkit-backdrop-filter: none; background: rgba(255, 255, 255, .05); box-shadow: none; }
.toggle { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 12px 0; font-size: 15px; }
.sw { width: 50px; height: 30px; border-radius: 99px; background: rgba(255, 255, 255, .12); position: relative; transition: background .2s; }
.sw i { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
.toggle.on .sw { background: var(--sun); }
.toggle.on .sw i { transform: translateX(20px); }

/* Coach */
.coach-empty { display: grid; gap: 8px; margin-bottom: 8px; }
.sugg { text-align: left; padding: 13px 15px; border-radius: 16px; background: rgba(255, 255, 255, .05); border: 1px solid var(--line); font-size: 14px; }
.chat { display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 88%; padding: 11px 14px; border-radius: 19px; font-size: 14.5px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; background: linear-gradient(135deg, rgba(79, 141, 255, .4), rgba(122, 92, 255, .35)); border-bottom-right-radius: 6px; }
.msg.assistant { align-self: flex-start; background: rgba(255, 255, 255, .07); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
.msg.err { color: #FFB0B0; background: rgba(255, 107, 107, .1); }
.typing { display: flex; gap: 5px; padding: 15px 16px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--sun); animation: dots .9s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes dots { 0%, 100% { transform: translateY(0); opacity: .5; } 50% { transform: translateY(-4px); opacity: 1; } }
.composer { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1; min-height: 48px; max-height: 120px; }
.send { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--sun), var(--sun-2)); color: #fff; flex-shrink: 0; box-shadow: 0 6px 18px -6px rgba(79, 141, 255, .7); }
.send:disabled { background: rgba(255, 255, 255, .07); color: var(--dim); box-shadow: none; }

/* ── Barre du bas ── */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 100; padding: 0 12px calc(10px + var(--safe-b)); pointer-events: none; }
.nav-in { pointer-events: auto; max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr 76px 1fr 1fr; align-items: end; padding: 7px 7px 8px; border-radius: 26px; background: linear-gradient(180deg, rgba(30, 36, 70, .62), rgba(12, 15, 34, .72)); border: 1px solid var(--line-2); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%); box-shadow: 0 12px 40px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .08); }
.nb { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0 2px; color: var(--dim); font-size: 10.5px; font-weight: 500; transition: color .2s; }
.nb svg { padding: 7px; width: 38px; height: 38px; border-radius: 13px; transition: background .25s, box-shadow .25s, color .25s; }
.nb.on { color: #DCE6FF; }
.nb.on svg { color: #fff; background: linear-gradient(135deg, rgba(79, 141, 255, .55), rgba(62, 111, 255, .35)); box-shadow: 0 0 18px rgba(79, 141, 255, .45), inset 0 1px 0 rgba(255, 255, 255, .2); }
.nb:active svg { transform: scale(.92); }
.fab { justify-self: center; width: 60px; height: 60px; margin-top: -28px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, #5E9BFF, #7A5CFF); color: #fff; box-shadow: 0 10px 30px rgba(79, 141, 255, .55), 0 0 0 5px rgba(3, 5, 13, .9), inset 0 1px 0 rgba(255, 255, 255, .35); transition: transform .14s ease; }
.fab:active { transform: scale(.9) rotate(90deg); }

/* ── Retours visuels ── */
.toast { position: fixed; left: 50%; bottom: calc(108px + var(--safe-b)); transform: translateX(-50%); z-index: 300; display: flex; align-items: center; gap: 14px; max-width: calc(100% - 28px); width: max-content; padding: 10px 10px 10px 16px; border-radius: 18px; background: rgba(30, 36, 70, .82); border: 1px solid var(--line-2); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 12px 34px rgba(0, 0, 0, .55); font-size: 14px; animation: toastIn .3s cubic-bezier(.22, 1, .36, 1); }
.toast.top { top: calc(14px + var(--safe-t)); bottom: auto; }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
.toast-undo { color: #fff; font-weight: 600; padding: 7px 12px; border-radius: 12px; background: linear-gradient(135deg, rgba(79, 141, 255, .55), rgba(122, 92, 255, .45)); white-space: nowrap; }
.cel { position: fixed; left: 50%; top: calc(16px + var(--safe-t)); z-index: 310; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 10px 18px 10px 12px; border-radius: 99px; background: rgba(30, 36, 70, .85); border: 1px solid rgba(140, 170, 255, .45); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); font-weight: 600; font-size: 15px; box-shadow: 0 0 40px rgba(79, 141, 255, .35); animation: celIn .5s cubic-bezier(.34, 1.56, .64, 1); white-space: nowrap; }
.cel-ic { font-size: 22px; }
.cel.big { padding: 13px 22px 13px 16px; font-size: 18px; border-color: rgba(255, 193, 90, .6); box-shadow: 0 0 50px rgba(255, 140, 60, .35); }
@keyframes celIn { from { opacity: 0; transform: translate(-50%, -16px) scale(.85); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
.confetti { position: fixed; z-index: 305; width: 0; height: 0; pointer-events: none; }
.confetti i { position: absolute; left: 0; top: 0; border-radius: 2px; animation: fly 1.4s cubic-bezier(.2, .7, .4, 1) forwards; }
@keyframes fly {
  0% { transform: translate(0, 0) rotate(0); opacity: 1; }
  55% { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 1; }
  100% { transform: translate(calc(var(--x) * 1.15), calc(var(--y) + 280px)) rotate(calc(var(--r) * 1.6)); opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

/* ── v5 : coach qui réorganise la journée ── */
.agent-sub { color: var(--mu); font-size: 13.5px; margin: -4px 0 12px; }
.agent-in { display: flex; gap: 8px; align-items: center; }
.agent-in .inp { flex: 1; }
.agent-in .send { width: 46px; height: 46px; }
.agent-chips { display: flex; gap: 8px; overflow-x: auto; margin: 12px -16px 0; padding: 0 16px 2px; scrollbar-width: none; }
.agent-chips .chip { flex: 0 0 auto; white-space: nowrap; font-size: 13px; }
.sheet .agent-chips { flex-wrap: wrap; overflow: visible; margin: 12px 0 0; padding: 0; }
.chip:disabled { opacity: .45; }
.plan { border-color: rgba(155, 125, 255, .35); box-shadow: 0 0 0 1px rgba(155, 125, 255, .1), 0 16px 44px -18px rgba(120, 90, 255, .45), inset 0 1px 0 rgba(255, 255, 255, .07); }
.plan-sum { font-size: 15px; font-weight: 500; margin: -4px 0 10px; }
.plan-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.ptag { font-size: 12.5px; padding: 5px 10px; border-radius: 99px; background: rgba(255, 255, 255, .06); border: 1px solid var(--line); }
.ptag.moon { background: rgba(155, 125, 255, .16); border-color: rgba(155, 125, 255, .35); color: #D5CAFF; }
.plan-meals { display: flex; flex-direction: column; margin-bottom: 12px; }
.pm { display: grid; grid-template-columns: 44px 14px 1fr auto; align-items: center; gap: 0 8px; padding: 8px 0; position: relative; }
.pm + .pm::before { content: ""; position: absolute; left: 57px; top: -10px; height: 20px; width: 2px; background: rgba(155, 125, 255, .25); }
.pm-t { font-size: 13px; font-weight: 600; color: var(--mu); font-variant-numeric: tabular-nums; }
.pm-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--moon); background: transparent; justify-self: center; }
.pm.done .pm-dot { background: var(--moon); box-shadow: 0 0 8px var(--moon); }
.pm.now .pm-dot { background: #FF9A55; border-color: #FF9A55; box-shadow: 0 0 10px #FF9A55; }
.pm.now .pm-l { color: #FFB385; }
.pm.past { opacity: .5; }
.pm-main { display: flex; flex-direction: column; min-width: 0; }
.pm-l { font-size: 14.5px; font-weight: 500; }
.pm-i { font-size: 12px; color: var(--mu); }
.pm-k { font-size: 13px; color: #A9C4FF; font-variant-numeric: tabular-nums; }
.pm.done .pm-k { color: var(--moon); }
.plan-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.plan-chip { align-self: flex-start; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; max-width: 88%; padding: 8px 12px; border-radius: 14px; background: rgba(155, 125, 255, .14); border: 1px solid rgba(155, 125, 255, .35); font-size: 13px; color: #DCD3FF; }

/* ── v5 : séance qui change ── */
.diff { border-color: rgba(255, 154, 85, .4); box-shadow: 0 0 0 1px rgba(255, 154, 85, .1), 0 16px 44px -18px rgba(255, 120, 50, .35), inset 0 1px 0 rgba(255, 255, 255, .07); }
.diff-row { padding: 10px 0; border-top: 1px solid var(--line); }
.diff-n { font-weight: 600; font-size: 14.5px; margin-bottom: 8px; }
.diff-sel { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--mu); }
.diff-sel select { flex: 1; padding: 9px 11px; font-size: 14px; }
.toggle.small { font-size: 14px; padding: 8px 0; text-align: left; gap: 12px; }
.pe-row { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.pe-main { flex: 1; min-width: 0; display: flex; flex-direction: column; text-align: left; }
.pe-btn { width: 32px; height: 32px; border-radius: 10px; background: rgba(255, 255, 255, .06); border: 1px solid var(--line); flex-shrink: 0; font-size: 15px; }
.pe-btn:disabled { opacity: .3; }
</style>

- summary : une ligne qui r\xE9sume le plan (ex. "Sortie ce soir : d\xEEner \xE0 19 h 30, coucher vers 3 h, s\xE9ance demain").
