<style>/* ─────────────────────────────────────────────────────────────
   Isma Daily · base : remise à zéro, boutons, formulaires, listes, fiches.
   Les jetons (couleurs, polices) et les écrans principaux sont dans client.css.
   Règle : une surface plate, une ligne fine pour séparer, l'or pour l'essentiel.
   ───────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; min-height: 100dvh; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:disabled { cursor: default; }
input, textarea, select { color-scheme: dark; }
::-webkit-scrollbar { width: 0; height: 0; }
b, strong { font-weight: 600; }
h1, h2, h3, h4 { font-weight: inherit; font-size: inherit; }
ul, ol { list-style: none; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes rise { from { transform: translateY(100%); } to { transform: none; } }

/* ── Boutons ── */
.cta, .wide-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px; padding: 12px 18px; border-radius: 4px;
  font-family: var(--fn); font-weight: 600; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--gold-hi);
  background: linear-gradient(180deg, rgba(200, 170, 110, .16), rgba(200, 170, 110, .06)); box-shadow: inset 0 0 0 1px rgba(200, 170, 110, .55); transition: transform .12s, opacity .2s, background .15s; }
.wide-btn { display: flex; margin-bottom: 10px; }
.cta:active, .wide-btn:active { transform: scale(.98); }
.cta:disabled, .wide-btn:disabled { opacity: .4; }
.cta.ghost, .wide-btn.ghost { color: var(--tx); background: none; box-shadow: inset 0 0 0 1px var(--line-2); }
.cta.moon { color: #E4DEFF; background: rgba(156, 139, 255, .12); box-shadow: inset 0 0 0 1px rgba(156, 139, 255, .5); }
.cta.sky, .cta.neon { color: var(--blue-hi); background: rgba(60, 180, 230, .12); box-shadow: inset 0 0 0 1px rgba(60, 180, 230, .5); }
.cta.flesh { color: #FFE3CF; background: rgba(232, 133, 58, .12); box-shadow: inset 0 0 0 1px rgba(232, 133, 58, .5); }
.cta.full { width: 100%; }
.cta.shrink { width: auto; flex: 0 0 auto; }
.cta-row { display: flex; gap: 10px; }
.cta-row > * { flex: 1; min-width: 0; }

.link { color: var(--blue); font-size: 14px; font-weight: 500; padding: 2px 0; }
.link.small { font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 13px; border-radius: 99px; background: var(--bg-2); font-size: 13.5px; font-weight: 500; text-decoration: none; transition: transform .12s, background .15s; }
.chip:active { transform: scale(.96); }
.chip.on { color: var(--blue-hi); background: rgba(60, 180, 230, .14); box-shadow: inset 0 0 0 1px rgba(60, 180, 230, .45); }
.chip.danger { color: #FF8C9C; }
.chip:disabled { opacity: .45; }
.tag { display: inline-block; margin-left: 7px; padding: 2px 7px; border-radius: 3px; vertical-align: 1px; font-size: 11px; font-weight: 600; color: var(--mu); background: var(--bg-2); }
.tag.ok { color: var(--green); background: rgba(61, 214, 140, .12); }
.tag.ia { color: #D7BEFF; background: rgba(168, 123, 234, .14); }
.tag.new { color: #F0C878; background: rgba(240, 184, 74, .14); }
.tag.warn { color: #FF8C9C; background: rgba(232, 64, 87, .14); }
.tag.sun { color: var(--blue-hi); background: rgba(60, 180, 230, .14); }

/* ── Textes, utilitaires, blocs ── */
.block { margin-top: 30px; }
.panel-t { margin-bottom: 10px; }
.count { font-family: var(--fn); font-weight: 600; color: var(--mu); font-size: 13px; }

.hint b { color: var(--mu); }
.small { font-size: 12.5px; }
.center { text-align: center; }

.row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.mt6 { margin-top: 6px; } .mt8 { margin-top: 8px; } .mt10 { margin-top: 10px; } .mt14 { margin-top: 14px; } .mt18 { margin-top: 18px; }
.mb10 { margin-bottom: 10px; } .mb18 { margin-bottom: 18px; }
.err { margin: 10px 0; padding: 11px 13px; border-radius: 6px; font-size: 13.5px; color: #FFB3BE; background: rgba(232, 64, 87, .1); }
.note { margin-bottom: 10px; padding: 11px 13px; border-radius: 6px; font-size: 13.5px; color: var(--tx); background: rgba(60, 180, 230, .08); }
.loading { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 20px; color: var(--mu); }
.spinner { display: inline-block; width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(240, 230, 210, .15); border-top-color: currentColor; animation: spin .8s linear infinite; }
.loading .spinner { border-top-color: var(--blue); }
.empty { text-align: center; padding: 26px 16px; }
.empty-t { font-weight: 600; font-size: 16px; color: var(--tx); margin-bottom: 4px; }
.sub-h { margin: 20px 0 8px; font-family: var(--fn); font-weight: 600; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }

/* ── Formulaires ── */
.field { display: block; margin-bottom: 12px; }
.field > span { display: block; margin-bottom: 6px; font-size: 13px; color: var(--mu); }
.inp { width: 100%; padding: 12px 13px; border-radius: 6px; outline: none; font-size: 16px; background: var(--bg); border: 1px solid var(--line-2); transition: border-color .2s; }
textarea.inp { resize: none; line-height: 1.5; }
.inp:focus { border-color: var(--blue); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid2 > *, .inp { min-width: 0; }
input[type=time].inp { -webkit-appearance: none; appearance: none; min-height: 48px; display: block; }
input[type=time]::-webkit-date-and-time-value { text-align: left; }
.gram { display: flex; align-items: center; gap: 4px; height: 42px; padding: 0 11px; flex-shrink: 0; border-radius: 6px; background: var(--bg); border: 1px solid var(--line-2); }
.gram input { width: 54px; background: none; border: none; outline: none; text-align: right; font-family: var(--fn); font-weight: 600; font-size: 17px; }
.gram span { color: var(--mu); font-size: 12.5px; }
.gram.wide { width: 100%; }
.gram.wide input { width: 100%; text-align: left; }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; padding: 12px 0; font-size: 15px; text-align: left; }
.sw { position: relative; width: 46px; height: 28px; flex-shrink: 0; border-radius: 14px; background: var(--bg-3); transition: background .2s; }
.sw i { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--mu); transition: transform .2s var(--ease), background .2s; }
.toggle.on .sw { background: var(--blue-lo); }
.toggle.on .sw i { transform: translateX(18px); background: #fff; }
.toggle.small { font-size: 14px; padding: 8px 0; gap: 12px; }

/* ── Ajout et édition de repas ── */
.pbar { margin-bottom: 14px; }
.pbar-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; font-size: 14px; color: var(--mu); }
.pbar-val { color: var(--mu); font-size: 13px; }
.pbar-val b { font-family: var(--fn); color: var(--tx); font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
.pbar-track { position: relative; height: 6px; border-radius: 3px; background: var(--bg-3); }
.pbar-fill { height: 100%; border-radius: 3px; transition: width .9s var(--ease); }
.pbar-mark { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--gold-hi); }

.items { margin: 8px 0 10px; }
.item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: none; }
.item-main { flex: 1; min-width: 0; }
.item-name { font-size: 14.5px; font-weight: 500; }
.item-sub { font-size: 12.5px; color: var(--mu); margin-top: 1px; }
.item.missing .gram { border-color: var(--red); }
.warn-txt { color: #F0C878; font-size: 12.5px; margin-top: 3px; }
.x-btn { width: 32px; height: 32px; flex-shrink: 0; display: grid; place-items: center; border-radius: 50%; color: #FF8C9C; background: rgba(232, 64, 87, .12); }
.unmatched { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 8px 0; padding: 10px 13px; border-radius: 6px; font-size: 13.5px; background: rgba(232, 64, 87, .08); }
.unmatched span { flex: 1; min-width: 150px; }
.list-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 12px 0; text-align: left; border-bottom: 1px solid var(--line); }
.list-row:last-child { border-bottom: none; }
.nm { font-size: 14.5px; font-weight: 600; }

.plus-dot { width: 30px; height: 30px; flex-shrink: 0; display: grid; place-items: center; border-radius: 50%; color: var(--gold); box-shadow: inset 0 0 0 1px rgba(200, 170, 110, .45); }
.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; margin-bottom: 14px; padding: 3px; border-radius: 8px; background: var(--bg); }
.modes button { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 4px; border-radius: 6px; font-weight: 500; font-size: 14px; color: var(--mu); transition: background .15s, color .15s; }
.modes button.on { color: var(--gold-hi); background: var(--bg-2); }
.composer-box { display: grid; gap: 10px; }
.hscroll { display: flex; gap: 10px; margin: 0 -18px; padding: 0 18px 6px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 18px; }
.fav { flex: 0 0 172px; scroll-snap-align: start; display: flex; flex-direction: column; overflow: hidden; border-radius: 8px; background: var(--bg-2); }
.fav-main { display: flex; flex-direction: column; justify-content: space-between; gap: 10px; min-height: 92px; padding: 12px 13px 10px; text-align: left; transition: background .2s; }
.fav-main:active { background: rgba(200, 170, 110, .08); }
.fav-n { font-weight: 600; font-size: 15px; line-height: 1.25; color: var(--tx); }
.fav-k { font-size: 12.5px; color: var(--mu); }
.fav-k b { font-family: var(--fn); font-weight: 600; color: var(--gold-hi); font-size: 17px; }
.fav-adj { padding: 9px 13px; text-align: left; font-size: 12.5px; font-weight: 500; color: var(--mu); border-top: 1px solid var(--line); }
.recent { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.recent:last-child { border-bottom: none; }
.recent-main { flex: 1; min-width: 0; text-align: left; }
.recent-n { display: block; font-weight: 600; font-size: 14.5px; }
.recent-i { display: block; font-size: 12.5px; color: var(--mu); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.recent-r { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0; }
.recent-r b { font-family: var(--fn); font-weight: 600; color: var(--gold-hi); }
.total-line { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.total-line b { display: inline-flex; align-items: center; gap: 6px; font-family: var(--fn); font-weight: 600; font-size: 24px; color: var(--gold-hi); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ── Arène : listes et éditeur de programme ── */
.cues { margin: 10px 0 4px; }
.cues li { position: relative; margin-bottom: 6px; padding-left: 16px; font-size: 13.5px; line-height: 1.45; }
.cues li::before { content: ""; position: absolute; left: 3px; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--acc, var(--gold)); }
.hist-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; font-size: 13.5px; border-bottom: 1px solid var(--line); }
.hist-row:last-child { border-bottom: none; }
.hist-row > span:first-child { color: var(--mu); }
.hist-row > span:last-child { text-align: right; white-space: pre; font-variant-numeric: tabular-nums; }
.hist-row small { display: block; font-size: 11.5px; color: var(--dim); white-space: normal; }
.wrow { border-bottom: 1px solid var(--line); }
.wrow:last-of-type { border-bottom: none; }
.wrow-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; padding: 11px 0; text-align: left; }
.wrow-body { padding-bottom: 12px; }
.chart { display: block; width: 100%; height: auto; overflow: visible; }
.diff { box-shadow: inset 0 0 0 1px rgba(232, 133, 58, .4); }
.diff-row { padding: 10px 0; border-top: 1px solid var(--line); }
.diff-n { margin-bottom: 8px; font-weight: 600; font-size: 14.5px; }
.diff-sel { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--mu); }
.diff-sel select { flex: 1; padding: 9px 11px; font-size: 14px; }
.pe-row { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.pe-main { flex: 1; min-width: 0; display: flex; flex-direction: column; text-align: left; }
.pe-btn { width: 32px; height: 32px; flex-shrink: 0; border-radius: 6px; font-size: 15px; background: var(--bg-2); }
.pe-btn:disabled { opacity: .3; }
.seg.small { gap: 8px; justify-content: flex-start; margin: 4px 0 14px; border-bottom: none; }
.seg.small button { flex: 0 0 auto; padding: 7px 14px; border-radius: 99px; font-family: var(--fu); font-weight: 500; font-size: 13.5px; letter-spacing: 0; text-transform: none; color: var(--mu); background: var(--bg-2); }
.seg.small button.on { color: var(--blue-hi); background: rgba(60, 180, 230, .14); }
.seg.small button.on::after { content: none; }

/* ── Profil ── */

   

   

.ach { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
.block-head + .ach, .sec-h + .ach { border-top: none; }

/* ── Panneaux du bas (fiches) ── */
.sheet-wrap { position: fixed; inset: 0; z-index: 200; display: flex; align-items: flex-end; justify-content: center; background: rgba(2, 4, 8, .62); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); animation: fadeIn .2s ease; }
.sheet { position: relative; width: 100%; max-width: 520px; max-height: calc(100dvh - var(--safe-t) - 24px); display: flex; flex-direction: column; border-radius: 14px 14px 0 0;
  animation: rise .34s var(--ease); transition: transform .25s ease; box-shadow: 0 -1px 0 rgba(240, 230, 210, .08), 0 -24px 60px rgba(0, 0, 0, .6); }
.sheet.tall { height: calc(100dvh - var(--safe-t) - 24px); }
.sheet-head { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 22px 18px 12px; touch-action: none; }
.handle { position: absolute; top: 8px; left: 50%; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: var(--bg-3); }
.sheet-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 4px 18px 20px; }
.sheet-foot { padding: 12px 18px calc(12px + var(--safe-b)); border-top: 1px solid var(--line); background: var(--bg-1); }
.sheet .fav, .sheet .stat, .sheet .panel, .sheet .card { background: var(--bg-2); box-shadow: none; }

.sheet .block:first-child, .sheet .sec:first-child { margin-top: 4px; }
.rt-list { margin-bottom: 4px; }
.toggle.rt { padding: 9px 0; border-bottom: 1px solid var(--line); }
.toggle.rt:last-child { border-bottom: none; }

.rt-tx { display: flex; flex-direction: column; font-size: 14.5px; font-weight: 500; }
.rt-tx small { font-size: 12px; font-weight: 400; color: var(--mu); }
.energy { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.energy button { height: 48px; border-radius: 8px; font-family: var(--fn); font-weight: 600; font-size: 18px; color: var(--mu); background: var(--bg-2); transition: color .15s, background .15s; }
.energy button.on { color: #9DF5C8; background: rgba(61, 214, 140, .14); box-shadow: inset 0 0 0 1px rgba(61, 214, 140, .5); }
.energy-l { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; color: var(--dim); }
.forge { display: grid; gap: 4px; }

/* Coach */
.chat { display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 88%; padding: 11px 14px; border-radius: 12px; font-size: 14.5px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; border-bottom-right-radius: 4px; background: rgba(60, 180, 230, .14); }

.msg.err { color: #FFB3BE; background: rgba(232, 64, 87, .1); }
.typing { display: flex; gap: 5px; padding: 15px 16px; }

@keyframes dots { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
.composer { display: flex; gap: 8px; align-items: flex-end; }

.agent-chips { display: flex; gap: 8px; margin: 12px -18px 0; padding: 0 18px 2px; overflow-x: auto; scrollbar-width: none; }

/* ── Retours ── */
.toast { position: fixed; left: 50%; bottom: calc(76px + var(--safe-b)); transform: translateX(-50%); z-index: 300; display: flex; align-items: center; gap: 14px; width: max-content; max-width: calc(100% - 28px); padding: 10px 10px 10px 15px; border-radius: 10px;
  font-size: 14px; background: var(--bg-2); box-shadow: 0 0 0 1px var(--line-2), 0 12px 34px rgba(0, 0, 0, .6); animation: toastIn .3s var(--ease); }
.toast.top { top: calc(14px + var(--safe-t)); bottom: auto; }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
.toast-undo { padding: 7px 12px; border-radius: 6px; font-family: var(--fn); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--blue); white-space: nowrap; }
.update-bar { position: fixed; left: 50%; top: calc(10px + var(--safe-t)); transform: translateX(-50%); z-index: 320; display: flex; align-items: center; gap: 12px; width: max-content; max-width: calc(100% - 24px); padding: 8px 8px 8px 15px; border-radius: 10px;
  font-weight: 500; font-size: 14.5px; color: var(--tx); background: var(--bg-2); box-shadow: 0 0 0 1px rgba(200, 170, 110, .5), 0 10px 34px rgba(0, 0, 0, .6); animation: toastIn .3s ease; }
.update-bar button { padding: 8px 14px; border-radius: 6px; font-family: var(--fn); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--bg); background: var(--gold); white-space: nowrap; }
.confetti { position: fixed; z-index: 605; width: 0; height: 0; pointer-events: none; }
.confetti i { position: absolute; left: 0; top: 0; border-radius: 1px; animation: fly 1.4s cubic-bezier(.2, .7, .4, 1) forwards; }
@keyframes fly {
  0% { transform: translate(0, 0) rotate(0); opacity: 1; }
  55% { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 1; }
  100% { transform: translate(calc(var(--x) * 1.15), calc(var(--y) + 280px)) rotate(calc(var(--r) * 1.6)); opacity: 0; }
}

/* ═════════════════════════════════════════════════════════════
   Posture (vert soin) et glow-up
   ═════════════════════════════════════════════════════════════ */

.pz-meta span { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--mu); }
.pz-meta b { font-family: var(--fn); font-weight: 600; color: var(--tx); font-size: 15px; }
.pz-meta .ok, .pz-meta .ok b { color: var(--green); }
.pz-list { display: grid; }
.pz-ex { border-bottom: 1px solid var(--line); }
.pz-ex:last-child { border-bottom: none; }
.pz-ex-h { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 0; text-align: left; }
.pz-ex-h > svg:last-child { flex-shrink: 0; color: var(--dim); transition: transform .2s; }
.pz-ex.open .pz-ex-h > svg:last-child { transform: rotate(180deg); }
.pz-pic { width: 76px; height: 57px; flex-shrink: 0; display: grid; place-items: center; border-radius: 6px; color: var(--green); background: rgba(61, 214, 140, .07); }
.pz-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.pz-n { font-weight: 600; font-size: 15px; color: var(--tx); }
.pz-d { font-size: 12px; color: var(--green); }
.pz-w { margin-top: 2px; font-size: 12.5px; color: var(--mu); }
.pz-cues { --acc: var(--green); padding: 0 0 12px 88px; }
.round-btn.lg { width: 54px; height: 54px; }
.pp-intro .pp-steps { display: grid; }
.pp-step { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.pp-step:last-child { border-bottom: none; }
.pp-pic { width: 64px; height: 48px; display: grid; place-items: center; color: var(--green); }
.pp-tx { display: flex; flex-direction: column; font-size: 14.5px; }
.pp-tx span { font-size: 12.5px; color: var(--mu); }
.pp-run { display: flex; flex-direction: column; align-items: center; text-align: center; }
.pp-bars { display: flex; gap: 5px; width: 100%; margin: 2px 0 14px; }
.pp-bars i { flex: 1; height: 4px; overflow: hidden; border-radius: 2px; background: var(--bg-3); }
.pp-bars b { display: block; height: 100%; background: var(--green); }
.pp-k { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--mu); }
.pp-side { padding: 2px 9px; border-radius: 99px; font-weight: 600; color: #9DF5C8; background: rgba(61, 214, 140, .12); }
.pp-n { margin-top: 4px; font-weight: 600; font-size: 22px; color: var(--tx); }
.pp-ring { position: relative; width: min(250px, 66vw); aspect-ratio: 1; margin: 10px auto 2px; }
.pp-ring svg { width: 100%; height: 100%; overflow: visible; }
.pp-track { fill: none; stroke: var(--bg-3); stroke-width: 8; }
.pp-arc { fill: none; stroke: var(--green); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset .15s linear; }
.pp-arc.glow { display: none; }
.pp-run.prep .pp-arc { stroke: var(--gold); }
.pp-mid { position: absolute; inset: 0; display: grid; place-items: center; color: var(--green); }
.pp-run.prep .pp-mid { color: var(--gold); }
.pp-sec { font-family: var(--fn); font-weight: 600; font-size: 54px; line-height: 1; font-variant-numeric: tabular-nums; }
.pp-sec small { font-size: 18px; font-weight: 500; color: var(--mu); }
.pp-run.paused .pp-sec, .pp-run.paused .pp-ring { opacity: .45; }
.pp-flash { margin-top: 10px; padding: 8px 16px; border-radius: 6px; font-family: var(--fn); font-weight: 600; font-size: 16px; letter-spacing: .06em; text-transform: uppercase; color: #06281B; background: var(--green); animation: pop .3s var(--ease); }
.pp-cues { --acc: var(--green); align-self: stretch; margin: 14px 4px 6px; text-align: left; }
.pp-ctrl { display: flex; align-items: center; justify-content: center; gap: 26px; margin: 12px 0 6px; }
.pp-play { width: 72px; height: 72px; display: grid; place-items: center; border-radius: 50%; color: #06281B; background: var(--green); transition: transform .12s; }
.pp-play:active { transform: scale(.94); }
.pp-pause { width: 18px; height: 22px; border-left: 6px solid currentColor; border-right: 6px solid currentColor; }
.pp-end { display: flex; flex-direction: column; align-items: center; padding: 30px 6px 10px; text-align: center; }
.pp-end h3 { margin: 18px 0 6px; font-family: var(--ft); font-weight: 700; font-size: 22px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold-hi); }
.pp-badge { width: 100px; height: 100px; display: grid; place-items: center; border-radius: 50%; color: var(--green); background: rgba(61, 214, 140, .12); box-shadow: inset 0 0 0 2px var(--green); animation: pop .5s var(--ease); }
.gu-cmp, .gu-one { position: relative; width: 100%; aspect-ratio: 3 / 4; overflow: hidden; border-radius: 8px; touch-action: pan-y; user-select: none; -webkit-user-select: none; background: var(--bg-1); }
.gu-cmp img, .gu-one img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.gu-line { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--gold-hi); pointer-events: none; }
.gu-knob { position: absolute; top: 50%; left: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; transform: translate(-50%, -50%); border-radius: 50%; color: var(--gold-hi); background: rgba(5, 8, 13, .7); box-shadow: inset 0 0 0 1.5px var(--gold); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.gu-tag { position: absolute; top: 12px; display: flex; flex-direction: column; padding: 6px 10px; border-radius: 6px; font-size: 11.5px; line-height: 1.25; color: var(--tx); background: rgba(5, 8, 13, .65); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); pointer-events: none; }
.gu-tag b { font-family: var(--fn); font-weight: 600; font-size: 13.5px; color: var(--gold-hi); }
.gu-tag.l { left: 12px; } .gu-tag.r { right: 12px; text-align: right; }
.gu-days { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); padding: 5px 12px; border-radius: 99px; font-family: var(--fn); font-weight: 600; font-size: 13px; white-space: nowrap; color: var(--gold-hi); background: rgba(5, 8, 13, .75); pointer-events: none; }
.gu-empty { display: flex; flex-direction: column; align-items: center; padding: 30px 22px; text-align: center; border-radius: 8px; background: var(--bg-1); }
.gu-empty-ic { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 50%; color: var(--gold-hi); background: rgba(200, 170, 110, .14); }
.gu-empty h3 { margin: 14px 0 4px; font-weight: 600; font-size: 18px; color: var(--tx); }
.gu-empty p { color: var(--mu); font-size: 14px; }
.gu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.gu-th { position: relative; min-width: 0; }
.gu-th-img { display: block; width: 100%; aspect-ratio: 3 / 4; overflow: hidden; border-radius: 6px; border: 2px solid transparent; background: var(--bg-1); }
.gu-th-img img { display: block; width: 100%; height: 100%; object-fit: cover; }
.gu-th.a .gu-th-img { border-color: var(--blue); }
.gu-th.b .gu-th-img { border-color: var(--gold); }
.gu-th-d { display: flex; justify-content: space-between; gap: 6px; margin-top: 5px; font-size: 11.5px; color: var(--mu); }
.gu-th-d i { font-style: normal; font-weight: 600; color: var(--tx); }
.gu-del { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; color: #fff; background: rgba(0, 0, 0, .6); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  .ann { animation: annFade 2s steps(1, end) forwards !important; }
}
@keyframes annFade { 0%, 99% { opacity: 1; } 100% { opacity: 0; } }

/* ═════════════════════════════════════════════════════════════
   Isma Daily · v10 « Atelier »
   Un banc d'essai, pas un jeu : des instruments, des chiffres exacts,
   une seule couleur d'action (orange signal), des états clairs.
   Inter Tight pour lire, JetBrains Mono pour mesurer.
   ═════════════════════════════════════════════════════════════ */
:root {
  --bg: #0A0B0D; --bg-1: #111317; --bg-2: #171A1F; --bg-3: #22262D; --bg-4: #2C313A;
  --line: rgba(255, 255, 255, .07); --line-2: rgba(255, 255, 255, .13);
  --tx: #ECEEF1; --mu: #9097A1; --dim: #5D646E;
  --acc: #FF6A2A; --acc-hi: #FF9B6B; --acc-lo: #7A2E0E; --acc-tint: rgba(255, 106, 42, .12);
  --ok: #3DDC84; --warn: #FFB020; --crit: #FF4F4F; --idle: #6B7380;
  --sleep: #8C9EFF; --prot: #FFB27A; --mass: #ECEEF1; --train: #5FD4C4;
  --fu: 'Inter Tight', -apple-system, system-ui, sans-serif;
  --fm: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --r: 12px; --r-s: 8px;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --safe-t: env(safe-area-inset-top); --safe-b: env(safe-area-inset-bottom);
  /* noms utilisés par base.css (formulaires, fiches, posture, photos) */
  --gold: var(--acc); --gold-hi: #FFE2D3; --gold-lo: var(--acc-lo);
  --blue: var(--sleep); --blue-hi: #D9DFFF; --blue-lo: #3D4A99;
  --green: var(--ok); --red: var(--crit); --orange: var(--acc); --violet: #B49BFF;
  --fn: var(--fm); --ft: var(--fu);
}
html, body { background: var(--bg); color: var(--tx); font-family: var(--fu); font-size: 15px; font-feature-settings: "ss01", "cv11"; }
.app { min-height: 100dvh; padding: calc(var(--safe-t) + 4px) 0 calc(128px + var(--safe-b)); }
.main { animation: pgIn .22s var(--ease) both; }
@keyframes pgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.page { max-width: 560px; margin: 0 auto; padding: 0 16px; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; border-radius: 4px; }
.num, .mono { font-family: var(--fm); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.muted { color: var(--mu); } .dim { color: var(--dim); }
.hint { font-size: 12.5px; line-height: 1.5; color: var(--dim); margin-top: 8px; }
.lbl { font-family: var(--fm); font-weight: 500; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.c-ok { color: var(--ok); } .c-warn { color: var(--warn); } .c-crit { color: var(--crit); } .c-acc { color: var(--acc); } .c-sleep { color: var(--sleep); }

/* ── En-tête ── */
.hdr { display: flex; align-items: center; gap: 10px; padding: 12px 0 6px; }
.hdr-t { flex: 1; min-width: 0; }
.hdr-t h1 { font-weight: 600; font-size: 22px; letter-spacing: -.02em; line-height: 1.15; }
.hdr-t p { margin-top: 2px; font-family: var(--fm); font-size: 11.5px; color: var(--mu); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr-r { display: flex; gap: 2px; margin-right: -8px; }
.ib { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; color: var(--mu); }
.ib:active { background: var(--bg-2); color: var(--tx); }
.sum { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 8px; font-family: var(--fm); font-size: 11px; color: var(--mu); }
.sum span { display: inline-flex; align-items: center; gap: 6px; }

/* ── État ── */
.dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: var(--idle); }
.dot.ok { background: var(--ok); box-shadow: 0 0 0 3px rgba(61, 220, 132, .14); }
.dot.warn { background: var(--warn); box-shadow: 0 0 0 3px rgba(255, 176, 32, .14); }
.dot.crit { background: var(--crit); box-shadow: 0 0 0 3px rgba(255, 79, 79, .16); animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .45; } }
.st { display: inline-flex; align-items: center; gap: 6px; font-family: var(--fm); font-size: 10.5px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--mu); white-space: nowrap; }
.st.ok { color: var(--ok); } .st.warn { color: var(--warn); } .st.crit { color: var(--crit); }

/* ── Panneaux ── */
.pnl { position: relative; margin-top: 12px; padding: 14px; border-radius: var(--r); background: var(--bg-1); border: 1px solid var(--line); }
.pnl-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.pnl-h h2, .pnl-h h3 { display: flex; align-items: baseline; gap: 8px; font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
.pnl-h h2 .lbl, .pnl-h h3 .lbl { color: var(--acc); }
.sec { margin-top: 26px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.sec-h h2 { font-family: var(--fm); font-weight: 500; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--mu); }
.sec-h h2 b { color: var(--acc); font-weight: 500; margin-right: 6px; }
.sec-r { font-family: var(--fm); font-size: 11px; color: var(--dim); }
button.sec-r { color: var(--acc); }

/* Grand chiffre */
.big { display: flex; align-items: baseline; gap: 6px; font-family: var(--fm); font-variant-numeric: tabular-nums; }
.big b { font-weight: 600; font-size: 30px; letter-spacing: -.03em; line-height: 1; color: var(--tx); }
.big span { font-size: 12px; color: var(--mu); }
.big.xl b { font-size: 44px; }
.big.md b { font-size: 22px; }

/* Barre de mesure : remplissage, repère « où tu devrais en être », projection */
.bar { position: relative; height: 8px; border-radius: 2px; background: var(--bg-3); overflow: visible; }
.bar-f { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--acc); transform-origin: left; animation: grow .8s var(--ease) both; }
.bar-p { position: absolute; top: 0; bottom: 0; border-radius: 0 2px 2px 0; background: repeating-linear-gradient(90deg, rgba(255, 106, 42, .45) 0 3px, transparent 3px 6px); }
.bar-m { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--tx); border-radius: 1px; }
.bar.thin { height: 4px; }
.bar.sleep .bar-f { background: var(--sleep); } .bar.prot .bar-f { background: var(--prot); } .bar.ok .bar-f { background: var(--ok); } .bar.train .bar-f { background: var(--train); }
@keyframes grow { from { transform: scaleX(0); } to { transform: none; } }
.scale { display: flex; justify-content: space-between; margin-top: 6px; font-family: var(--fm); font-size: 10px; color: var(--dim); }

/* Mini courbes */
.spark { display: block; width: 100%; height: auto; overflow: visible; }
.spark .ln { fill: none; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
.spark .gd { stroke: var(--line-2); stroke-width: 1; stroke-dasharray: 2 3; }
.spark .pj { fill: none; stroke-width: 1.4; stroke-dasharray: 3 4; }

/* ═════════════════════════════════════════════════════════════
   Status
   ═════════════════════════════════════════════════════════════ */
.next { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 12px 12px 12px 14px; border-radius: var(--r); background: var(--acc-tint); border: 1px solid rgba(255, 106, 42, .3); }
.next-tx { flex: 1; min-width: 0; }
.next-k { font-family: var(--fm); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--acc-hi); }
.next-t { margin-top: 2px; font-weight: 600; font-size: 16px; line-height: 1.25; }
.next-s { margin-top: 2px; font-size: 13px; line-height: 1.4; color: var(--mu); }
.next .btn { flex-shrink: 0; }
.next.moon { background: rgba(140, 158, 255, .1); border-color: rgba(140, 158, 255, .3); }
.next.moon .next-k { color: var(--sleep); }

.sys-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.sys { display: flex; flex-direction: column; gap: 8px; min-width: 0; padding: 12px; border-radius: var(--r); text-align: left; background: var(--bg-1); border: 1px solid var(--line); transition: transform .1s, border-color .2s; }
.sys:active { transform: scale(.985); }
.sys.crit { border-color: rgba(255, 79, 79, .35); }
.sys.warn { border-color: rgba(255, 176, 32, .25); }
.sys-h { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.sys-n { font-family: var(--fm); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--mu); }
.sys-n b { color: var(--acc); font-weight: 500; margin-right: 5px; }
.sys .big b { font-size: 24px; }
.sys-l { font-size: 12px; line-height: 1.35; color: var(--mu); min-height: 32px; }
.sys-sub { display: flex; justify-content: space-between; font-family: var(--fm); font-size: 10.5px; color: var(--dim); }
.sys-sub b { color: var(--tx); font-weight: 500; }

.proto { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
.chk { display: flex; align-items: center; gap: 9px; min-width: 0; padding: 10px; border-radius: var(--r-s); text-align: left; background: var(--bg-1); border: 1px solid var(--line); transition: background .15s, border-color .15s; }
.chk-b { width: 20px; height: 20px; flex-shrink: 0; display: grid; place-items: center; border-radius: 5px; border: 1.5px solid var(--bg-4); color: var(--bg); }
.chk.on { border-color: rgba(61, 220, 132, .3); background: rgba(61, 220, 132, .06); }
.chk.on .chk-b { background: var(--ok); border-color: var(--ok); animation: pop .3s var(--ease); }
.chk-tx { min-width: 0; display: flex; flex-direction: column; }
.chk-n { font-weight: 500; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chk-s { font-family: var(--fm); font-size: 10.5px; color: var(--dim); }
.chk.on .chk-s { color: var(--ok); }
.chk.water .chk-b { border-radius: 50%; }
@keyframes pop { 0% { transform: scale(.5); } 70% { transform: scale(1.12); } 100% { transform: none; } }

.alerts { display: grid; gap: 8px; }
.al { display: grid; grid-template-columns: 3px 1fr; gap: 12px; padding: 11px 12px 11px 0; border-radius: var(--r-s); background: var(--bg-1); border: 1px solid var(--line); overflow: hidden; }
.al::before { content: ""; background: var(--idle); }
.al.crit::before { background: var(--crit); } .al.warn::before { background: var(--warn); } .al.info::before { background: var(--sleep); }
.al b { display: block; font-weight: 600; font-size: 14px; }
.al span { display: block; margin-top: 2px; font-size: 12.5px; line-height: 1.4; color: var(--mu); }

/* Semaine : matrice 7 jours × 4 mesures */
.mx { display: grid; grid-template-columns: 74px repeat(7, 1fr); gap: 4px; align-items: center; }
.mx-d { text-align: center; font-family: var(--fm); font-size: 10.5px; color: var(--dim); }
.mx-d.today { color: var(--acc); }
.mx-r { font-family: var(--fm); font-size: 10.5px; color: var(--mu); }
.mx-c { height: 18px; border-radius: 3px; background: var(--bg-2); }
.mx-c.l1 { background: rgba(255, 79, 79, .45); } .mx-c.l2 { background: rgba(255, 176, 32, .55); } .mx-c.l3 { background: rgba(61, 220, 132, .7); }
.mx-c.fut { background: transparent; border: 1px dashed var(--line); }
.mx-c.today { outline: 1px solid var(--acc); outline-offset: 1px; }

/* Nuit */
.nightp { margin-top: 12px; padding: 18px; border-radius: var(--r); background: linear-gradient(180deg, rgba(140, 158, 255, .1), var(--bg-1)); border: 1px solid rgba(140, 158, 255, .25); }
.nightp .big b { color: var(--sleep); }

/* ═════════════════════════════════════════════════════════════
   Boutons
   ═════════════════════════════════════════════════════════════ */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 0 14px; border-radius: 10px; font-weight: 600; font-size: 14px; color: #160A04; background: var(--acc); white-space: nowrap; transition: transform .1s, opacity .2s; }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .35; }
.btn.ghost { color: var(--tx); background: var(--bg-2); border: 1px solid var(--line-2); }
.btn.sleep { color: #0B0E24; background: var(--sleep); }
.btn.full { width: 100%; min-height: 48px; font-size: 15px; }
.btn.sm { min-height: 32px; padding: 0 11px; font-size: 13px; border-radius: 8px; }
.btn-row { display: flex; gap: 8px; margin-top: 12px; }
.btn-row > * { flex: 1; }
.cta { min-height: 48px; border-radius: 10px; font-family: var(--fu); font-weight: 600; font-size: 15px; letter-spacing: 0; text-transform: none; color: #160A04; background: var(--acc); box-shadow: none; }
.cta.ghost, .wide-btn.ghost { color: var(--tx); background: var(--bg-2); box-shadow: inset 0 0 0 1px var(--line-2); }
.cta.moon { color: #0B0E24; background: var(--sleep); box-shadow: none; }
.cta.sky, .cta.neon { color: #160A04; background: var(--acc); box-shadow: none; }
.cta.flesh, .cta.sun { color: #160A04; background: var(--acc); box-shadow: none; }
.wide-btn { font-family: var(--fu); text-transform: none; letter-spacing: 0; border-radius: 10px; color: #160A04; background: var(--acc); box-shadow: none; }
.chip { font-weight: 500; background: var(--bg-2); border: 1px solid var(--line); }
.chip.on { color: var(--acc-hi); background: var(--acc-tint); box-shadow: none; border-color: rgba(255, 106, 42, .4); }
.link { color: var(--acc); }
.tag.sun, .tag.ok { color: var(--ok); background: rgba(61, 220, 132, .12); }
.seg { display: flex; gap: 3px; padding: 3px; margin-top: 12px; border-radius: 10px; background: var(--bg-1); border: 1px solid var(--line); }
.seg button { flex: 1; min-height: 34px; border-radius: 7px; font-weight: 500; font-size: 13.5px; color: var(--mu); }
.seg button.on { color: var(--tx); background: var(--bg-3); }
.seg.small { padding: 0; background: none; border: none; gap: 6px; flex-wrap: wrap; }
.seg.small button { flex: 0 0 auto; min-height: 30px; padding: 0 12px; border-radius: 99px; background: var(--bg-2); }
.seg.small button.on { color: var(--acc-hi); background: var(--acc-tint); }

/* ═════════════════════════════════════════════════════════════
   Console (barre de saisie) et onglets
   ═════════════════════════════════════════════════════════════ */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 100; padding: 8px 12px calc(var(--safe-b) + 2px); background: linear-gradient(180deg, rgba(10, 11, 13, 0), rgba(10, 11, 13, .96) 22%); }
.dock-in { max-width: 560px; margin: 0 auto; }
.cbar { display: flex; align-items: center; gap: 10px; width: 100%; height: 46px; padding: 0 6px 0 14px; border-radius: 12px; text-align: left; background: var(--bg-2); border: 1px solid var(--line-2); box-shadow: 0 10px 30px rgba(0, 0, 0, .5); }
.cbar-p { font-family: var(--fm); font-weight: 600; font-size: 15px; color: var(--acc); }
.cbar-t { flex: 1; min-width: 0; font-size: 14.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cbar-k { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px; color: #160A04; background: var(--acc); }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 4px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0 6px; font-family: var(--fm); font-size: 10px; letter-spacing: .04em; color: var(--dim); }
.tab.on { color: var(--tx); }
.tab.on svg { color: var(--acc); }

.con-in { display: flex; gap: 8px; align-items: flex-end; }
.con-in textarea { flex: 1; min-height: 50px; max-height: 140px; font-size: 16px; line-height: 1.45; font-family: var(--fu); }
.con-help { margin: 10px 0 2px; font-family: var(--fm); font-size: 11px; line-height: 1.7; color: var(--dim); }
.con-help b { color: var(--mu); font-weight: 500; }
.cp { margin-top: 12px; border-radius: var(--r); border: 1px solid var(--line); overflow: hidden; }
.cp-row { display: grid; grid-template-columns: 30px 1fr auto 28px; align-items: center; gap: 8px; padding: 10px 6px 10px 12px; border-top: 1px solid var(--line); background: var(--bg-2); }
.cp-row:first-child { border-top: none; }
.cp-ic { color: var(--acc); display: grid; }
.cp-t { min-width: 0; font-weight: 500; font-size: 14px; }
.cp-t small { display: block; font-weight: 400; font-size: 12px; color: var(--dim); }
.cp-v { font-family: var(--fm); font-size: 12.5px; color: var(--mu); text-align: right; }
.cp-x { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; color: var(--dim); }
.cp-meal { padding: 6px 12px 10px; background: var(--bg-2); border-top: 1px solid var(--line); }
.cp-meal .items { margin: 0; }
.cp-tot { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 12px; background: var(--bg-1); border-top: 1px solid var(--line); font-family: var(--fm); font-size: 12px; color: var(--mu); }
.cp-tot b { font-size: 16px; color: var(--tx); font-weight: 600; }
.qrow { display: flex; gap: 8px; margin: 12px -18px 0; padding: 0 18px 2px; overflow-x: auto; scrollbar-width: none; }
.qrow .chip { flex: 0 0 auto; white-space: nowrap; font-size: 13px; }
.qrow .chip small { font-family: var(--fm); font-size: 11px; color: var(--dim); margin-left: 4px; }

/* ═════════════════════════════════════════════════════════════
   Carburant
   ═════════════════════════════════════════════════════════════ */
.daynav { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.daynav-t { flex: 1; text-align: center; font-family: var(--fm); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--mu); }
.dn-b { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 8px; color: var(--mu); background: var(--bg-1); border: 1px solid var(--line); }
.dn-b:disabled { opacity: .3; }
.macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin-top: 14px; border-radius: var(--r-s); overflow: hidden; background: var(--line); }
.mac { display: flex; flex-direction: column; gap: 3px; padding: 10px; background: var(--bg-2); }
.mac b { font-family: var(--fm); font-weight: 600; font-size: 17px; }
.mac b small { font-weight: 400; font-size: 11px; color: var(--mu); margin-left: 2px; }
.mac .bar { margin-top: 4px; }
.kv { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.kv:first-child { border-top: none; }
.kv > span:first-child { color: var(--mu); }
.kv b { font-family: var(--fm); font-weight: 500; font-size: 13.5px; text-align: right; }
.meals { border-radius: var(--r); border: 1px solid var(--line); overflow: hidden; }
.ml { border-top: 1px solid var(--line); background: var(--bg-1); }
.ml:first-child { border-top: none; }
.ml-h { display: grid; grid-template-columns: 46px 1fr auto; gap: 10px; align-items: start; width: 100%; padding: 12px; text-align: left; }
.ml-t { font-family: var(--fm); font-size: 12.5px; color: var(--mu); padding-top: 2px; }
.ml-n { font-weight: 600; font-size: 14.5px; }
.ml-i { margin-top: 2px; font-size: 12.5px; line-height: 1.4; color: var(--dim); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ml.open .ml-i { -webkit-line-clamp: unset; }
.ml-k { display: flex; flex-direction: column; align-items: flex-end; font-family: var(--fm); }
.ml-k b { font-weight: 600; font-size: 15px; }
.ml-k span { font-size: 11px; color: var(--dim); }
.ml-b { padding: 0 12px 12px; }
.ml-b .grid2 { margin-bottom: 4px; }
.sg { display: grid; grid-template-columns: minmax(0, 1fr) auto 36px; gap: 10px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); background: var(--bg-1); }
.sg:first-child { border-top: none; }
.sg-n { min-width: 0; font-weight: 500; font-size: 14px; }
.sg-n small { display: block; font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sg-v { font-family: var(--fm); font-size: 12px; color: var(--mu); text-align: right; white-space: nowrap; }
.sg-v b { display: block; font-size: 14px; color: var(--tx); font-weight: 600; }
.sg-p { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px; color: #160A04; background: var(--acc); }
.box { border-radius: var(--r); border: 1px solid var(--line); overflow: hidden; }
.empty-l { padding: 22px 14px; text-align: center; font-size: 13.5px; color: var(--dim); background: var(--bg-1); }

/* ═════════════════════════════════════════════════════════════
   Sport
   ═════════════════════════════════════════════════════════════ */
.facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; margin-top: 12px; border-radius: var(--r-s); overflow: hidden; background: var(--line); }
.fact { padding: 9px 8px; background: var(--bg-2); }
.fact b { display: block; margin-top: 3px; font-family: var(--fm); font-weight: 600; font-size: 15px; }
.fact b small { font-weight: 400; font-size: 10.5px; color: var(--dim); }
.ses { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.ses button { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px; border-radius: var(--r-s); text-align: left; background: var(--bg-1); border: 1px solid var(--line); overflow: hidden; }
.ses button.on { border-color: var(--acc); background: var(--acc-tint); }
.ses-l { font-family: var(--fm); font-weight: 600; font-size: 20px; }
.ses button.on .ses-l { color: var(--acc); }
.ses-s { font-size: 11.5px; color: var(--dim); white-space: nowrap; }
.ses-s.ok { color: var(--ok); }
.ses-cd { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--sleep); }
.ex-t { border-radius: var(--r); border: 1px solid var(--line); overflow: hidden; }
.ex { border-top: 1px solid var(--line); background: var(--bg-1); }
.ex:first-child { border-top: none; }
.ex-h { display: grid; grid-template-columns: 1fr auto 18px; gap: 10px; align-items: center; width: 100%; padding: 11px 12px; text-align: left; }
.ex-n { font-weight: 600; font-size: 14px; line-height: 1.3; }
.ex-s { margin-top: 2px; font-family: var(--fm); font-size: 11px; color: var(--dim); }
.ex-s .up { color: var(--ok); }
.ex-p { margin-top: 3px; font-family: var(--fm); font-size: 11.5px; color: var(--sleep); }
.ex-p em { font-style: normal; color: var(--tx); font-weight: 600; }
.ex-l { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.ex-l b { font-family: var(--fm); font-weight: 600; font-size: 16px; }
.ex-l span { font-family: var(--fm); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
.ex.up .ex-l b, .ex.up .ex-l span { color: var(--ok); }
.ex-b { padding: 0 12px 12px; }
.ex-b .hist-row { font-family: var(--fm); font-size: 12px; }
.mob { border-radius: var(--r); border: 1px solid var(--line); overflow: hidden; }
.mob-r { padding: 12px; border-top: 1px solid var(--line); background: var(--bg-1); }
.mob-r:first-child { border-top: none; }
.mob-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.mob-n { font-weight: 600; font-size: 14px; }
.mob-d { font-family: var(--fm); font-size: 10.5px; color: var(--dim); }
.mob-how { margin-top: 2px; font-size: 12.5px; color: var(--mu); }
.mob-lv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
.mob-lv button { min-height: 34px; padding: 4px 6px; border-radius: 7px; font-size: 12px; line-height: 1.2; color: var(--mu); background: var(--bg-2); border: 1px solid var(--line); }
.mob-lv button.on.l0 { color: #FFD0D0; border-color: rgba(255, 79, 79, .5); background: rgba(255, 79, 79, .1); }
.mob-lv button.on.l1 { color: #FFE3B0; border-color: rgba(255, 176, 32, .5); background: rgba(255, 176, 32, .1); }
.mob-lv button.on.l2 { color: #C9F7DD; border-color: rgba(61, 220, 132, .5); background: rgba(61, 220, 132, .1); }
.mob-hist { display: flex; gap: 3px; margin-top: 8px; }
.mob-hist i { width: 12px; height: 6px; border-radius: 1px; background: var(--bg-3); }
.mob-hist i.l0 { background: var(--crit); } .mob-hist i.l1 { background: var(--warn); } .mob-hist i.l2 { background: var(--ok); }
.diff { margin-top: 12px; padding: 14px; border-radius: var(--r); background: var(--bg-1); border: 1px solid rgba(255, 176, 32, .35); box-shadow: none; }
.panel { padding: 14px; border-radius: var(--r); background: var(--bg-1); border: 1px solid var(--line); }
.panel-t { font-weight: 600; font-size: 15px; margin-bottom: 6px; }
.pz-hero { background: var(--bg-1); border: 1px solid var(--line); border-radius: var(--r); }
.pz-t { font-weight: 600; font-size: 17px; }
.pz-pic { background: rgba(61, 220, 132, .06); }

/* ═════════════════════════════════════════════════════════════
   Analyse
   ═════════════════════════════════════════════════════════════ */
.en-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; margin-top: 12px; border-radius: var(--r-s); overflow: hidden; background: var(--line); }
.en-grid > div { padding: 10px; background: var(--bg-2); }
.en-grid b { display: block; margin-top: 3px; font-family: var(--fm); font-weight: 600; font-size: 17px; }
.en-grid b small { font-weight: 400; font-size: 11px; color: var(--dim); }
.en-res { margin-top: 12px; padding: 12px; border-radius: var(--r-s); background: var(--acc-tint); border: 1px solid rgba(255, 106, 42, .3); }
.en-res .big b { color: var(--acc-hi); }
.en-need { display: grid; gap: 6px; margin-top: 10px; }
.en-need div { display: flex; justify-content: space-between; font-family: var(--fm); font-size: 12px; color: var(--mu); }
.en-need b { color: var(--tx); font-weight: 500; }
.formula { margin-top: 10px; padding: 10px 12px; border-radius: var(--r-s); font-family: var(--fm); font-size: 11.5px; line-height: 1.7; color: var(--mu); background: var(--bg); border: 1px dashed var(--line-2); }
.formula b { color: var(--tx); font-weight: 500; }
.heat { display: grid; grid-template-columns: 70px 1fr; gap: 4px 8px; align-items: center; }
.heat-r { font-family: var(--fm); font-size: 10.5px; color: var(--mu); }
.heat-c { display: grid; grid-template-columns: repeat(35, 1fr); gap: 2px; }
.heat-c i { aspect-ratio: 1 / 1.6; border-radius: 1.5px; background: var(--bg-2); }
.heat-c i.l1 { background: rgba(255, 79, 79, .5); } .heat-c i.l2 { background: rgba(255, 176, 32, .6); } .heat-c i.l3 { background: rgba(61, 220, 132, .75); }
.heat-c i.fut { background: transparent; }
.heat-x { grid-column: 2; display: flex; justify-content: space-between; font-family: var(--fm); font-size: 10px; color: var(--dim); }
.legend { display: flex; gap: 12px; margin-top: 8px; font-family: var(--fm); font-size: 10.5px; color: var(--dim); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; border-radius: 2px; }
.fd { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; padding: 11px 12px; border-top: 1px solid var(--line); background: var(--bg-1); }
.fd:first-child { border-top: none; }
.fd-v { font-family: var(--fm); font-weight: 600; font-size: 15px; color: var(--acc); }
.fd-v small { display: block; font-weight: 400; font-size: 10px; color: var(--dim); }
.fd-t { font-weight: 600; font-size: 13.5px; }
.fd-s { margin-top: 2px; font-size: 12.5px; line-height: 1.4; color: var(--mu); }
.tbl { width: 100%; border-collapse: collapse; font-family: var(--fm); font-size: 12px; }
.tbl th { padding: 6px 4px; text-align: right; font-weight: 500; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl td { padding: 8px 4px; text-align: right; border-top: 1px solid var(--line); }
.tbl td:first-child { color: var(--mu); font-family: var(--fu); font-size: 13px; }
.w-in { display: flex; gap: 8px; margin-top: 12px; }
.w-in .gram { flex: 1; }

/* ── Fiches ── */
.sheet { background: var(--bg-1); border-top: 1px solid var(--line-2); }
.sheet-title { font-weight: 600; font-size: 17px; }
.sub-h { font-family: var(--fm); font-weight: 500; font-size: 10.5px; letter-spacing: .1em; color: var(--mu); }
.inp, .gram { background: var(--bg); border-color: var(--line-2); }
.inp:focus { border-color: var(--acc); }
.toggle.on .sw { background: var(--acc); }
.msg.user { background: var(--acc-tint); }
.send { background: var(--acc); color: #160A04; }
.toast { font-size: 14px; background: var(--bg-3); bottom: calc(118px + var(--safe-b)); }
.toast.top { bottom: auto; }
.update-bar { box-shadow: 0 0 0 1px rgba(255, 106, 42, .5), 0 10px 34px rgba(0, 0, 0, .6); }
.update-bar button { background: var(--acc); color: #160A04; }
.plan-chip { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; align-self: flex-start; max-width: 88%; padding: 9px 12px; border-radius: var(--r-s); font-size: 13px; background: var(--acc-tint); }
.plan-chip > span { display: inline-flex; align-items: center; gap: 6px; }
.energy button.on { color: #0B0E24; background: var(--sleep); box-shadow: none; }
.energy-l { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; color: var(--dim); }
.gu-empty { border: 1px solid var(--line); }

@media (prefers-reduced-motion: reduce) {
  .main, .bar-f, .chk.on .chk-b, .dot.crit { animation: none !important; }
}
</style>
