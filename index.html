 c'est un item",lol:"Tes muscles ont une barre de mana. La cr\xE9atine, c'est l'item qui monte ta mana max.",lines:["Chaque s\xE9rie lourde, c'est un sort : \xE7a co\xFBte de la mana.","Quand la barre est vide, tu ne peux plus caster : la rep ne monte plus.","Avec la cr\xE9atine, la barre est plus grande. Tu castes une ou deux reps de plus avant d'\xEAtre \xE0 sec.","Ces reps en plus, s\xE9ance apr\xE8s s\xE9ance, c'est \xE7a qui te fait progresser."],stacks:"Ce n'est pas un effet magique imm\xE9diat : il faut stacker. 3 \xE0 5 g chaque jour, et le r\xE9servoir se remplit en 3 \xE0 4 semaines. Si tu arr\xEAtes, tu perds tes stacks petit \xE0 petit : 4 \xE0 6 semaines pour revenir \xE0 z\xE9ro.",real:"La cr\xE9atine augmente la phosphocr\xE9atine stock\xE9e dans tes muscles, d'environ 20 \xE0 40 %. C'est le carburant des efforts courts et \xE0 fond, les 10 premi\xE8res secondes. Les premi\xE8res semaines, tu prends souvent un peu d'eau dans le muscle : c'est normal, ce n'est pas du gras.",you:()=>"N'importe quelle cr\xE9atine monohydrate fait le job, pas besoin d'une marque ch\xE8re. L'heure ne compte pas, le tous les jours si. Si \xE7a te barbouille, prends-la avec un repas ou en deux fois."},{id:"calories",ic:"coin",n:"Les calories, c'est ton gold",lol:"Tu ne gagnes pas une game sans farmer. Ton corps non plus.",lines:["Chaque repas, c'est une vague de sbires : tu la farmes, ou tu la laisses mourir sous ta tour.","Le gold sert \xE0 acheter des items. Ici, l'item, c'est du muscle et des kilos.","Pas de surplus de gold, pas d'achat : tu stagnes."],real:"Pour prendre du poids, il faut manger plus que ce que tu d\xE9penses. Un surplus de 300 \xE0 500 kcal par jour donne en gros 0,25 \xE0 0,5 kg de plus par semaine. Un hardgainer d\xE9pense beaucoup : c'est un champion qui a besoin de beaucoup de farm.",you:e=>`Ton objectif : ${Math.round(e.kcal).toLocaleString("fr-FR")} kcal. Si ton rang ne bouge pas pendant 2 semaines, ajoute 200 \xE0 300 kcal par jour, un shaker suffit.`},{id:"proteines",ic:"bolt",n:"Les prot\xE9ines, ce sont les composants",lol:"Le gold ach\xE8te l'item, mais sans les composants, l'item ne se construit pas.",lines:["Les calories donnent l'\xE9nergie pour construire. Les prot\xE9ines, c'est la mati\xE8re.","Sans elles, tu farmes du gold mais tu construis plus de gras que de muscle."],real:"Vise 1,6 \xE0 2 g de prot\xE9ines par kilo de poids et par jour. Au-del\xE0 de 2,2 g/kg, \xE7a n'apporte presque rien de plus. R\xE9partis-les sur la journ\xE9e : 20 \xE0 40 g par repas.",you:e=>`Ton objectif : ${e.prot} g par jour. Un shaker whey et lait en apporte une trentaine.`},{id:"sommeil",ic:"heart",n:"Le sommeil, c'est le recall",lol:"Tu ne r\xE9g\xE9n\xE8res pas tes PV en restant en lane. Tu recall.",lines:["La s\xE9ance casse le muscle. C'est pendant que tu dors qu'il se r\xE9pare et grossit.","Une nuit courte, c'est jouer low HP : moins de force, plus envie de sucre, moins de motivation."],real:"La plus grosse partie de l'hormone de croissance est lib\xE9r\xE9e pendant le sommeil profond, en d\xE9but de nuit. Vise 7 h 30 \xE0 9 h. Te coucher \xE0 heure fixe compte presque autant que la dur\xE9e.",you:e=>`Ton objectif : ${String(e.sleep).replace(".",",")} h. Le bouton \xAB Je pose le t\xE9l\xE9phone \xBB lance ton recall.`},{id:"surcharge",ic:"sword",n:"+1 rep, c'est ton scaling",lol:"Un champion qui ne monte pas de niveau se fait rouler dessus en late game.",lines:["M\xEAme charge, m\xEAmes reps pendant des mois : ton corps n'a aucune raison de changer.","+1 rep ou +2,5 kg d\xE8s que tu peux. Chaque petite marche, c'est un niveau."],real:"La r\xE8gle de ton programme : quand tu atteins le haut de la fourchette sur toutes les s\xE9ries, tu montes la charge. En attendant, tu cherches une rep de plus. Arr\xEAte chaque s\xE9rie \xE0 1 ou 2 reps de l'\xE9chec.",you:()=>"Dans l'Ar\xE8ne, chaque exercice t'affiche ton objectif +1 rep calcul\xE9 sur ta derni\xE8re s\xE9ance."},{id:"recup",ic:"hourglass",n:"Le repos, c'est le cooldown",lol:"Tu ne peux pas relancer ton ultime en boucle.",lines:["Un muscle travaill\xE9 a besoin d'environ 48 h pour r\xE9cup\xE9rer.","En full body 3 fois par semaine, ton sort recharge pile entre deux s\xE9ances.","Relancer trop t\xF4t : moins de d\xE9g\xE2ts, plus de risque de blessure."],real:"Un jour de repos entre deux s\xE9ances, c'est le bon rythme pour ton programme. Par exemple lundi, mercredi, vendredi."},{id:"regularite",ic:"flag",n:"Le farm bat les gros plays",lol:"Les meilleurs joueurs ne gagnent pas avec un pentakill par game. Ils gagnent en ne ratant aucun sbire.",lines:["3 200 kcal tous les jours valent mieux que 5 000 un jour puis 2 000 les trois suivants.","Le boss de la semaine compte tout : un jour rat\xE9 se rattrape un peu, jamais compl\xE8tement."],real:"Ton poids r\xE9agit \xE0 ta moyenne sur la semaine, pas \xE0 un repas \xE9norme."},{id:"pesee",ic:"crown",n:"La pes\xE9e, ce sont tes LP",lol:"Une d\xE9faite ne te fait pas descendre de division d'un coup. Un mauvais chiffre sur la balance non plus.",lines:["Ton poids bouge d'un kilo d'un jour \xE0 l'autre : eau, sel, repas de la veille.","C'est pour \xE7a que ton rang suit la moyenne de tes 3 derni\xE8res pes\xE9es."],real:"P\xE8se-toi toujours dans les m\xEAmes conditions : m\xEAme balance, m\xEAme moment de la journ\xE9e, avant de manger ou avant la s\xE9ance. Ce qui compte, c'est la tendance sur plusieurs semaines."},{id:"tilt",ic:"recall",n:"Le tilt",lol:"Une mauvaise teamfight ne perd pas la game. Le tilt qui suit, si.",lines:["Tu as rat\xE9 un repas ou une s\xE9ance ? Ce n'est pas grave.","Ce qui fait perdre, c'est de tout l\xE2cher apr\xE8s. Reprends au prochain camp."],real:"Une journ\xE9e rat\xE9e ne change rien \xE0 ton corps. Une semaine l\xE2ch\xE9e, oui."},{id:"lumiere",ic:"sun",n:"La lumi\xE8re du matin, c'est ta vision",lol:"Sans ward, tu joues dans le noir. Sans lumi\xE8re le matin, ton horloge aussi.",lines:["10 minutes dehors apr\xE8s le r\xE9veil disent \xE0 ton cerveau que la journ\xE9e commence.","Le soir, la fatigue arrive plus t\xF4t : c'est comme \xE7a qu'on avance son coucher sans forcer."],real:"La lumi\xE8re du jour est le signal le plus fort pour r\xE9gler l'horloge interne. M\xEAme par temps couvert, elle est bien plus forte que la lumi\xE8re d'une pi\xE8ce."},{id:"eau",ic:"potion",n:"L'eau, ce sont tes potions",lol:"Sans potions, tu ne tiens pas la lane.",lines:["La cr\xE9atine fait entrer de l'eau dans tes muscles : il faut boire assez.","D\xE9shydrat\xE9, tu perds de la force avant m\xEAme de le sentir."],real:"2 \xE0 3 litres par jour, plus quand il fait chaud ou que tu transpires. Urine jaune clair : tu es bien hydrat\xE9."}],ip=["La cr\xE9atine, c'est un item \xE0 stacks : un jour rat\xE9 ne vide pas tout, mais chaque jour compte.","Un shaker whey et lait, c'est une trentaine de grammes de prot\xE9ines en 30 secondes.","Ton rang suit la moyenne de tes 3 derni\xE8res pes\xE9es : une mauvaise pes\xE9e ne te fait pas plonger.","Le boss de la semaine perd 1 PV par kcal. Un repas de 900 kcal, c'est un gros coup.","Le Flash sauve ta s\xE9rie une fois par semaine. Pas deux.","Trois heures sans manger : le camp est r\xE9apparu, va farm.","Vise le +1 rep, pas le record. C'est comme \xE7a que tu scales.","Une nuit sous 6 h, c'est jouer low HP toute la journ\xE9e.","10 minutes dehors le matin avancent ton heure de coucher.","Pas faim ? Les calories liquides passent mieux : lait entier, shaker, smoothie.","Un repas L\xE9gendaire : 900 kcal et 40 g de prot\xE9ines dans la m\xEAme assiette.","Chaque nouvel aliment rejoint ton Alimentdex. Varier, c'est aussi mieux farmer.","La journ\xE9e se gagne \xE0 90 % de ton objectif de calories.","Pentakill : calories, prot\xE9ines, sommeil, cr\xE9atine et s\xE9ance (ou posture) le m\xEAme jour.","Un bon early game : premier repas dans les 2 h apr\xE8s le r\xE9veil.","Tu as rat\xE9 un repas ? Ne tilte pas. Reprends au prochain camp.","Le sommeil, c'est le recall : c'est l\xE0 que le muscle se construit.","L'heure de la cr\xE9atine ne compte pas. Le tous les jours, si.","Ta mana de s\xE9ance d\xE9pend de ta nuit et de ton farm d'hier.","Toujours la m\xEAme balance, au m\xEAme moment : sinon tes LP mentent."],b2={v:"8.0",n:"Le Reforge",date:"novembre 2026",intro:"Ton tracker devient une partie de League. Ta vraie vie, c'est la game : chaque repas se farme, chaque nuit est un recall, chaque pes\xE9e te fait gagner des LP. Tout est calcul\xE9 \xE0 partir de tes donn\xE9es : rien n'a \xE9t\xE9 perdu, ton historique a \xE9t\xE9 rejou\xE9.",sections:[{t:"La mana et les stacks (la vid\xE9o)",items:[["NOUVEAU","Barre de mana : l'\xE9nergie de tes muscles pour la s\xE9ance, remplie par ta nuit et ton farm."],["NOUVEAU","La cr\xE9atine monte ta mana max : jusqu'\xE0 +20 \xE0 28 stacks."],["NOUVEAU","Grille de 28 stacks. Un jour rat\xE9 = un stack perdu, comme dans tes muscles."],["NOUVEAU","Tous tes rituels deviennent des items \xE0 stacks, avec leur fiche fa\xE7on boutique."],["NOUVEAU","Objectif +1 rep sur chaque exercice, calcul\xE9 sur ta derni\xE8re s\xE9ance."],["NOUVEAU","Conseil de s\xE9ance selon ta mana : full mana, mana correcte ou low mana."],["NOUVEAU","Codex : la cr\xE9atine, les calories, le sommeil, les prot\xE9ines\u2026 expliqu\xE9s en LoL."]]},{t:"Farm",items:[["REFONTE","Les calories deviennent ton gold : le farm du jour, avec ta courbe et le rythme id\xE9al."],["NOUVEAU","Gold diff : ton avance ou ton retard sur le rythme, en direct."],["NOUVEAU","Phases de jeu : early, mid et late game, avec ce qu'il faut avoir farm\xE9 \xE0 la fin de chacune."],["NOUVEAU","Camp r\xE9apparu : \xE7a fait 3 h que tu n'as pas mang\xE9."],["NOUVEAU","CS du jour : le nombre de repas not\xE9s."],["NOUVEAU","Raret\xE9 des repas : Commun, Rare, \xC9pique, L\xE9gendaire."],["NOUVEAU","Build recommand\xE9 : les repas qui comblent pile ce qu'il te manque."],["NOUVEAU","Alimentdex : chaque nouvel aliment se d\xE9couvre, pour t'aider \xE0 varier."],["NOUVEAU","Vari\xE9t\xE9 de la semaine : le nombre d'aliments diff\xE9rents."],["BUFF","\xAB +X gold \xBB et un petit son \xE0 chaque repas ajout\xE9."]]},{t:"La partie du jour",items:[["NOUVEAU","5 objectifs = 5 kills : First blood, Double kill\u2026 jusqu'au Pentakill."],["NOUVEAU","Note de la journ\xE9e, de D \xE0 S+."],["NOUVEAU","Victoire \xE0 90 % de tes calories, et ton winrate sur 30 jours."],["NOUVEAU","\xC9cran de fin de partie quand tu poses le t\xE9l\xE9phone : victoire ou d\xE9faite."],["NOUVEAU","R\xE9cap de mort : ce qui t'a fait perdre la journ\xE9e, sans filtre."],["NOUVEAU","Historique des parties : chaque jour, sa note et ses kills."],["NOUVEAU","S\xE9rie de victoires et Flash : une journ\xE9e rat\xE9e par semaine est sauv\xE9e."],["NOUVEAU","Score de vision : ce qui est not\xE9 dans ta journ\xE9e."],["NOUVEAU","Qu\xEAtes du jour : 3 d\xE9fis par jour, tir\xE9s selon ta journ\xE9e."],["NOUVEAU","\xC9cran de chargement : ton match du jour et une astuce, une fois par jour."]]},{t:"Progression",items:[["NOUVEAU","Niveau de la partie, de 1 \xE0 18, qui monte avec tes objectifs."],["NOUVEAU","Niveau de compte : toute ton XP depuis ton premier jour."],["NOUVEAU","Class\xE9 : ton poids devient ton rang, de Fer IV \xE0 Challenger, ton poids vis\xE9."],["NOUVEAU","LP \xE0 chaque pes\xE9e, calcul\xE9s sur la moyenne de tes 3 derni\xE8res pes\xE9es."],["NOUVEAU","Date de ta prochaine promotion, \xE0 ton rythme actuel."],["NOUVEAU","Boss de la semaine : chaque kcal lui retire 1 PV."],["NOUVEAU","34 succ\xE8s, rejou\xE9s sur tout ton historique, avec leur date."],["NOUVEAU","Titres \xE0 d\xE9bloquer sous ton pseudo."],["NOUVEAU","Stats de carri\xE8re : gold farm\xE9, nuits, s\xE9ances, kilos, pentakills."]]},{t:"Ar\xE8ne",items:[["REFONTE","Tes s\xE9ances A, B et C deviennent tes sorts Q, W et E, avec leur temps de recharge."],["NOUVEAU","L'ultime : tes records perso, d\xE9tect\xE9s tout seuls \xE0 l'import Hevy."],["NOUVEAU","Triple kill de la semaine : 3 s\xE9ances."],["BUFF","La routine posture compte comme un kill les jours sans s\xE9ance."]]},{t:"Visuel et confort",items:[["REFONTE","Nouveau th\xE8me Hextech : fond abysse, cadres dor\xE9s, mana bleue."],["NOUVEAU","HUD de champion : portrait, niveau, PV et mana."],["NOUVEAU","Embl\xE8mes de rang dessin\xE9s pour chaque palier."],["NOUVEAU","Annonces plein \xE9cran : kills, boss vaincu, promotion, niveau."],["NOUVEAU","Le mode nuit devient ton recall : tes PV se r\xE9g\xE9n\xE8rent pendant que tu dors."],["NOUVEAU","Pings de couleur sur la prochaine action."],["NOUVEAU","6 skins \xE0 d\xE9bloquer, dont N\xE9on v7, le look de ta version d'avant."],["NOUVEAU","Bruitages de jeu et annonceur vocal, \xE0 couper dans les runes."],["NOUVEAU","Forge : cr\xE9e tes propres items \xE0 stacks (anglais, lecture\u2026)."],["BUFF","Le coach conna\xEEt ta partie (rang, boss, stacks) et explique avec des analogies LoL."],["REFONTE","Les r\xE9glages deviennent ta page de runes, avec ton pseudo."],["AJUSTEMENT","Toutes tes donn\xE9es sont gard\xE9es : rien \xE0 ressaisir."]]}]},Ue={v:"9.0",n:"Le Client",date:"novembre 2026",intro:"M\xEAme partie, nouvelle interface. L'appli s'inspire d'un client de jeu comp\xE9titif : fond nuit, moins de cadres, plus d'espace, l'or r\xE9serv\xE9 \xE0 ce qui compte. Tes donn\xE9es, tes objectifs et les r\xE8gles de progression n'ont pas boug\xE9. Quelques m\xE9caniques ont \xE9t\xE9 corrig\xE9es : elles affichaient parfois l'inverse de ce qu'elles faisaient.",sections:[{t:"Le client",items:[["REFONTE","Un seul syst\xE8me visuel partout : fond nuit, surfaces plates, s\xE9parations fines. L'or pour l'essentiel, le bleu pour la mana et les actions."],["REFONTE","Fini les affiches peintes, les parchemins, la fum\xE9e et les particules. Les ic\xF4nes peintes des items restent."],["NOUVEAU","Un en-t\xEAte commun \xE0 chaque onglet : ton m\xE9daillon avec ton niveau de compte (le m\xEAme partout), le coach et les runes."],["REFONTE","Barre du bas plus discr\xE8te, bouton + plus petit. Les jauges se remplissent \xE0 l'ouverture de chaque onglet."],["AJUSTEMENT","Skins : seul l'accent change (N\xE9on, Infernal, Abysse, Prestige, Challenger). L'interface reste la m\xEAme et reste lisible."]]},{t:"Base",items:[["REFONTE","Le centre de contr\xF4le : ton gold du jour en haut, puis tes 5 objectifs en lignes, avec la condition et ta valeur pour chacun."],["NOUVEAU","Raret\xE9 des items selon tes stacks : Commun, Rare \xE0 7, \xC9pique \xE0 14, L\xE9gendaire \xE0 21. Le cadre de l'item prend sa couleur."],["REFONTE","Ta semaine : une case par jour avec ta note. Liser\xE9 vert pour une victoire, rouge pour une d\xE9faite."]]},{t:"Farm",items:[["REFONTE","Le journal passe avant les suggestions. Une couleur par moment : matin, midi, apr\xE8s-midi, soir, nuit."],["NOUVEAU","Prot\xE9ines, glucides et lipides affich\xE9s sur la ligne de chaque repas."],["BUFF","Les totaux tombent juste : chaque aliment est arrondi une seule fois, et le repas comme la journ\xE9e font la somme exacte de ce que tu lis."]]},{t:"Ar\xE8ne",items:[["REFONTE","S\xE9lection de s\xE9ance fa\xE7on champion select : A, B, C et tes records. Le temps de recharge s'affiche sur la prochaine s\xE9ance."],["REFONTE","Chaque exercice montre sa charge en grand \xE0 droite, avec la consigne : on monte, on garde, ou d\xE9part."]]},{t:"Corrections",items:[["AJUSTEMENT","Mana : \xAB Mana pleine \xBB seulement \xE0 partir de 97 %. Avant, 92 sur 103 s'affichait pleine. Haute d\xE8s 80 %, correcte d\xE8s 60 %, basse en dessous."],["AJUSTEMENT","\xAB Journ\xE9e boucl\xE9e \xBB seulement quand les 5 objectifs et les 3 qu\xEAtes sont faits. Avant, elle pouvait s'afficher avec une qu\xEAte sur trois."],["AJUSTEMENT","Boss : sa fiche explique ses PV (7 fois ton objectif du jour), et le dernier jour te dit exactement ce qu'il reste \xE0 manger pour le vaincre."],["AJUSTEMENT","Import Hevy : un exercice fait en plus ne d\xE9clenche plus l'alerte \xAB ta s\xE9ance a chang\xE9 \xBB. Elle revient si un exercice du programme manque, ou si le nouvel exercice revient dans 2 de tes 3 derni\xE8res s\xE9ances."]]}],prev:b2},lg=(e=Ue)=>e.sections.reduce((t,n)=>t+n.items.length,0);var Is=null,ug=()=>xe().sfx!==!1;function cg(){try{Is||(Is=new(window.AudioContext||window.webkitAudioContext)),Is.state==="suspended"&&Is.resume()}catch{Is=null}return Is}if(typeof document<"u"){let e=()=>{ug()&&cg(),document.removeEventListener("touchend",e),document.removeEventListener("click",e)};document.addEventListener("touchend",e,{passive:!0}),document.addEventListener("click",e)}function qe(e,t,n,{type:s="sine",vol:r=.1,to:a=null,attack:o=.01}={}){let l=Is;if(!l)return;let i=l.currentTime+t,u=l.createOscillator(),p=l.createGain();u.type=s,u.frequency.setValueAtTime(e,i),a&&u.frequency.exponentialRampToValueAtTime(a,i+n),p.gain.setValueAtTime(1e-4,i),p.gain.exponentialRampToValueAtTime(r,i+o),p.gain.exponentialRampToValueAtTime(1e-4,i+n),u.connect(p).connect(l.destination),u.start(i),u.stop(i+n+.05)}function ig(e,t,n=.08){let s=Is;if(!s)return;let r=s.currentTime+e,a=s.createBuffer(1,Math.floor(s.sampleRate*t),s.sampleRate),o=a.getChannelData(0);for(let p=0;p<o.length;p++)o[p]=(Math.random()*2-1)*(1-p/o.length);let l=s.createBufferSource(),i=s.createGain(),u=s.createBiquadFilter();u.type="lowpass",u.frequency.value=900,l.buffer=a,i.gain.value=n,l.connect(u).connect(i).connect(s.destination),l.start(r)}var On=e=>{if(ug()&&cg())try{e()}catch{}},nt={gold:()=>On(()=>{qe(1318,0,.12,{type:"triangle",vol:.09}),qe(1760,.07,.22,{type:"triangle",vol:.08})}),tick:()=>On(()=>qe(880,0,.08,{type:"triangle",vol:.05})),item:()=>On(()=>{qe(523,0,.12,{type:"triangle",vol:.07}),qe(784,.06,.18,{type:"triangle",vol:.07})}),kill:(e=1)=>On(()=>{ig(0,.25,.09),qe(110,0,.35,{type:"sawtooth",vol:.05,to:70});let t=[392,440,494,523,587][Math.min(4,e-1)];[1,1.25,1.5].forEach((n,s)=>qe(t*n,.08+s*.07,.5+(e===5?.6:0),{type:"triangle",vol:.06})),e===5&&[2,2.5,3].forEach((n,s)=>qe(t*n,.45+s*.09,.8,{type:"sine",vol:.05})
