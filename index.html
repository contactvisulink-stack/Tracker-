<style>/* ─────────────────────────────────────────────────────────────
   Isma Daily · formulaires, listes et fiches (les couleurs suivent l'ambiance de l'onglet).
   Les affiches, l'accueil, la barre du bas et les grands moments sont dans poster.css.
   Ancien en-tête du patch 8 « Le Reforge » :
   Thème Hextech : fond abysse, cadres dorés, mana bleue, cyan hextech.
   Cinzel : les noms du jeu (rangs, boss, annonces, résultats).
   Barlow Semi Condensed : chiffres, titres de section, boutons.
   Barlow : le texte courant.
   ───────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--abyss); color: var(--tx); font-family: var(--fb); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; overflow-x: hidden; }
body { min-height: 100vh; min-height: 100dvh; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:disabled { cursor: default; }
input, textarea, select { color-scheme: dark; }
:focus-visible { outline: 2px solid var(--hex-2); outline-offset: 2px; border-radius: 3px; }
::-webkit-scrollbar { width: 0; height: 0; }
b, strong { font-weight: 600; }
h1, h2, h3, h4 { font-weight: inherit; font-size: inherit; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ── Boutons ── */
.cta { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; padding: 12px 18px; border-radius: 3px; font-family: var(--fx); font-weight: 700; font-size: 16px; letter-spacing: .3px; color: var(--gold-1); transition: transform .12s ease, opacity .2s; }
.cta:active { transform: scale(.97); }
.cta:disabled { opacity: .4; }
.cta.ghost { background: color-mix(in srgb, var(--abyss) 75%, transparent); border: 1px solid var(--line-2); font-weight: 600; }
.cta.moon { background: linear-gradient(180deg, #1A3478, #0A1740) padding-box, linear-gradient(180deg, var(--gold-1), var(--gold-4)) border-box; border: 1.5px solid transparent; color: #E6EEFF; }
.cta.sky { background: linear-gradient(180deg, var(--ink-3), var(--navy)) padding-box, linear-gradient(180deg, var(--gold-1), var(--gold-4)) border-box; border: 1.5px solid transparent; color: var(--hex-1); }
.cta.flesh { background: linear-gradient(180deg, #5A2A0E, #2A1205) padding-box, linear-gradient(180deg, var(--gold-1), var(--gold-4)) border-box; border: 1.5px solid transparent; color: #FFE3CF; }
.cta.neon { color: var(--hex-1); }
.cta.full { width: 100%; }
.cta.shrink { width: auto; flex: 0 0 auto; }
.cta-row { display: flex; gap: 10px; }
.cta-row > * { flex: 1; }
.big-inp { font-family: var(--fx); font-weight: 700; font-size: 21px !important; text-align: center; }
.pill-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 14px; border-radius: 3px; font-family: var(--fx); font-weight: 600; font-size: 14px; color: var(--gold-1); background: color-mix(in srgb, var(--abyss) 75%, transparent); border: 1px solid var(--line-2); transition: transform .12s; }
.pill-btn:active { transform: scale(.95); }
.pill-btn.ghost { color: var(--mu); border-color: var(--line); }
.wide-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; margin-bottom: 10px; border-radius: 3px; font-family: var(--fx); font-weight: 700; font-size: 16px; color: var(--gold-1);
  background: linear-gradient(180deg, var(--ink-3), var(--navy)) padding-box, linear-gradient(180deg, var(--gold-1), var(--gold-2) 40%, var(--gold-4)) border-box; border: 1.5px solid transparent; }
.wide-btn.ghost { background: color-mix(in srgb, var(--abyss) 75%, transparent); border: 1px solid var(--line-2); font-weight: 600; }
.link { color: var(--hex-2); font-size: 14px; font-weight: 600; padding: 2px 0; }
.link.small { font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 12px; border-radius: 3px; background: color-mix(in srgb, var(--abyss) 75%, transparent); border: 1px solid var(--line); font-size: 13.5px; font-weight: 500; text-decoration: none; transition: transform .12s; }
.chip:active { transform: scale(.95); }
.chip.on { background: color-mix(in srgb, var(--hex-2) 14%, transparent); border-color: color-mix(in srgb, var(--hex-2) 50%, transparent); color: var(--hex-1); }
.chip.danger { color: #FF8A9A; }
.chip:disabled { opacity: .45; }
.tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 2px; margin-left: 7px; vertical-align: 1px; background: color-mix(in srgb, var(--gold-1) 8%, transparent); color: var(--mu); }
.tag.ok { background: rgba(61, 214, 140, .14); color: var(--hp); }
.tag.ia { background: rgba(185, 124, 255, .16); color: #D7BEFF; }
.tag.new { background: rgba(240, 184, 74, .16); color: #F0C878; }
.tag.warn { background: rgba(232, 64, 87, .16); color: #FF8A9A; }
.tag.sun { background: color-mix(in srgb, var(--hex-2) 16%, transparent); color: var(--hex-1); }

/* ── Textes et utilitaires ── */
.block { margin-top: 4px; }
.block-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.block-head h3, .panel-t { font-family: var(--fx); font-weight: 600; font-size: 17px; color: var(--gold-1); }
.panel-t { margin-bottom: 10px; }
.count { font-family: var(--fx); font-weight: 700; color: var(--mu); font-size: 14px; }
.panel.glow-sky { border-color: color-mix(in srgb, var(--hex-2) 50%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--hex-2) 7%, transparent), 0 12px 28px -16px rgba(0, 0, 0, .95); }
.hint { color: var(--dim); font-size: 12.5px; line-height: 1.5; margin-top: 10px; }
.hint b { color: var(--mu); }
.muted { color: var(--mu); }
.small { font-size: 12.5px; }
.center { text-align: center; }
.insight-line { text-align: center; color: var(--mu); font-size: 14px; margin: 18px 8px 8px; }
.insight-line.left { text-align: left; margin: 0 4px 12px; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.mt6 { margin-top: 6px; } .mt8 { margin-top: 8px; } .mt10 { margin-top: 10px; } .mt14 { margin-top: 14px; } .mt18 { margin-top: 18px; }
.mb10 { margin-bottom: 10px; } .mb18 { margin-bottom: 18px; }
.err { color: #FFB3BE; background: rgba(232, 64, 87, .1); border: 1px solid rgba(232, 64, 87, .32); border-radius: 3px; padding: 11px 13px; font-size: 13.5px; margin: 10px 0; }
.note { background: color-mix(in srgb, var(--hex-2) 7%, transparent); border: 1px solid color-mix(in srgb, var(--hex-2) 25%, transparent); border-radius: 3px; padding: 11px 13px; font-size: 13.5px; margin-bottom: 10px; }
.loading { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 20px; color: var(--mu); }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--gold-1) 20%, transparent); border-top-color: currentColor; animation: spin .8s linear infinite; display: inline-block; }
.loading .spinner { border-top-color: var(--hex-2); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
.empty { text-align: center; padding: 28px 16px; }
.empty-t { font-family: var(--fx); font-weight: 600; font-size: 17px; color: var(--gold-1); margin-bottom: 4px; }

/* ═════════════════════════════════════════════════════════════
   Farm (manger)
   ═════════════════════════════════════════════════════════════ */
.daynav { display: flex; align-items: center; gap: 12px; margin: 4px 0 14px; }
.daynav-l { flex: 1; text-align: center; }
.daynav-t { font-family: var(--fx); font-weight: 700; font-size: 19px; color: var(--gold-1); }
.pbar { margin-bottom: 14px; }
.pbar-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; font-size: 14px; color: var(--mu); }
.pbar-val { color: var(--mu); font-size: 13px; }
.pbar-val b { font-family: var(--fx); color: var(--tx); font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pbar-track { position: relative; height: 10px; border-radius: 1px; background: var(--abyss); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--gold-2) 35%, transparent); }
.pbar-fill { height: 100%; border-radius: 1px; transition: width .9s cubic-bezier(.22, 1, .36, 1); box-shadow: 0 0 10px color-mix(in srgb, var(--gold-2) 40%, transparent); }
.pbar-mark { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--hex-1); box-shadow: 0 0 8px var(--hex-2); }
.macro-row { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--mu); }
.macro-row b { font-family: var(--fx); color: var(--tx); font-size: 14px; }
.reco { margin: 4px 0 16px; }
.reco-row { display: grid; gap: 8px; }
.reco-c { --rc: var(--mu); position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto auto; column-gap: 10px; align-items: center; padding: 9px 10px 9px 12px; border-radius: 3px; text-align: left;
  background: linear-gradient(100deg, rgba(255, 255, 255, .03), transparent), var(--panel-bg); border: 1px solid var(--line); border-left: 2px solid var(--rc); transition: transform .12s; }
.reco-c:active { transform: scale(.98); }
.reco-c.r-rare { --rc: #4AA8FF; } .reco-c.r-epic { --rc: #B97CFF; } .reco-c.r-legendary { --rc: #FF9F1C; }
.reco-r { margin-left: 8px; font-weight: 600; font-size: 12px; color: var(--rc); }
.reco-n { grid-column: 1; font-family: var(--fx); font-weight: 700; font-size: 16px; color: var(--gold-1); }
.reco-i { grid-column: 1; font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.reco-k { grid-column: 1; display: inline-flex; align-items: center; gap: 5px; font-family: var(--fx); font-weight: 700; font-size: 14px; color: var(--gold-2); }
.reco-k small { font-family: var(--fb); font-weight: 400; font-size: 12.5px; color: var(--mu); margin-left: 4px; }
.reco-p { grid-column: 2; grid-row: 1 / 4; width: 34px; height: 38px; display: grid; place-items: center; color: var(--hex-1); clip-path: var(--hexa); background: radial-gradient(circle at 50% 40%, var(--hex-2), var(--hex-3) 60%, var(--ink-3)); }
.timeline { position: relative; margin: 6px 0 14px; }
.tl-row { --rc: var(--mu); display: grid; grid-template-columns: 46px 14px 1fr; align-items: start; position: relative; }
.tl-row.r-rare { --rc: #4AA8FF; } .tl-row.r-epic { --rc: #B97CFF; } .tl-row.r-legendary { --rc: #FF9F1C; }
.tl-row::before { content: ""; position: absolute; left: 52px; top: 0; bottom: 0; width: 2px; background: linear-gradient(180deg, color-mix(in srgb, var(--gold-2) 35%, transparent), color-mix(in srgb, var(--gold-2) 8%, transparent)); }
.tl-row:first-child::before { top: 22px; }
.tl-row:last-child::before { bottom: calc(100% - 22px); }
.tl-time { font-family: var(--fx); font-weight: 600; font-size: 13.5px; color: var(--mu); padding-top: 15px; font-variant-numeric: tabular-nums; }
.tl-dot { position: relative; z-index: 1; width: 10px; height: 10px; margin: 18px 0 0 1px; transform: rotate(45deg); background: var(--rc); box-shadow: 0 0 10px var(--rc); }
.tl-card { margin: 0 0 10px 8px; border-radius: 3px; overflow: hidden; border-left: 2px solid var(--rc); }
.tl-row.open .tl-card { border-color: var(--line-2); border-left-color: var(--rc); }
.tl-row.open { grid-template-columns: 0 0 1fr; }
.tl-row.open .tl-time, .tl-row.open .tl-dot { visibility: hidden; }
.tl-row.open .tl-card { margin-left: 0; }
.tl-row.open::before { display: none; }
.tl-head { display: flex; justify-content: space-between; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; }
.tl-main { min-width: 0; }
.tl-title { font-family: var(--fx); font-weight: 700; font-size: 16px; color: var(--gold-1); }
.tl-rar { margin-left: 8px; font-family: var(--fx); font-weight: 600; font-size: 11.5px; color: var(--rc); vertical-align: 1px; }
.tl-items { font-size: 12.5px; color: var(--mu); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tl-kcal { text-align: right; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; }
.tl-kcal b { display: inline-flex; align-items: center; gap: 4px; font-family: var(--fx); font-weight: 700; font-size: 19px; color: var(--gold-2); }
.tl-kcal span { font-size: 12px; color: var(--mu); }
.tl-body { padding: 4px 14px 14px; border-top: 1px solid var(--line); }
.tl-body .grid2 { margin-top: 12px; }
.dexbtn { gap: 7px; flex-wrap: wrap; padding: 8px 12px; }
.dexbtn b { color: var(--gold-1); }
.dexbtn .muted { font-weight: 500; }
.dex-v { flex-basis: 100%; text-align: center; font-family: var(--fb); font-weight: 400; font-size: 12px; color: var(--dim); margin-top: -2px; }
.dex-h { display: grid; gap: 6px; margin-bottom: 12px; }
.dex-n { font-family: var(--fx); font-weight: 600; font-size: 15px; color: var(--mu); }
.dex-n b { font-size: 22px; color: var(--gold-1); }
.dex-bar { display: block; height: 6px; background: var(--abyss); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--gold-2) 30%, transparent); }
.dex-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--hex-3), var(--hex-1)); box-shadow: 0 0 8px var(--hex-2); }
.undisc .nm { color: var(--mu); }

/* Éditeur d'aliments et ajout */
.items { margin: 8px 0 10px; }
.item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: none; }
.item-main { flex: 1; min-width: 0; }
.item-name { font-size: 14.5px; font-weight: 500; }
.item-sub { font-size: 12.5px; color: var(--mu); margin-top: 1px; }
.item.missing .gram { border-color: var(--red); }
.warn-txt { color: #F0C878; font-size: 12.5px; margin-top: 3px; }
.gram { display: flex; align-items: center; gap: 4px; height: 42px; padding: 0 11px; border-radius: 3px; background: var(--abyss); border: 1px solid var(--line-2); flex-shrink: 0; }
.gram input { width: 54px; background: none; border: none; outline: none; text-align: right; font-family: var(--fx); font-weight: 700; font-size: 17px; }
.gram span { color: var(--mu); font-size: 12.5px; }
.gram.wide { width: 100%; }
.gram.wide input { width: 100%; text-align: left; }
.x-btn { width: 32px; height: 32px; border-radius: 50%; background: rgba(232, 64, 87, .12); color: #FF8A9A; display: grid; place-items: center; flex-shrink: 0; }
.unmatched { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 13.5px; padding: 10px 13px; margin: 8px 0; border-radius: 3px; background: rgba(232, 64, 87, .08); border: 1px solid rgba(232, 64, 87, .25); }
.unmatched span { flex: 1; min-width: 150px; }
.list-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; padding: 12px 0; border-bottom: 1px solid var(--line); }
.list-row:last-child { border-bottom: none; }
.nm { font-size: 14.5px; font-weight: 600; }
.row-l { display: flex; align-items: center; gap: 12px; }
.plus-dot { width: 30px; height: 34px; display: grid; place-items: center; clip-path: var(--hexa); background: radial-gradient(circle at 50% 40%, var(--hex-2), var(--hex-3) 60%, var(--ink-3)); color: var(--hex-1); flex-shrink: 0; }
.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 3px; background: var(--abyss); border: 1px solid var(--line); margin-bottom: 14px; }
.modes button { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 4px; border-radius: 2px; font-family: var(--fx); font-weight: 600; font-size: 15px; color: var(--mu); }
.modes button.on { color: var(--gold-1); background: linear-gradient(180deg, var(--ink-3), var(--navy)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--gold-2) 50%, transparent), inset 0 -2px 0 var(--hex-2); }
.composer-box { display: grid; gap: 10px; }
.sub-h { font-family: var(--fx); font-weight: 600; font-size: 15px; color: var(--gold-2); margin: 18px 0 9px; }
.hscroll { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 16px; margin: 0 -16px; padding: 0 16px 6px; }
.fav { flex: 0 0 172px; scroll-snap-align: start; display: flex; flex-direction: column; border-radius: 3px; overflow: hidden; }
.fav-main { display: flex; flex-direction: column; justify-content: space-between; gap: 10px; min-height: 92px; padding: 12px 13px 10px; text-align: left; transition: background .2s; }
.fav-main:active { background: color-mix(in srgb, var(--gold-2) 10%, transparent); }
.fav-n { font-family: var(--fx); font-weight: 700; font-size: 15.5px; line-height: 1.2; color: var(--gold-1); }
.fav-k { font-size: 12.5px; color: var(--mu); }
.fav-k b { font-family: var(--fx); color: var(--gold-2); font-size: 17px; }
.fav-adj { padding: 9px 13px; border-top: 1px solid var(--line); text-align: left; font-size: 12.5px; font-weight: 500; color: var(--mu); }
.recent { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.recent:last-child { border-bottom: none; }
.recent-main { flex: 1; min-width: 0; text-align: left; }
.recent-n { display: block; font-weight: 600; font-size: 14.5px; }
.recent-i { display: block; font-size: 12.5px; color: var(--mu); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.recent-r { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0; }

.total-line { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.total-line b { display: inline-flex; align-items: center; gap: 5px; font-family: var(--fx); font-weight: 700; font-size: 24px; color: var(--gold-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.field { display: block; margin-bottom: 12px; }
.field > span { display: block; font-size: 13px; color: var(--mu); margin-bottom: 6px; }
.inp { width: 100%; background: var(--abyss); border: 1px solid var(--line-2); border-radius: 3px; padding: 12px 13px; outline: none; font-size: 16px; transition: border-color .2s, box-shadow .2s; }

.inp:focus { border-color: color-mix(in srgb, var(--hex-2) 60%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--hex-2) 12%, transparent); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

input[type=time]::-webkit-date-and-time-value { text-align: left; }

/* ═════════════════════════════════════════════════════════════
   Arène (sport)
   ═════════════════════════════════════════════════════════════ */
.mana-p { border-color: rgba(47, 155, 255, .32); }

.crea-l small { font-size: 12px; color: var(--hex-2); }

   ═════════════════════════════════════════════════════════════ */
.sheet-wrap { position: fixed; inset: 0; z-index: 200; display: flex; align-items: flex-end; justify-content: center; background: color-mix(in srgb, var(--abyss) 62%, transparent); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); animation: fadeIn .2s ease; }

  background: linear-gradient(180deg, var(--navy) 0%, var(--abyss) 40%, var(--abyss) 100%); border: 1px solid color-mix(in srgb, var(--gold-2) 50%, transparent); border-bottom: none; border-radius: 6px 6px 0 0;
  animation: rise .34s cubic-bezier(.22, 1, .36, 1); transition: transform .25s ease; box-shadow: 0 -20px 60px rgba(0, 0, 0, .7); }
.sheet::before { content: ""; position: absolute; left: 20%; right: 20%; top: -1px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-1), transparent); }
.sheet.tall { height: calc(100dvh - var(--safe-t) - 24px); }

.sheet-foot { padding: 12px 16px calc(12px + var(--safe-b)); border-top: 1px solid var(--line); background: color-mix(in srgb, var(--abyss) 80%, transparent); }
.sheet .fav, .sheet .stat, .sheet .panel { background: color-mix(in srgb, var(--gold-1) 3%, transparent); box-shadow: none; }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; padding: 12px 0; font-size: 15px; text-align: left; }

.rt-tx { display: flex; flex-direction: column; font-size: 14.5px; font-weight: 500; }

.toggle.small { font-size: 14px; padding: 8px 0; text-align: left; gap: 12px; }

.skin-n { font-family: var(--fd); font-weight: 800; font-size: 14px; color: var(--gold-1); }

.msg { max-width: 88%; padding: 11px 14px; border-radius: 4px; font-size: 14.5px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; background: linear-gradient(180deg, var(--ink-3), var(--navy)); border: 1px solid color-mix(in srgb, var(--hex-2) 35%, transparent); }
.msg.assistant { align-self: flex-start; background: color-mix(in srgb, var(--gold-1) 5%, transparent); border: 1px solid var(--line); border-left: 2px solid var(--gold-2); }
.msg.err { color: #FFB3BE; background: rgba(232, 64, 87, .1); }
.typing { display: flex; gap: 5px; padding: 15px 16px; }
.typing i { width: 6px; height: 6px; transform: rotate(45deg); background: var(--hex-2); animation: dots .9s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes dots { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
.composer { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1; min-height: 48px; max-height: 120px; }
.send { width: 48px; height: 52px; display: grid; place-items: center; flex-shrink: 0; clip-path: var(--hexa); color: var(--hex-1); background: radial-gradient(circle at 50% 40%, var(--hex-2), var(--hex-3) 60%, var(--ink-3)); }
.send:disabled { background: color-mix(in srgb, var(--gold-1) 8%, transparent); color: var(--dim); }
.agent-chips { display: flex; gap: 8px; overflow-x: auto; margin: 12px -16px 0; padding: 0 16px 2px; scrollbar-width: none; }
.agent-chips .chip { flex: 0 0 auto; white-space: nowrap; font-size: 13px; }
.sheet .agent-chips { flex-wrap: wrap; overflow: visible; margin: 12px 0 0; padding: 0; }

/* Fiche d'item (façon boutique) */
.tip { display: grid; gap: 10px; }
.tip-h { display: flex; align-items: center; gap: 13px; }
.tip-slot { width: 66px; height: 66px; flex-shrink: 0; display: grid; place-items: center; clip-path: var(--bevel8); background: radial-gradient(circle at 50% 32%, var(--ink-3), var(--abyss) 78%); box-shadow: inset 0 0 0 1.5px var(--gold-2); }
.tip-n { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tip-n b { font-family: var(--fd); font-weight: 800; font-size: 20px; color: var(--gold-1); }
.tip-n small { font-size: 12.5px; color: var(--mu); }
.tip-s { display: flex; flex-direction: column; align-items: center; }
.tip-s b { font-family: var(--fx); font-weight: 700; font-size: 28px; line-height: 1; color: var(--hex-1); text-shadow: 0 0 12px var(--hex-2); }
.tip-s small { font-size: 11.5px; color: var(--mu); }
.tip-stats { display: flex; flex-direction: column; gap: 2px; padding: 9px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-family: var(--fx); font-weight: 700; font-size: 15px; color: var(--tx); }
.tip-stats .dim { font-weight: 500; font-size: 13px; color: var(--mu); }
.tip-p { font-size: 14px; line-height: 1.5; color: var(--mu); }
.tip-p b { color: var(--gold-1); font-weight: 600; }
.tip-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--mu); }
.tip-meta b { font-family: var(--fx); color: var(--tx); }
.tip-meta .warn { color: #FF9AA8; }
.tip-days { display: grid; grid-template-columns: repeat(14, 1fr); gap: 3px; }
.tip-days i { height: 8px; background: color-mix(in srgb, var(--gold-1) 8%, transparent); }
.tip-days i.on { background: var(--gold-2); box-shadow: 0 0 5px color-mix(in srgb, var(--gold-2) 60%, transparent); }
.tip-days i.pend { background: transparent; box-shadow: inset 0 0 0 1px var(--hex-2); }

/* Codex */
.cdx { display: grid; gap: 8px; }
.cdx-c { border: 1px solid var(--line); background: color-mix(in srgb, var(--gold-1) 2.5%, transparent); border-radius: 3px; }
.cdx-c.on { border-color: var(--line-2); }
.cdx-h { display: flex; align-items: center; gap: 11px; width: 100%; padding: 11px 12px; text-align: left; }
.cdx-h > svg:last-child { color: var(--dim); transition: transform .2s; }
.cdx-c.on .cdx-h > svg:last-child { transform: rotate(180deg); }
.cdx-ic { width: 32px; height: 36px; flex-shrink: 0; display: grid; place-items: center; clip-path: var(--hexa); color: #2A1D06; background: linear-gradient(180deg, #FFF3CC, var(--gold-2) 55%, var(--gold-4)); }
.cdx-n { flex: 1; font-family: var(--fd); font-weight: 800; font-size: 15px; line-height: 1.25; color: var(--gold-1); }
.cdx-b { padding: 0 14px 14px; }
.cdx-lol { font-family: var(--fx); font-weight: 600; font-size: 17px; line-height: 1.35; color: var(--hex-1); padding: 10px 12px; margin-bottom: 10px; background: color-mix(in srgb, var(--hex-2) 7%, transparent); border-left: 2px solid var(--hex-2); }
.cdx-l { list-style: none; display: grid; gap: 6px; margin-bottom: 10px; }
.cdx-l li { position: relative; padding-left: 16px; font-size: 14.5px; line-height: 1.5; }
.cdx-l li::before { content: ""; position: absolute; left: 3px; top: 8px; width: 6px; height: 6px; transform: rotate(45deg); background: var(--gold-2); }
.cdx-st { font-size: 14px; line-height: 1.5; padding: 10px 12px; margin-bottom: 10px; background: color-mix(in srgb, var(--gold-2) 7%, transparent); border-left: 2px solid var(--gold-2); }
.cdx-st b { color: var(--gold-1); }
.cdx-real, .cdx-you { display: grid; gap: 3px; margin-top: 8px; }
.cdx-real span, .cdx-you span { font-family: var(--fx); font-weight: 700; font-size: 13px; color: var(--gold-2); }
.cdx-you span { color: var(--hex-2); }
.cdx-real p, .cdx-you p { font-size: 14px; line-height: 1.5; color: var(--mu); }

/* Notes de patch */
.patch-h { margin-bottom: 8px; }
.patch-h h3 { font-family: var(--fd); font-weight: 900; font-size: 28px; line-height: 1.1; color: var(--gold-1); text-shadow: 0 0 18px color-mix(in srgb, var(--gold-2) 35%, transparent); }
.patch-h span { font-size: 13px; color: var(--mu); }
.patch-i { font-size: 14.5px; line-height: 1.55; color: var(--tx); padding: 12px; margin: 6px 0 14px; background: color-mix(in srgb, var(--gold-2) 6%, transparent); border-left: 2px solid var(--gold-2); }
.patch-s { margin-bottom: 16px; }
.patch-s h4 { font-family: var(--fx); font-weight: 700; font-size: 17px; color: var(--gold-2); padding-bottom: 6px; margin-bottom: 4px; border-bottom: 1px solid var(--line-2); }
.patch-row { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; font-size: 14px; line-height: 1.45; }
.ptg { flex: 0 0 76px; padding: 2px 0; text-align: center; border-radius: 2px; font-family: var(--fx); font-weight: 700; font-size: 11px; letter-spacing: .3px; }
.ptg.new { color: var(--hex-1); background: color-mix(in srgb, var(--hex-2) 16%, transparent); }
.ptg.buff { color: #9DF5C8; background: rgba(61, 214, 140, .16); }
.ptg.rework { color: #2A1D06; background: linear-gradient(180deg, #FFF3CC, var(--gold-2)); }
.ptg.adj { color: var(--mu); background: color-mix(in srgb, var(--gold-1) 8%, transparent); }

/* Fiche du boss */
.bs-h { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.bs-n { font-family: var(--fd); font-weight: 900; font-size: 22px; color: #FFD6DC; margin-bottom: 4px; }
.bs-w { margin: 10px 0 12px; font-size: 13.5px; color: #F0C878; }
.bs-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; height: 110px; }
.bs-d { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.bs-bar { position: relative; flex: 1; width: 100%; max-width: 30px; display: flex; align-items: flex-end; background: color-mix(in srgb, var(--gold-1) 4%, transparent); }
.bs-bar i { display: block; width: 100%; background: linear-gradient(0deg, #6E0F1E, #E84057); }
.bs-bar i.ok { background: linear-gradient(0deg, var(--gold-4), var(--gold-1)); box-shadow: 0 0 8px color-mix(in srgb, var(--gold-2) 50%, transparent); }
.bs-l { font-family: var(--fx); font-weight: 600; font-size: 12px; color: var(--dim); }
.bs-d.today .bs-l { color: var(--hex-2); }
.bs-d.fut .bs-bar { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }

/* ── Retours ── */
.toast { position: fixed; left: 50%; bottom: calc(100px + var(--safe-b)); transform: translateX(-50%); z-index: 300; display: flex; align-items: center; gap: 14px; max-width: calc(100% - 28px); width: max-content; padding: 10px 10px 10px 15px; border-radius: 3px;
  background: linear-gradient(180deg, var(--navy), var(--abyss)); border: 1px solid var(--line-2); box-shadow: 0 12px 34px rgba(0, 0, 0, .65); font-size: 14px; animation: toastIn .3s cubic-bezier(.22, 1, .36, 1); }
.toast.top { top: calc(14px + var(--safe-t)); bottom: auto; }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
.toast-undo { padding: 7px 12px; border-radius: 2px; font-family: var(--fx); font-weight: 700; white-space: nowrap; }
.update-bar { position: fixed; left: 50%; top: calc(10px + var(--safe-t)); transform: translateX(-50%); z-index: 320; display: flex; align-items: center; gap: 12px; width: max-content; max-width: calc(100% - 24px); padding: 8px 8px 8px 15px; border-radius: 3px;
  background: linear-gradient(180deg, var(--navy), var(--abyss)); border: 1px solid var(--gold-2); box-shadow: 0 10px 34px rgba(0, 0, 0, .6), 0 0 24px color-mix(in srgb, var(--hex-2) 25%, transparent); font-family: var(--fx); font-weight: 600; font-size: 15px; color: var(--gold-1); animation: toastIn .3s ease; }
.update-bar button { padding: 8px 14px; border-radius: 2px; font-weight: 700; white-space: nowrap; }
.confetti { position: fixed; z-index: 605; width: 0; height: 0; pointer-events: none; }
.confetti i { position: absolute; left: 0; top: 0; border-radius: 1px; animation: fly 1.4s cubic-bezier(.2, .7, .4, 1) forwards; }
@keyframes fly {
  0% { transform: translate(0, 0) rotate(0); opacity: 1; }
  55% { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 1; }
  100% { transform: translate(calc(var(--x) * 1.15), calc(var(--y) + 280px)) rotate(calc(var(--r) * 1.6)); opacity: 0; }
}

/* ═════════════════════════════════════════════════════════════
   Posture (vert soin) et glow-up
   ═════════════════════════════════════════════════════════════ */
.top-seg { margin-top: 0; }
.pz-hero { position: relative; overflow: hidden; margin-bottom: 14px; padding: 18px; border-radius: 4px;
  background: radial-gradient(110% 90% at 100% 0%, rgba(61, 214, 140, .18), transparent 55%), var(--panel-bg); border: 1px solid rgba(61, 214, 140, .32); }
.pz-t { font-family: var(--fd); font-weight: 800; font-size: 22px; color: var(--gold-1); }
.pz-p { color: var(--mu); font-size: 14px; margin-top: 4px; }
.pz-meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
.pz-meta span { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 3px; font-size: 12.5px; color: var(--mu); background: color-mix(in srgb, var(--abyss) 75%, transparent); border: 1px solid var(--line); }
.pz-meta b { font-family: var(--fx); font-weight: 700; color: var(--tx); font-size: 15px; }
.pz-meta .ok { color: #9DF5C8; border-color: rgba(61, 214, 140, .4); background: rgba(61, 214, 140, .1); }
.pz-list { display: grid; gap: 10px; }
.pz-ex { border-radius: 3px; background: var(--panel-bg); border: 1px solid var(--line); overflow: hidden; }
.pz-ex-h { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 14px 10px 10px; text-align: left; }
.pz-ex-h > svg:last-child { color: var(--dim); flex-shrink: 0; transition: transform .2s; }
.pz-ex.open .pz-ex-h > svg:last-child { transform: rotate(180deg); }
.pz-pic { width: 84px; height: 63px; flex-shrink: 0; display: grid; place-items: center; border-radius: 3px; color: #4FE39A; background: radial-gradient(circle at 50% 40%, rgba(61, 214, 140, .12), color-mix(in srgb, var(--gold-1) 2%, transparent)); border: 1px solid rgba(61, 214, 140, .18); }
.pz-pic .picto { filter: drop-shadow(0 0 5px rgba(61, 214, 140, .5)); }
.pz-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.pz-n { font-family: var(--fx); font-weight: 700; font-size: 16px; color: var(--gold-1); }
.pz-d { font-size: 12px; color: #9DF5C8; }
.pz-w { font-size: 12.5px; color: var(--mu); margin-top: 2px; }
.pz-cues { --acc: #4FE39A; padding: 0 16px 12px 18px; }
.round-btn.lg { width: 54px; height: 54px; }
.pp-intro .pp-steps { display: grid; gap: 8px; }
.pp-step { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 3px; background: color-mix(in srgb, var(--gold-1) 3%, transparent); border: 1px solid var(--line); }
.pp-pic { width: 64px; height: 48px; display: grid; place-items: center; color: #4FE39A; }
.pp-tx { display: flex; flex-direction: column; font-size: 14.5px; }
.pp-tx span { font-size: 12.5px; color: var(--mu); }
.pp-run { display: flex; flex-direction: column; align-items: center; text-align: center; }
.pp-bars { display: flex; gap: 5px; width: 100%; margin: 2px 0 14px; }
.pp-bars i { flex: 1; height: 4px; background: color-mix(in srgb, var(--gold-1) 12%, transparent); overflow: hidden; }
.pp-bars b { display: block; height: 100%; background: #4FE39A; box-shadow: 0 0 8px #4FE39A; }
.pp-k { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--mu); }
.pp-side { padding: 2px 9px; border-radius: 2px; font-weight: 600; color: #9DF5C8; background: rgba(61, 214, 140, .12); border: 1px solid rgba(61, 214, 140, .38); }
.pp-n { font-family: var(--fd); font-weight: 800; font-size: 23px; margin-top: 2px; color: var(--gold-1); }
.pp-ring { position: relative; width: min(250px, 66vw); aspect-ratio: 1; margin: 10px auto 2px; }
.pp-ring svg { width: 100%; height: 100%; overflow: visible; }
.pp-track { fill: none; stroke: color-mix(in srgb, var(--gold-1) 7%, transparent); stroke-width: 10; }
.pp-arc { fill: none; stroke: #4FE39A; stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .15s linear; }
.pp-arc.glow { stroke-width: 22; stroke-opacity: .16; }
.pp-run.prep .pp-arc { stroke: var(--gold-2); }
.pp-mid { position: absolute; inset: 0; display: grid; place-items: center; color: #4FE39A; }
.pp-mid .picto { filter: drop-shadow(0 0 8px rgba(61, 214, 140, .6)); }
.pp-run.prep .pp-mid { color: var(--gold-2); }
.pp-run.prep .pp-mid .picto { filter: drop-shadow(0 0 8px color-mix(in srgb, var(--gold-2) 60%, transparent)); }
.pp-sec { font-family: var(--fx); font-weight: 700; font-size: 54px; line-height: 1; font-variant-numeric: tabular-nums; }
.pp-sec small { font-size: 18px; color: var(--mu); font-weight: 500; }
.pp-run.paused .pp-sec, .pp-run.paused .pp-ring { opacity: .45; }
.pp-flash { margin-top: 10px; padding: 8px 16px; border-radius: 3px; font-family: var(--fx); font-weight: 700; font-size: 17px; color: #06281B; background: #4FE39A; box-shadow: 0 0 30px rgba(61, 214, 140, .7); animation: pop .3s cubic-bezier(.34, 1.56, .64, 1); }
.pp-cues { --acc: #4FE39A; text-align: left; align-self: stretch; margin: 14px 4px 6px; }
.pp-ctrl { display: flex; align-items: center; justify-content: center; gap: 26px; margin: 12px 0 6px; }
.pp-play { width: 74px; height: 82px; display: grid; place-items: center; color: #fff; clip-path: var(--hexa); background: radial-gradient(circle at 50% 40%, #6CF0AC, #1FA562 60%, #0B4A2C); }
.pp-play:active { transform: scale(.94); }
.pp-pause { width: 18px; height: 22px; border-left: 6px solid #fff; border-right: 6px solid #fff; }
.pp-end { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 30px 6px 10px; }
.pp-end h3 { font-family: var(--fd); font-weight: 900; font-size: 25px; margin: 18px 0 6px; color: var(--gold-1); }
.pp-badge { width: 104px; height: 116px; display: grid; place-items: center; color: #06281B; clip-path: var(--hexa); background: radial-gradient(circle at 35% 30%, #A8FFD9, #2FD39A); animation: pop .5s cubic-bezier(.34, 1.56, .64, 1); }
.gu-cmp, .gu-one { position: relative; width: 100%; aspect-ratio: 3 / 4; border-radius: 4px; overflow: hidden; touch-action: pan-y; user-select: none; -webkit-user-select: none; background: var(--abyss);
  border: 1px solid var(--line-2); box-shadow: 0 20px 50px -26px rgba(0, 0, 0, .9); }
.gu-cmp img, .gu-one img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.gu-line { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--gold-1); box-shadow: 0 0 14px color-mix(in srgb, var(--gold-1) 90%, transparent); pointer-events: none; }
.gu-knob { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--gold-1); background: color-mix(in srgb, var(--abyss) 70%, transparent); border: 1.5px solid var(--gold-2); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.gu-tag { position: absolute; top: 12px; display: flex; flex-direction: column; padding: 6px 10px; border-radius: 3px; font-size: 11.5px; line-height: 1.25; color: var(--tx); background: color-mix(in srgb, var(--abyss) 62%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); pointer-events: none; }
.gu-tag b { font-family: var(--fx); font-weight: 700; font-size: 13.5px; color: var(--gold-1); }
.gu-tag.l { left: 12px; } .gu-tag.r { right: 12px; text-align: right; }
.gu-days { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); padding: 5px 12px; border-radius: 3px; font-family: var(--fx); font-size: 13px; font-weight: 700; white-space: nowrap; color: var(--gold-1); background: color-mix(in srgb, var(--abyss) 75%, transparent); border: 1px solid var(--gold-2); pointer-events: none; }
.gu-empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 30px 22px; border-radius: 4px; background: radial-gradient(100% 80% at 50% 0%, color-mix(in srgb, var(--gold-2) 12%, transparent), transparent 60%), var(--panel-bg); border: 1px dashed var(--line-2); }
.gu-empty-ic { width: 66px; height: 74px; display: grid; place-items: center; clip-path: var(--hexa); color: #2A1D06; background: linear-gradient(180deg, #FFF3CC, var(--gold-2) 55%, var(--gold-4)); }
.gu-empty h3 { font-family: var(--fd); font-weight: 800; font-size: 19px; margin: 14px 0 4px; color: var(--gold-1); }
.gu-empty p { color: var(--mu); font-size: 14px; }
.gu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.gu-th { position: relative; min-width: 0; }
.gu-th-img { display: block; width: 100%; aspect-ratio: 3 / 4; border-radius: 3px; overflow: hidden; border: 2px solid transparent; background: var(--abyss); }
.gu-th-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gu-th.a .gu-th-img { border-color: var(--hex-2); }
.gu-th.b .gu-th-img { border-color: var(--gold-2); }
.gu-th-d { display: flex; justify-content: space-between; gap: 6px; margin-top: 5px; font-size: 11.5px; color: var(--mu); }
.gu-th-d i { font-style: normal; font-weight: 600; color: var(--tx); }
.gu-del { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: rgba(0, 0, 0, .6); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  .ann { animation: annFade 2s steps(1, end) forwards !important; }
}
@keyframes annFade { 0%, 99% { opacity: 1; } 100% { opacity: 0; } }

/* Pièces reprises du patch 8 (couleurs passées en jetons d'ambiance) */
.gbar { display: flex; align-items: center; gap: 7px; width: 100%; text-align: left; }
button.gbar:active .gbar-track { filter: brightness(1.15); }
.gbar-ic { width: 20px; height: 20px; display: grid; place-items: center; flex-shrink: 0; color: var(--bc); filter: drop-shadow(0 0 4px var(--bc)); }
.gbar-track { --ticks: 10; position: relative; flex: 1; min-width: 0; height: 20px; overflow: hidden; border-radius: 2px; background: var(--abyss);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--gold-2) 42%, transparent), inset 0 2px 6px rgba(0, 0, 0, .85); }
.gbar-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bf); box-shadow: 0 0 14px var(--bc); transition: width 1s cubic-bezier(.22, 1, .36, 1); }
.gbar-fill::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255, 255, 255, .36), rgba(255, 255, 255, 0) 46%, rgba(0, 0, 0, .28)); }
.gbar-track::after { content: ""; position: absolute; inset: 1px; pointer-events: none;
  background: repeating-linear-gradient(90deg, transparent 0, transparent calc(100% / var(--ticks) - 1px), color-mix(in srgb, var(--abyss) 60%, transparent) calc(100% / var(--ticks) - 1px), color-mix(in srgb, var(--abyss) 60%, transparent) calc(100% / var(--ticks))); }
.gbar-t { position: absolute; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 6px; white-space: nowrap;
  font-family: var(--fx); font-weight: 700; font-size: 12.5px; color: #fff; text-shadow: 0 1px 2px #000, 0 0 5px #000, 0 0 2px #000; }
.gbar-t em { font-style: normal; font-weight: 600; opacity: .78; }
.gbar.hp { --bc: var(--hp); --bf: linear-gradient(90deg, #105E38, #26B26C 60%, #74F2B2); }
.gbar.mana { --bc: #2F9BFF; --bf: linear-gradient(90deg, #102F96, #2C77FF 55%, #66D6FF); }
.gbar.boss { --bc: var(--red); --bf: linear-gradient(90deg, #5E0B18, #C42A40 60%, #FF6E81); }
.gbar.xp { --bc: var(--hex-2); --bf: linear-gradient(90deg, var(--hex-3), var(--hex-2) 70%, var(--hex-1)); }
.gbar.lp { --bc: var(--gold-2); --bf: linear-gradient(90deg, var(--gold-4), var(--gold-2) 60%, var(--gold-1)); }
.gbar.big .gbar-track { height: 26px; }
.gbar.big .gbar-t { font-size: 14px; }
@keyframes campPulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
.iart { display: block; overflow: visible; }
.sgrid { --cols: 7; display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 3px; }
.sgrid i { position: relative; aspect-ratio: 1; border-radius: 1px; background: color-mix(in srgb, var(--gold-1) 5%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--gold-2) 16%, transparent); }
.sgrid i.on { background: linear-gradient(180deg, var(--hex-1), var(--hex-2) 60%, var(--hex-3)); box-shadow: 0 0 6px color-mix(in srgb, var(--hex-2) 55%, transparent); }
.sgrid i.last { animation: stackIn .6s cubic-bezier(.34, 1.56, .64, 1); }
.sgrid i.lost::before, .sgrid i.lost::after { content: ""; position: absolute; left: 18%; right: 18%; top: calc(50% - 1px); height: 2px; border-radius: 1px; background: var(--red); transform: rotate(45deg); }
.sgrid i.lost::after { transform: rotate(-45deg); }
@keyframes stackIn { from { transform: scale(.2); opacity: 0; } to { transform: none; opacity: 1; } }
.bossart.dead { filter: grayscale(1) brightness(.55); }
.cbar { display: flex; align-items: center; gap: 12px; width: 100%; margin-bottom: 12px; padding: 12px; border-radius: 4px; text-align: left; transition: transform .12s;
  background: linear-gradient(100deg, color-mix(in srgb, var(--hex-2) 10%, transparent), transparent 60%), var(--panel-bg); border: 1px solid color-mix(in srgb, var(--hex-2) 30%, transparent); }
.cbar:active { transform: scale(.98); }
.cbar-ic { width: 38px; height: 42px; flex-shrink: 0; display: grid; place-items: center; color: var(--hex-1); clip-path: var(--hexa); background: radial-gradient(circle at 50% 40%, var(--hex-2), var(--hex-3) 60%, var(--ink-3)); }
.cbar-tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.cbar-tx b { font-family: var(--fx); font-weight: 700; font-size: 16px; color: var(--gold-1); }
.cbar-tx span { font-size: 12.5px; color: var(--mu); }
.cbar-go { color: var(--hex-2); }
.plan { border-color: rgba(111, 160, 255, .38); }

.plan-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.ptag { font-size: 12.5px; padding: 5px 10px; border-radius: 3px; background: color-mix(in srgb, var(--abyss) 70%, transparent); border: 1px solid var(--line); }
.ptag.moon { background: rgba(79, 141, 255, .14); border-color: rgba(79, 141, 255, .38); color: #CFE0FF; }
.plan-meals { display: flex; flex-direction: column; margin-bottom: 12px; }
.pm { display: grid; grid-template-columns: 44px 14px 1fr auto; align-items: center; gap: 0 8px; padding: 8px 0; position: relative; }
.pm + .pm::before { content: ""; position: absolute; left: 57px; top: -10px; height: 20px; width: 2px; background: rgba(111, 160, 255, .25); }
.pm-t { font-family: var(--fx); font-size: 13.5px; font-weight: 600; color: var(--mu); font-variant-numeric: tabular-nums; }
.pm-dot { width: 10px; height: 10px; transform: rotate(45deg); border: 2px solid #6FA0FF; justify-self: center; }
.pm.done .pm-dot { background: #6FA0FF; box-shadow: 0 0 8px #6FA0FF; }
.pm.now .pm-dot { background: var(--gold-2); border-color: var(--gold-2); box-shadow: 0 0 10px var(--gold-2); }

.pm-main { display: flex; flex-direction: column; min-width: 0; }
.pm-l { font-size: 14.5px; font-weight: 500; }
.pm-i { font-size: 12px; color: var(--mu); }
.pm-k { font-family: var(--fx); font-size: 13.5px; color: var(--gold-2); font-variant-numeric: tabular-nums; }
.pm.done .pm-k { color: #6FA0FF; }
.plan-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.plan-chip { align-self: flex-start; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; max-width: 88%; padding: 8px 12px; border-radius: 3px; background: rgba(79, 141, 255, .12); border: 1px solid rgba(79, 141, 255, .35); font-size: 13px; color: #CFE0FF; }
.wks-row { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.wk { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 6px 0 7px; border-radius: 3px; }
.wk.today { background: color-mix(in srgb, var(--hex-2) 7%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--hex-2) 32%, transparent); }
.wk:active:not(:disabled) { background: color-mix(in srgb, var(--gold-1) 6%, transparent); }
.wk-d { font-family: var(--fx); font-weight: 600; font-size: 12.5px; color: var(--dim); }
.wk.today .wk-d { color: var(--hex-2); }
.wk-r { width: 30px; height: 33px; display: grid; place-items: center; clip-path: var(--hexa); font-family: var(--fd); font-weight: 900; font-size: 14px; background: color-mix(in srgb, var(--gold-1) 6%, transparent); }
.wk-r.w { color: #2A1D06; background: linear-gradient(180deg, #FFF3CC, var(--gold-2) 55%, var(--gold-4)); }

.wk-r.fut { background: color-mix(in srgb, var(--gold-1) 3%, transparent); }

.kdots { display: flex; gap: 3px; height: 6px; align-items: center; }
.kdots i { width: 4px; height: 4px; transform: rotate(45deg); background: color-mix(in srgb, var(--gold-1) 14%, transparent); }
.kdots i.on { background: var(--gold-2); box-shadow: 0 0 4px var(--gold-2); }
.grade { display: inline-grid; place-items: center; min-width: 28px; height: 22px; padding: 0 5px; border-radius: 2px; font-family: var(--fd); font-weight: 900; font-size: 13px; line-height: 1; color: #1A1204; }
.g-sp { background: linear-gradient(180deg, #FFF6D1, #F0B84A); box-shadow: 0 0 10px rgba(240, 184, 74, .6); }

.g-a { background: linear-gradient(180deg, var(--hex-1), var(--hex-2)); }
.g-b { background: linear-gradient(180deg, #D6E4FF, #6E93FF); }
.g-c { background: linear-gradient(180deg, var(--tx), var(--dim)); }

.emblem { flex-shrink: 0; overflow: visible; filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .65)); }

@keyframes cardIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.endg, .welc { position: fixed; inset: 0; z-index: 450; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; justify-content: center; align-items: flex-start; padding: calc(28px + var(--safe-t)) 14px calc(28px + var(--safe-b));
  background: radial-gradient(80% 50% at 50% 18%, color-mix(in srgb, var(--gold-2) 14%, transparent), transparent 70%), color-mix(in srgb, var(--abyss) 90%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); animation: fadeIn .3s ease; }
.endg.lose { background: radial-gradient(80% 50% at 50% 18%, rgba(232, 64, 87, .16), transparent 70%), color-mix(in srgb, var(--abyss) 90%, transparent); }
.endg-in, .welc-in { width: 100%; max-width: 420px; margin: auto 0; text-align: center; }
.endg-k, .welc-k { font-family: var(--fx); font-weight: 600; font-size: 14px; color: var(--mu); letter-spacing: 1px; }
.endg-t { margin: 2px 0 10px; font-family: var(--fd); font-weight: 900; font-size: 54px; line-height: 1.05;
  background: linear-gradient(180deg, #FFF8E2 10%, #F2D892 45%, var(--gold-2) 65%, #7A5518); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 0 #000) drop-shadow(0 0 22px rgba(224, 184, 92, .45)); animation: endIn .9s cubic-bezier(.2, .9, .3, 1.15) both; }
.endg.lose .endg-t { background: linear-gradient(180deg, #FFE6EA 10%, #FF8A9A 45%, #C42A40 70%, #5E0B18); -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 2px 0 #000) drop-shadow(0 0 22px rgba(232, 64, 87, .45)); }
@keyframes endIn { from { opacity: 0; transform: scale(1.5); letter-spacing: 12px; } to { opacity: 1; transform: none; } }
.endg-g { display: flex; align-items: center; justify-content: center; gap: 12px; font-family: var(--fd); font-weight: 800; font-size: 17px; color: var(--gold-1); }
.endg-kills { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; margin: 18px 0 14px; }
.endg-kills .khex-b { width: 48px; height: 54px; }
.endg-stats { text-align: left; border: 1px solid var(--line); background: var(--panel-bg); border-radius: 3px; }
.es { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); }
.es:first-child { border-top: none; }
.es-l { display: inline-flex; align-items: center; gap: 8px; color: var(--mu); font-size: 14px; }
.es-l svg { color: var(--dim); }
.es-v { color: var(--mu); font-size: 13px; text-align: right; }
.es-v b { font-family: var(--fx); font-weight: 700; font-size: 18px; color: var(--tx); }
.es.ok .es-l svg, .es.ok .es-v b { color: var(--gold-2); }
.endg-xp { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; font-size: 12.5px; color: var(--mu); }
.endg-xp b { display: block; font-family: var(--fx); font-weight: 700; font-size: 20px; color: var(--hex-2); }
.endg-rc { text-align: left; padding: 12px; margin-bottom: 14px; border-radius: 3px; border: 1px solid rgba(232, 64, 87, .38); background: rgba(232, 64, 87, .07); }
.endg-rc h3 { font-family: var(--fd); font-weight: 800; font-size: 15px; color: #FF9AA8; margin-bottom: 6px; }
.endg-rc p { display: flex; gap: 9px; align-items: flex-start; font-size: 14px; line-height: 1.45; padding: 4px 0; }
.endg-rc p svg { flex-shrink: 0; margin-top: 2px; color: #FF7F91; }
.endg.win .endg-rc { border-color: var(--line-2); background: color-mix(in srgb, var(--gold-2) 5%, transparent); }
.endg.win .endg-rc h3 { color: var(--gold-2); }
.endg.win .endg-rc p svg { color: var(--gold-2); }
.welc-t { margin: 2px 0 8px; font-family: var(--fd); font-weight: 900; font-size: 40px; line-height: 1.1; color: var(--gold-1); text-shadow: 0 0 24px color-mix(in srgb, var(--gold-2) 45%, transparent); animation: endIn .9s cubic-bezier(.2, .9, .3, 1.15) both; }
.welc-p { font-size: 15px; line-height: 1.5; color: var(--tx); margin-bottom: 16px; }
