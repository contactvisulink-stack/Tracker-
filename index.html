/* ═════════════════════════════════════════════════════════════
   Profil
   ═════════════════════════════════════════════════════════════ */
.sumc { margin: 6px 0 14px; --cut: 14px; }
.sumc > * { position: relative; }
.sumc-top { display: flex; align-items: center; gap: 14px; padding: 16px 16px 10px; }
.sumc-id { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.sumc-n { font-family: var(--fd); font-weight: 800; font-size: 24px; line-height: 1.05; color: var(--gold-1); letter-spacing: .5px; }
.sumc-t { font-family: var(--fx); font-weight: 600; font-size: 14px; color: var(--gold-2); margin-top: -3px; }
.sumc-l { font-size: 12px; color: var(--mu); }
.sumc-stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); }
.ss { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px; text-align: center; }
.ss + .ss { border-left: 1px solid var(--line); }
.ss-v { display: inline-flex; align-items: center; gap: 5px; font-family: var(--fx); font-weight: 700; font-size: 16px; color: var(--gold-1); }
.ss-l { font-size: 11.5px; line-height: 1.3; color: var(--mu); }
.sumc-btns { display: flex; gap: 8px; padding: 0 16px 14px; }
.sumc-btns .pill-btn { flex: 1; }
.rank-hero { border-color: var(--line-2); }
.rh-top { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
.rh-id { flex: 1; min-width: 0; }
.rh-k { font-size: 12.5px; color: var(--mu); }
.rh-n { font-family: var(--fd); font-weight: 900; font-size: 26px; line-height: 1.1; color: var(--gold-1); text-shadow: 0 0 18px rgba(200, 170, 110, .35); }
.rh-w { margin-top: 4px; font-family: var(--fx); font-weight: 700; font-size: 18px; color: var(--tx); }
.rh-w .muted { display: block; font-family: var(--fb); font-weight: 400; font-size: 12px; }
.rh-s { margin-top: 9px; font-size: 13.5px; color: var(--mu); }
.rh-s b { font-family: var(--fx); color: var(--gold-1); }
.rh-in { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.rh-in h3 { font-family: var(--fx); font-weight: 600; font-size: 16px; color: var(--gold-1); margin-bottom: 10px; }
.w-ok { font-family: var(--fx); font-weight: 700; font-size: 22px; color: var(--hp); }
.ladder .lad { display: flex; align-items: center; gap: 12px; padding: 5px 6px; border-top: 1px solid var(--line); }
.ladder .sec-h + .lad { border-top: none; }
.lad.cur { background: linear-gradient(90deg, rgba(10, 200, 185, .14), transparent 70%); box-shadow: inset 2px 0 0 var(--hex-2); }
.lad-n { flex: 1; font-family: var(--fd); font-weight: 800; font-size: 15px; color: var(--dim); }
.lad.cur .lad-n, .lad.done .lad-n { color: var(--gold-1); }
.lad-w { font-family: var(--fx); font-size: 13px; color: var(--dim); }
.lad.cur .lad-w { color: var(--hex-2); font-weight: 700; }
.lad.done .lad-w { color: var(--mu); }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.stat { border-radius: 3px; padding: 13px 14px; }
.stat-v { font-family: var(--fx); font-weight: 700; font-size: 26px; line-height: 1.1; color: var(--tx); font-variant-numeric: tabular-nums; }
.stat-v small { font-weight: 500; font-size: 13px; color: var(--mu); }
.stat-v.gold { color: var(--gold-2); } .stat-v.flesh { color: var(--flesh); } .stat-v.hp { color: var(--hp); } .stat-v.mana { color: #6FB8FF; }
.stat-l { font-size: 12.5px; color: var(--mu); margin-top: 4px; line-height: 1.35; }
.mrow { --rc: var(--mu); display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 0; border-bottom: 1px solid var(--line); }
.mrow:last-child { border-bottom: none; }
.mrow-r { width: 66px; flex-shrink: 0; font-family: var(--fd); font-weight: 800; font-size: 12.5px; letter-spacing: .3px; }
.mrow-r.w { color: var(--gold-2); } .mrow-r.l { color: #FF7F91; } .mrow-r.cur { color: var(--hex-2); } .mrow-r.none { color: var(--dim); }
.mrow-m { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.mrow-x { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.career { padding-bottom: 8px; }
.car-grid { display: grid; grid-template-columns: 1fr 1fr; }
.car-grid div { display: flex; flex-direction: column; padding: 9px 0; border-top: 1px solid var(--line); }
.car-grid b { font-family: var(--fx); font-weight: 700; font-size: 19px; color: var(--gold-1); }
.car-grid span { font-size: 12px; color: var(--mu); }
.ach-head { padding-bottom: 12px; }
.ach-n { font-family: var(--fx); font-weight: 600; font-size: 15px; color: var(--mu); margin-bottom: 8px; }
.ach-n b { font-size: 24px; color: var(--gold-1); }
.ach-head .muted { margin-top: 8px; }
.ach { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.block-head + .ach { border-top: none; }
.ach-ic { width: 34px; height: 38px; flex-shrink: 0; display: grid; place-items: center; clip-path: var(--hexa); color: var(--dim); background: rgba(240, 230, 210, .06); }
.ach.on .ach-ic { color: #2A1D06; background: linear-gradient(180deg, #FFF3CC, var(--gold-2) 55%, var(--gold-4)); }
.ach-m { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ach-m b { font-family: var(--fx); font-weight: 700; font-size: 15.5px; color: var(--mu); }
.ach.on .ach-m b { color: var(--gold-1); }
.ach-m > span { font-size: 12.5px; color: var(--dim); }
.ach.on .ach-m > span { color: var(--mu); }
.ach-p { position: relative; display: block; height: 14px; margin-top: 5px; background: #02070D; box-shadow: inset 0 0 0 1px rgba(200, 170, 110, .25); }
.ach-p i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, var(--hex-3), var(--hex-2)); }
.ach-p em { position: relative; display: block; text-align: center; font-style: normal; font-family: var(--fx); font-weight: 700; font-size: 10.5px; line-height: 14px; color: #fff; text-shadow: 0 0 3px #000; }
.ach-r { font-family: var(--fx); font-weight: 700; font-size: 12.5px; color: var(--hex-2); white-space: nowrap; }
.ach.on .ach-r { color: var(--gold-2); }
.titles { display: flex; flex-wrap: wrap; gap: 6px; }
.ttl { display: inline-flex; align-items: center; gap: 5px; padding: 7px 11px; border-radius: 3px; font-family: var(--fx); font-weight: 600; font-size: 14px; color: var(--gold-1); background: rgba(5, 13, 24, .75); border: 1px solid var(--line-2); }
.ttl.on { color: #2A1D06; background: linear-gradient(180deg, #FFF3CC, var(--gold-2)); border-color: var(--gold-1); }
.ttl.locked { color: var(--dim); border-color: var(--line); }

/* ═════════════════════════════════════════════════════════════
   Panneaux du bas
   ═════════════════════════════════════════════════════════════ */
.sheet-wrap { position: fixed; inset: 0; z-index: 200; display: flex; align-items: flex-end; justify-content: center; background: rgba(1, 5, 10, .62); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); animation: fadeIn .2s ease; }
.sheet { position: relative; width: 100%; max-width: 520px; max-height: calc(100dvh - var(--safe-t) - 24px); display: flex; flex-direction: column;
  background: linear-gradient(180deg, #0D2033 0%, #060F1C 40%, #040A14 100%); border: 1px solid rgba(200, 170, 110, .5); border-bottom: none; border-radius: 6px 6px 0 0;
  animation: rise .34s cubic-bezier(.22, 1, .36, 1); transition: transform .25s ease; box-shadow: 0 -20px 60px rgba(0, 0, 0, .7); }
.sheet::before { content: ""; position: absolute; left: 20%; right: 20%; top: -1px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-1), transparent); }
.sheet.tall { height: calc(100dvh - var(--safe-t) - 24px); }
@keyframes rise { from { transform: translateY(100%); } to { transform: none; } }
.sheet-head { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 22px 16px 12px; touch-action: none; }
.handle { position: absolute; top: 8px; left: 50%; width: 40px; height: 4px; margin-left: -20px; border-radius: 2px; background: rgba(200, 170, 110, .45); }
.sheet-title { font-family: var(--fx); font-weight: 700; font-size: 21px; color: var(--gold-1); }
.sheet-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 4px 16px 18px; }
.sheet-foot { padding: 12px 16px calc(12px + var(--safe-b)); border-top: 1px solid var(--line); background: rgba(4, 10, 20, .8); }
.sheet .fav, .sheet .stat, .sheet .panel { background: rgba(240, 230, 210, .03); box-shadow: none; }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; padding: 12px 0; font-size: 15px; text-align: left; }
.sw { width: 50px; height: 28px; flex-shrink: 0; border-radius: 2px; background: #040B15; box-shadow: inset 0 0 0 1px var(--line-2); position: relative; transition: background .2s; }
.sw i { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 1px; background: linear-gradient(180deg, var(--gold-1), var(--gold-4)); transition: transform .2s; }
.toggle.on .sw { background: linear-gradient(180deg, #0F3A4A, #061A26); box-shadow: inset 0 0 0 1px rgba(10, 200, 185, .6), 0 0 10px rgba(10, 200, 185, .3); }
.toggle.on .sw i { transform: translateX(22px); background: linear-gradient(180deg, var(--hex-1), var(--hex-2)); }
.rt-list { margin-bottom: 4px; }
.toggle.rt { padding: 9px 0; border-bottom: 1px solid var(--line); }
.toggle.rt:last-child { border-bottom: none; }
.rt-l { display: flex; align-items: center; gap: 12px; text-align: left; }
.rt-ic { width: 38px; height: 38px; display: grid; place-items: center; flex-shrink: 0; clip-path: var(--bevel8); background: radial-gradient(circle at 50% 35%, #15304A, #040A13 78%); }
.rt-tx { display: flex; flex-direction: column; font-size: 14.5px; font-weight: 500; }
.rt-tx small { font-size: 12px; font-weight: 400; color: var(--mu); }
.toggle.small { font-size: 14px; padding: 8px 0; text-align: left; gap: 12px; }
.energy { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.energy button { height: 50px; border-radius: 3px; background: #040B15; border: 1px solid var(--line); font-size: 22px; opacity: .5; transition: all .15s; }
.energy button.on { opacity: 1; background: rgba(61, 214, 140, .14); border-color: rgba(61, 214, 140, .5); box-shadow: 0 0 12px rgba(61, 214, 140, .3); }
.forge { display: grid; gap: 4px; }
.forge-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.forge-row .rt-tx { flex: 1; }
.forge-c { display: flex; align-items: center; gap: 8px; margin: 2px 0 12px; }
.forge-c button { width: 28px; height: 28px; border-radius: 2px; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .4); opacity: .6; }
.forge-c button.on { opacity: 1; box-shadow: 0 0 0 2px var(--abyss), 0 0 0 3.5px var(--gold-1); }
.forge-prev { margin-left: auto; }
.skins { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.skin { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 10px; border-radius: 3px; text-align: left; background: rgba(5, 13, 24, .75); border: 1px solid var(--line); }
.skin.on { border-color: var(--gold-2); box-shadow: inset 0 0 0 1px var(--gold-2), 0 0 12px -2px rgba(200, 170, 110, .45); }
.skin.locked { opacity: .55; }
.skin-sw { display: flex; gap: 3px; margin-bottom: 4px; }
.skin-sw i { width: 18px; height: 18px; border-radius: 1px; }
.s-hextech .skin-sw i:nth-child(1) { background: #0A1428; } .s-hextech .skin-sw i:nth-child(2) { background: #C8AA6E; } .s-hextech .skin-sw i:nth-child(3) { background: #0AC8B9; }
.s-neon .skin-sw i:nth-child(1) { background: #0B1233; } .s-neon .skin-sw i:nth-child(2) { background: #4F8DFF; } .s-neon .skin-sw i:nth-child(3) { background: #FF5FD2; }
.s-infernal .skin-sw i:nth-child(1) { background: #26080A; } .s-infernal .skin-sw i:nth-child(2) { background: #F09A5C; } .s-infernal .skin-sw i:nth-child(3) { background: #FFB547; }
.s-abysse .skin-sw i:nth-child(1) { background: #002230; } .s-abysse .skin-sw i:nth-child(2) { background: #7FD8D0; } .s-abysse .skin-sw i:nth-child(3) { background: #2FB7FF; }
.s-prestige .skin-sw i:nth-child(1) { background: #16151C; } .s-prestige .skin-sw i:nth-child(2) { background: #EADCB8; } .s-prestige .skin-sw i:nth-child(3) { background: #FFFFFF; }
.s-challenger .skin-sw i:nth-child(1) { background: #0A1C3F; } .s-challenger .skin-sw i:nth-child(2) { background: #FFE7A0; } .s-challenger .skin-sw i:nth-child(3) { background: #4FA8FF; }
.skin-n { font-family: var(--fd); font-weight: 800; font-size: 14px; color: var(--gold-1); }
.skin-d { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 1.3; color: var(--mu); }

/* Coach */
.chat { display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 88%; padding: 11px 14px; border-radius: 4px; font-size: 14.5px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; background: linear-gradient(180deg, #0F3A4A, #082431); border: 1px solid rgba(10, 200, 185, .35); }
.msg.assistant { align-self: flex-start; background: rgba(240, 230, 210, .05); border: 1px solid var(--line); border-left: 2px solid var(--gold-2); }
.msg.err { color: #FFB3BE; background: rgba(232, 64, 87, .1); }
.typing { display: flex; gap: 5px; padding: 15px 16px; }
.typing i { width: 6px; height: 6px; transform: rotate(45deg); background: var(--hex-2); animation: dots .9s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes dots { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
.composer { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1; min-height: 48px; max-height: 120px; }
.send { width: 48px; height: 52px; display: grid; place-items: center; flex-shrink: 0; clip-path: var(--hexa); color: #E6FFFB; background: radial-gradient(circle at 50% 40%, #18D8C8, #0A7E7A 60%, #04343E); }
.send:disabled { background: rgba(240, 230, 210, .08); color: var(--dim); }
.agent-chips { display: flex; gap: 8px; overflow-x: auto; margin: 12px -16px 0; padding: 0 16px 2px; scrollbar-width: none; }
.agent-chips .chip { flex: 0 0 auto; white-space: nowrap; font-size: 13px; }
.sheet .agent-chips { flex-wrap: wrap; overflow: visible; margin: 12px 0 0; padding: 0; }

/* Fiche d'item (façon boutique) */
.tip { display: grid; gap: 10px; }
.tip-h { display: flex; align-items: center; gap: 13px; }
.tip-slot { width: 66px; height: 66px; flex-shrink: 0; display: grid; place-items: center; clip-path: var(--bevel8); background: radial-gradient(circle at 50% 32%, #15304A, #040A13 78%); box-shadow: inset 0 0 0 1.5px var(--gold-2); }
.tip-n { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tip-n b { font-family: var(--fd); font-weight: 800; font-size: 20px; color: var(--gold-1); }
.tip-n small { font-size: 12.5px; color: var(--mu); }
.tip-s { display: flex; flex-direction: column; align-items: center; }
.tip-s b { font-family: var(--fx); font-weight: 700; font-size: 28px; line-height: 1; color: var(--hex-1); text-shadow: 0 0 12px var(--hex-2); }
.tip-s small { font-size: 11.5px; color: var(--mu); }
.tip-stats { display: flex; flex-direction: column; gap: 2px; padding: 9px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-family: var(--fx); font-weight: 700; font-size: 15px; color: var(--tx); }
.tip-stats .dim { font-weight: 500; font-size: 13px; color: var(--mu); }
.tip-p { font-size: 14px; line-height: 1.5; color: var(--mu); }
.tip-p b { color: var(--gold-1); font-weight: 600; }
.tip-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--mu); }
.tip-meta b { font-family: var(--fx); color: var(--tx); }
.tip-meta .warn { color: #FF9AA8; }
.tip-days { display: grid; grid-template-columns: repeat(14, 1fr); gap: 3px; }
.tip-days i { height: 8px; background: rgba(240, 230, 210, .08); }
.tip-days i.on { background: var(--gold-2); box-shadow: 0 0 5px rgba(200, 170, 110, .6); }
.tip-days i.pend { background: transparent; box-shadow: inset 0 0 0 1px var(--hex-2); }

/* Codex */
.cdx { display: grid; gap: 8px; }
.cdx-c { border: 1px solid var(--line); background: rgba(240, 230, 210, .025); border-radius: 3px; }
.cdx-c.on { border-color: var(--line-2); }
.cdx-h { display: flex; align-items: center; gap: 11px; width: 100%; padding: 11px 12px; text-align: left; }
.cdx-h > svg:last-child { color: var(--dim); transition: transform .2s; }
.cdx-c.on .cdx-h > svg:last-child { transform: rotate(180deg); }
.cdx-ic { width: 32px; height: 36px; flex-shrink: 0; display: grid; place-items: center; clip-path: var(--hexa); color: #2A1D06; background: linear-gradient(180deg, #FFF3CC, var(--gold-2) 55%, var(--gold-4)); }
.cdx-n { flex: 1; font-family: var(--fd); font-weight: 800; font-size: 15px; line-height: 1.25; color: var(--gold-1); }
.cdx-b { padding: 0 14px 14px; }
.cdx-lol { font-family: var(--fx); font-weight: 600; font-size: 17px; line-height: 1.35; color: var(--hex-1); padding: 10px 12px; margin-bottom: 10px; background: rgba(10, 200, 185, .07); border-left: 2px solid var(--hex-2); }
.cdx-l { list-style: none; display: grid; gap: 6px; margin-bottom: 10px; }
.cdx-l li { position: relative; padding-left: 16px; font-size: 14.5px; line-height: 1.5; }
.cdx-l li::before { content: ""; position: absolute; left: 3px; top: 8px; width: 6px; height: 6px; transform: rotate(45deg); background: var(--gold-2); }
.cdx-st { font-size: 14px; line-height: 1.5; padding: 10px 12px; margin-bottom: 10px; background: rgba(200, 170, 110, .07); border-left: 2px solid var(--gold-2); }
.cdx-st b { color: var(--gold-1); }
.cdx-real, .cdx-you { display: grid; gap: 3px; margin-top: 8px; }
.cdx-real span, .cdx-you span { font-family: var(--fx); font-weight: 700; font-size: 13px; color: var(--gold-2); }
.cdx-you span { color: var(--hex-2); }
.cdx-real p, .cdx-you p { font-size: 14px; line-height: 1.5; color: var(--mu); }

/* Notes de patch */
.patch-h { margin-bottom: 8px; }
.patch-h h3 { font-family: var(--fd); font-weight: 900; font-size: 28px; line-height: 1.1; color: var(--gold-1); text-shadow: 0 0 18px rgba(200, 170, 110, .35); }
.patch-h span { font-size: 13px; color: var(--mu); }
.patch-i { font-size: 14.5px; line-height: 1.55; color: var(--tx); padding: 12px; margin: 6px 0 14px; background: rgba(200, 170, 110, .06); border-left: 2px solid var(--gold-2); }
.patch-s { margin-bottom: 16px; }
.patch-s h4 { font-family: var(--fx); font-weight: 700; font-size: 17px; color: var(--gold-2); padding-bottom: 6px; margin-bottom: 4px; border-bottom: 1px solid var(--line-2); }
.patch-row { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; font-size: 14px; line-height: 1.45; }
.ptg { flex: 0 0 76px; padding: 2px 0; text-align: center; border-radius: 2px; font-family: var(--fx); font-weight: 700; font-size: 11px; letter-spacing: .3px; }
.ptg.new { color: var(--hex-1); background: rgba(10, 200, 185, .16); }
.ptg.buff { color: #9DF5C8; background: rgba(61, 214, 140, .16); }
.ptg.rework { color: #2A1D06; background: linear-gradient(180deg, #FFF3CC, var(--gold-2)); }
.ptg.adj { color: var(--mu); background: rgba(240, 230, 210, .08); }

/* Fiche du boss */
.bs-h { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.bs-n { font-family: var(--fd); font-weight: 900; font-size: 22px; color: #FFD6DC; margin-bottom: 4px; }
.bs-w { margin: 10px 0 12px; font-size: 13.5px; color: #F0C878; }
.bs-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; height: 110px; }
.bs-d { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.bs-bar { position: relative; flex: 1; width: 100%; max-width: 30px; display: flex; align-items: flex-end; background: rgba(240, 230, 210, .04); }
.bs-bar i { display: block; width: 100%; background: linear-gradient(0deg, #6E0F1E, #E84057); }
.bs-bar i.ok { background: linear-gradient(0deg, var(--gold-4), var(--gold-1)); box-shadow: 0 0 8px rgba(200, 170, 110, .5); }
.bs-l { font-family: var(--fx); font-weight: 600; font-size: 12px; color: var(--dim); }
.bs-d.today .bs-l { color: var(--hex-2); }
.bs-d.fut .bs-bar { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }

/* ═════════════════════════════════════════════════════════════
   Les grands moments
   ═════════════════════════════════════════════════════════════ */
/* Écran de chargement */
.load { position: fixed; inset: 0; z-index: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: calc(24px + var(--safe-t)) 16px calc(24px + var(--safe-b));
  background: radial-gradient(90% 60% at 50% 42%, #10304A, var(--abyss) 72%); animation: fadeIn .3s ease; }
.load-head { text-align: center; }
.load-k { display: block; font-family: var(--fd); font-weight: 800; font-size: 17px; color: var(--gold-2); letter-spacing: 2px; }
.load-d { display: block; margin-top: 2px; font-size: 13.5px; color: var(--mu); }
.load-vs { display: flex; align-items: stretch; gap: 8px; width: 100%; max-width: 420px; }
.lcard { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; padding: 18px 8px 16px; clip-path: var(--bevel);
  background: linear-gradient(180deg, rgba(14, 32, 52, .95), rgba(4, 10, 20, .98)); box-shadow: inset 0 0 0 1px var(--line-2); animation: cardIn .7s cubic-bezier(.22, 1, .36, 1) both; }
.lcard.me { box-shadow: inset 0 0 0 1px rgba(10, 200, 185, .55), inset 0 0 40px rgba(10, 200, 185, .12); }
.lcard.foe { box-shadow: inset 0 0 0 1px rgba(232, 64, 87, .55), inset 0 0 40px rgba(232, 64, 87, .12); animation-delay: .1s; }
.lcard-art { display: grid; place-items: center; height: 92px; margin-bottom: 4px; }
.lcard-n { font-family: var(--fd); font-weight: 800; font-size: 15px; line-height: 1.2; color: var(--gold-1); }
.lcard-s { font-family: var(--fx); font-weight: 700; font-size: 14px; color: var(--tx); }
.lcard-x { font-size: 12px; color: var(--mu); }
@keyframes cardIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.load-x { align-self: center; font-family: var(--fd); font-weight: 900; font-size: 22px; color: var(--gold-2); text-shadow: 0 0 14px rgba(200, 170, 110, .65); }
.load-last { max-width: 360px; text-align: center; font-size: 13px; color: var(--mu); }
.load-tip { max-width: 360px; text-align: center; font-size: 15px; line-height: 1.5; color: var(--tx); }
.load-bar { width: 220px; height: 4px; overflow: hidden; background: rgba(200, 170, 110, .2); }
.load-bar i { display: block; height: 100%; transform-origin: left; background: linear-gradient(90deg, var(--hex-3), var(--hex-1)); box-shadow: 0 0 10px var(--hex-2); animation: loadFill 2.5s cubic-bezier(.4, 0, .2, 1) forwards; }
@keyframes loadFill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.load-skip { font-size: 12px; color: var(--dim); }

/* Fin de partie */
.endg, .welc { position: fixed; inset: 0; z-index: 450; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; justify-content: center; align-items: flex-start; padding: calc(28px + var(--safe-t)) 14px calc(28px + var(--safe-b));
  background: radial-gradient(80% 50% at 50% 18%, rgba(200, 170, 110, .14), transparent 70%), rgba(1, 5, 10, .9); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); animation: fadeIn .3s ease; }
.endg.lose { background: radial-gradient(80% 50% at 50% 18%, rgba(232, 64, 87, .16), transparent 70%), rgba(1, 5, 10, .9); }
.endg-in, .welc-in { width: 100%; max-width: 420px; margin: auto 0; text-align: center; }
.endg-k, .welc-k { font-family: var(--fx); font-weight: 600; font-size: 14px; color: var(--mu); letter-spacing: 1px; }
.endg-t { margin: 2px 0 10px; font-family: var(--fd); font-weight: 900; font-size: 54px; line-height: 1.05;
  background: linear-gradient(180deg, #FFF8E2 10%, #F2D892 45%, #C8AA6E 65%, #7A5518); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 0 #000) drop-shadow(0 0 22px rgba(224, 184, 92, .45)); animation: endIn .9s cubic-bezier(.2, .9, .3, 1.15) both; }
.endg.lose .endg-t { background: linear-gradient(180deg, #FFE6EA 10%, #FF8A9A 45%, #C42A40 70%, #5E0B18); -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 2px 0 #000) drop-shadow(0 0 22px rgba(232, 64, 87, .45)); }
@keyframes endIn { from { opacity: 0; transform: scale(1.5); letter-spacing: 12px; } to { opacity: 1; transform: none; } }
.endg-g { display: flex; align-items: center; justify-content: center; gap: 12px; font-family: var(--fd); font-weight: 800; font-size: 17px; color: var(--gold-1); }
.endg-kills { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; margin: 18px 0 14px; }
.endg-kills .khex-b { width: 48px; height: 54px; }
.endg-stats { text-align: left; border: 1px solid var(--line); background: var(--panel-bg); border-radius: 3px; }
.es { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); }
.es:first-child { border-top: none; }
.es-l { display: inline-flex; align-items: center; gap: 8px; color: var(--mu); font-size: 14px; }
.es-l svg { color: var(--dim); }
.es-v { color: var(--mu); font-size: 13px; text-align: right; }
.es-v b { font-family: var(--fx); font-weight: 700; font-size: 18px; color: var(--tx); }
.es.ok .es-l svg, .es.ok .es-v b { color: var(--gold-2); }
.endg-xp { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; font-size: 12.5px; color: var(--mu); }
.endg-xp b { display: block; font-family: var(--fx); font-weight: 700; font-size: 20px; color: var(--hex-2); }
.endg-rc { text-align: left; padding: 12px; margin-bottom: 14px; border-radius: 3px; border: 1px solid rgba(232, 64, 87, .38); background: rgba(232, 64, 87, .07); }
.endg-rc h3 { font-family: var(--fd); font-weight: 800; font-size: 15px; color: #FF9AA8; margin-bottom: 6px; }
.endg-rc p { display: flex; gap: 9px; align-items: flex-start; font-size: 14px; line-height: 1.45; padding: 4px 0; }
.endg-rc p svg { flex-shrink: 0; margin-top: 2px; color: #FF7F91; }
.endg.win .endg-rc { border-color: var(--line-2); background: rgba(200, 170, 110, .05); }
.endg.win .endg-rc h3 { color: var(--gold-2); }
.endg.win .endg-rc p svg { color: var(--gold-2); }
/* Import du compte */
.welc-t { margin: 2px 0 8px; font-family: var(--fd); font-weight: 900; font-size: 40px; line-height: 1.1; color: var(--gold-1); text-shadow: 0 0 24px rgba(200, 170, 110, .45); animation: endIn .9s cubic-bezier(.2, .9, .3, 1.15) both; }
.welc-p { font-size: 15px; line-height: 1.5; color: var(--tx); margin-bottom: 16px; }
.welc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.wg { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 96px; padding: 12px 6px; border: 1px solid var(--line); background: var(--panel-bg); border-radius: 3px; }
.wg-v { font-family: var(--fx); font-weight: 700; font-size: 34px; line-height: 1; color: var(--gold-1); }
.wg-l { font-size: 12.5px; color: var(--mu); }
.wg.rank .wg-l { font-family: var(--fd); font-weight: 800; font-size: 14px; color: var(--gold-1); }
.welc-crea { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; margin-top: 8px; padding: 12px; border: 1px solid var(--line); background: var(--panel-bg); border-radius: 3px; text-align: left; }
.welc-crea .sgrid { --cols: 14 !important; }
.welc-cl { font-family: var(--fx); font-weight: 700; font-size: 13.5px; color: var(--gold-1); width: 74px; line-height: 1.2; }
.welc-cs { font-family: var(--fx); font-weight: 700; font-size: 15px; color: var(--hex-1); }

/* Annonces plein écran */
.ann { --a1: #FFF8E2; --a2: #F2D892; --a3: #C8AA6E; --a4: #7A5518; --ag: rgba(224, 184, 92, .6); position: fixed; left: 0; right: 0; top: calc(21% + var(--safe-t)); z-index: 600; display: flex; flex-direction: column; align-items: center; padding: 0 10px; pointer-events: none; animation: annIn 2s ease forwards; }
.ann.big { animation-duration: 2.7s; }
.ann.t-red { --a1: #FFE6EA; --a2: #FF8A9A; --a3: #D63650; --a4: #6E0F1E; --ag: rgba(232, 64, 87, .65); }
.ann.t-blue { --a1: #EEF5FF; --a2: #9CC4FF; --a3: #4F8DFF; --a4: #1B3C9C; --ag: rgba(79, 141, 255, .65); }
.ann.t-cyan { --a1: #E8FFFC; --a2: #8CF5EA; --a3: #0AC8B9; --a4: #035A5A; --ag: rgba(10, 200, 185, .6); }
.ann.t-green { --a1: #E8FFF1; --a2: #9DF5C8; --a3: #3DD68C; --a4: #0F5E37; --ag: rgba(61, 214, 140, .6); }
.ann-glow { position: absolute; left: 50%; top: 50%; z-index: -1; width: 140%; height: 190px; transform: translate(-50%, -50%); background: radial-gradient(closest-side, rgba(1, 5, 10, .82), transparent); }
.ann-art { margin-bottom: 6px; animation: pop .55s cubic-bezier(.34, 1.56, .64, 1) both; filter: drop-shadow(0 0 18px var(--ag)); }
.ann-k { font-family: var(--fx); font-weight: 700; font-size: 13px; letter-spacing: 2px; color: var(--a3); margin-bottom: 2px; }
.ann-row { display: flex; align-items: center; gap: 10px; max-width: 100%; }
.ann-t { max-width: 86vw; text-align: center; font-family: var(--fd); font-weight: 900; font-size: clamp(24px, 8.6vw, 36px); line-height: 1.08; letter-spacing: 1px;
  background: linear-gradient(180deg, var(--a1) 10%, var(--a2) 45%, var(--a3) 65%, var(--a4)); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 0 #000) drop-shadow(0 0 16px var(--ag)); }
.ann.big .ann-t { font-size: clamp(28px, 10.5vw, 46px); }
.ann-wing { flex-shrink: 0; width: 34px; height: 12px; background: linear-gradient(90deg, transparent, var(--a3)); clip-path: polygon(0 50%, 100% 0, 100% 100%); }
.ann-wing.r { transform: scaleX(-1); }
.ann-s { margin-top: 4px; padding: 4px 22px; max-width: 92vw; text-align: center; font-family: var(--fx); font-weight: 600; font-size: 15px; color: var(--gold-1); background: linear-gradient(90deg, transparent, rgba(1, 8, 15, .88) 18%, rgba(1, 8, 15, .88) 82%, transparent); }
@keyframes annIn { 0% { opacity: 0; transform: scale(1.5); filter: blur(6px); } 12% { opacity: 1; transform: scale(1); filter: blur(0); } 82% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-14px); } }

/* ── Barre du bas ── */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 100; padding: 0 0 var(--safe-b); pointer-events: none; background: linear-gradient(180deg, transparent, rgba(1, 6, 12, .96) 30%); }
.nav-in { pointer-events: auto; position: relative; max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr 86px 1fr 1fr; align-items: end; padding: 9px 8px 8px;
  background: linear-gradient(180deg, #0B182B, #040A14); border-top: 1px solid rgba(200, 170, 110, .38); box-shadow: 0 -12px 30px rgba(0, 0, 0, .6); }
.nav-in::before { content: ""; position: absolute; left: 32%; right: 32%; top: -1px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-1), transparent); }
.nb { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0 2px; color: var(--dim); font-family: var(--fx); font-weight: 600; font-size: 12px; letter-spacing: .3px; transition: color .2s; }
.nb svg { transition: color .25s, filter .25s; }
.nb.on { color: var(--gold-1); }
.nb.on svg { color: var(--hex-2); filter: drop-shadow(0 0 6px var(--hex-2)); }
.nb.on::before { content: ""; position: absolute; top: -10px; left: 26%; right: 26%; height: 2px; background: var(--gold-2); box-shadow: 0 0 8px var(--gold-2); }
.nb:active svg { transform: scale(.92); }
.fab { position: relative; justify-self: center; width: 64px; height: 72px; margin-top: -32px; display: grid; place-items: center; transition: transform .14s ease;
  filter: drop-shadow(0 0 12px rgba(10, 200, 185, .45)) drop-shadow(0 6px 10px rgba(0, 0, 0, .7)); }
.fab::before { content: ""; position: absolute; inset: 0; clip-path: var(--hexa); background: linear-gradient(180deg, #FAF3E2, var(--gold-2) 45%, #5C4320); }
.fab-in { position: relative; width: calc(100% - 7px); height: calc(100% - 7px); display: grid; place-items: center; clip-path: var(--hexa); color: #F0FFFD;
  background: radial-gradient(circle at 50% 38%, #2AF0DF 0%, #0A9C94 38%, #065460 72%, #032029 100%); }
.fab:active { transform: scale(.9); }

/* ── Retours ── */
.toast { position: fixed; left: 50%; bottom: calc(100px + var(--safe-b)); transform: translateX(-50%); z-index: 300; display: flex; align-items: center; gap: 14px; max-width: calc(100% - 28px); width: max-content; padding: 10px 10px 10px 15px; border-radius: 3px;
  background: linear-gradient(180deg, #0D2033, #050D18); border: 1px solid var(--line-2); box-shadow: 0 12px 34px rgba(0, 0, 0, .65); font-size: 14px; animation: toastIn .3s cubic-bezier(.22, 1, .36, 1); }
.toast.top { top: calc(14px + var(--safe-t)); bottom: auto; }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
.toast-undo { padding: 7px 12px; border-radius: 2px; font-family: var(--fx); font-weight: 700; white-space: nowrap; }
.update-bar { position: fixed; left: 50%; top: calc(10px + var(--safe-t)); transform: translateX(-50%); z-index: 320; display: flex; align-items: center; gap: 12px; width: max-content; max-width: calc(100% - 24px); padding: 8px 8px 8px 15px; border-radius: 3px;
  background: linear-gradient(180deg, #0D2033, #050D18); border: 1px solid var(--gold-2); box-shadow: 0 10px 34px rgba(0, 0, 0, .6), 0 0 24px rgba(10, 200, 185, .25); font-family: var(--fx); font-weight: 600; font-size: 15px; color: var(--gold-1); animation: toastIn .3s ease; }
.update-bar button { padding: 8px 14px; border-radius: 2px; font-weight: 700; white-space: nowrap; }
.confetti { position: fixed; z-index: 605; width: 0; height: 0; pointer-events: none; }
.confetti i { position: absolute; left: 0; top: 0; border-radius: 1px; animation: fly 1.4s cubic-bezier(.2, .7, .4, 1) forwards; }
@keyframes fly {
  0% { transform: translate(0, 0) rotate(0); opacity: 1; }
  55% { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 1; }
  100% { transform: translate(calc(var(--x) * 1.15), calc(var(--y) + 280px)) rotate(calc(var(--r) * 1.6)); opacity: 0; }
}

/* ═════════════════════════════════════════════════════════════
   Posture (vert soin) et glow-up
   ═════════════════════════════════════════════════════════════ */
.top-seg { margin-top: 0; }
.pz-hero { position: relative; overflow: hidden; margin-bottom: 14px; padding: 18px; border-radius: 4px;
  background: radial-gradient(110% 90% at 100% 0%, rgba(61, 214, 140, .18), transparent 55%), var(--panel-bg); border: 1px solid rgba(61, 214, 140, .32); }
.pz-t { font-family: var(--fd); font-weight: 800; font-size: 22px; color: var(--gold-1); }
.pz-p { color: var(--mu); font-size: 14px; margin-top: 4px; }
.pz-meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
.pz-meta span { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 3px; font-size: 12.5px; color: var(--mu); background: rgba(5, 13, 24, .75); border: 1px solid var(--line); }
.pz-meta b { font-family: var(--fx); font-weight: 700; color: var(--tx); font-size: 15px; }
.pz-meta .ok { color: #9DF5C8; border-color: rgba(61, 214, 140, .4); background: rgba(61, 214, 140, .1); }
.pz-list { display: grid; gap: 10px; }
.pz-ex { border-radius: 3px; background: var(--panel-bg); border: 1px solid var(--line); overflow: hidden; }
.pz-ex-h { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 14px 10px 10px; text-align: left; }
.pz-ex-h > svg:last-child { color: var(--dim); flex-shrink: 0; transition: transform .2s; }
.pz-ex.open .pz-ex-h > svg:last-child { transform: rotate(180deg); }
.pz-pic { width: 84px; height: 63px; flex-shrink: 0; display: grid; place-items: center; border-radius: 3px; color: #4FE39A; background: radial-gradient(circle at 50% 40%, rgba(61, 214, 140, .12), rgba(240, 230, 210, .02)); border: 1px solid rgba(61, 214, 140, .18); }
.pz-pic .picto { filter: drop-shadow(0 0 5px rgba(61, 214, 140, .5)); }
.pz-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.pz-n { font-family: var(--fx); font-weight: 700; font-size: 16px; color: var(--gold-1); }
.pz-d { font-size: 12px; color: #9DF5C8; }
.pz-w { font-size: 12.5px; color: var(--mu); margin-top: 2px; }
.pz-cues { --acc: #4FE39A; padding: 0 16px 12px 18px; }
.round-btn.lg { width: 54px; height: 54px; }
.pp-intro .pp-steps { display: grid; gap: 8px; }
.pp-step { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 3px; background: rgba(240, 230, 210, .03); border: 1px solid var(--line); }
.pp-pic { width: 64px; height: 48px; display: grid; place-items: center; color: #4FE39A; }
.pp-tx { display: flex; flex-direction: column; font-size: 14.5px; }
.pp-tx span { font-size: 12.5px; color: var(--mu); }
.pp-run { display: flex; flex-direction: column; align-items: center; text-align: center; }
.pp-bars { display: flex; gap: 5px; width: 100%; margin: 2px 0 14px; }
.pp-bars i { flex: 1; height: 4px; background: rgba(240, 230, 210, .12); overflow: hidden; }
.pp-bars b { display: block; height: 100%; background: #4FE39A; box-shadow: 0 0 8px #4FE39A; }
.pp-k { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--mu); }
.pp-side { padding: 2px 9px; border-radius: 2px; font-weight: 600; color: #9DF5C8; background: rgba(61, 214, 140, .12); border: 1px solid rgba(61, 214, 140, .38); }
.pp-n { font-family: var(--fd); font-weight: 800; font-size: 23px; margin-top: 2px; color: var(--gold-1); }
.pp-ring { position: relative; width: min(250px, 66vw); aspect-ratio: 1; margin: 10px auto 2px; }
.pp-ring svg { width: 100%; height: 100%; overflow: visible; }
.pp-track { fill: none; stroke: rgba(240, 230, 210, .07); stroke-width: 10; }
.pp-arc { fill: none; stroke: #4FE39A; stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .15s linear; }
.pp-arc.glow { stroke-width: 22; stroke-opacity: .16; }
.pp-run.prep .pp-arc { stroke: var(--gold-2); }
.pp-mid { position: absolute; inset: 0; display: grid; place-items: center; color: #4FE39A; }
.pp-mid .picto { filter: drop-shadow(0 0 8px rgba(61, 214, 140, .6)); }
.pp-run.prep .pp-mid { color: var(--gold-2); }
.pp-run.prep .pp-mid .picto { filter: drop-shadow(0 0 8px rgba(200, 170, 110, .6)); }
.pp-sec { font-family: var(--fx); font-weight: 700; font-size: 54px; line-height: 1; font-variant-numeric: tabular-nums; }
.pp-sec small { font-size: 18px; color: var(--mu); font-weight: 500; }
.pp-run.paused .pp-sec, .pp-run.paused .pp-ring { opacity: .45; }
.pp-flash { margin-top: 10px; padding: 8px 16px; border-radius: 3px; font-family: var(--fx); font-weight: 700; font-size: 17px; color: #06281B; background: #4FE39A; box-shadow: 0 0 30px rgba(61, 214, 140, .7); animation: pop .3s cubic-bezier(.34, 1.56, .64, 1); }
.pp-cues { --acc: #4FE39A; text-align: left; align-self: stretch; margin: 14px 4px 6px; }
.pp-ctrl { display: flex; align-items: center; justify-content: center; gap: 26px; margin: 12px 0 6px; }
.pp-play { width: 74px; height: 82px; display: grid; place-items: center; color: #fff; clip-path: var(--hexa); background: radial-gradient(circle at 50% 40%, #6CF0AC, #1FA562 60%, #0B4A2C); }
.pp-play:active { transform: scale(.94); }
.pp-pause { width: 18px; height: 22px; border-left: 6px solid #fff; border-right: 6px solid #fff; }
.pp-end { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 30px 6px 10px; }
.pp-end h3 { font-family: var(--fd); font-weight: 900; font-size: 25px; margin: 18px 0 6px; color: var(--gold-1); }
.pp-badge { width: 104px; height: 116px; display: grid; place-items: center; color: #06281B; clip-path: var(--hexa); background: radial-gradient(circle at 35% 30%, #A8FFD9, #2FD39A); animation: pop .5s cubic-bezier(.34, 1.56, .64, 1); }
.gu-cmp, .gu-one { position: relative; width: 100%; aspect-ratio: 3 / 4; border-radius: 4px; overflow: hidden; touch-action: pan-y; user-select: none; -webkit-user-select: none; background: #02060C;
  border: 1px solid var(--line-2); box-shadow: 0 20px 50px -26px rgba(0, 0, 0, .9); }
.gu-cmp img, .gu-one img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.gu-line { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--gold-1); box-shadow: 0 0 14px rgba(240, 230, 210, .9); pointer-events: none; }
.gu-knob { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--gold-1); background: rgba(5, 13, 24, .7); border: 1.5px solid var(--gold-2); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.gu-tag { position: absolute; top: 12px; display: flex; flex-direction: column; padding: 6px 10px; border-radius: 3px; font-size: 11.5px; line-height: 1.25; color: var(--tx); background: rgba(1, 6, 12, .62); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); pointer-events: none; }
.gu-tag b { font-family: var(--fx); font-weight: 700; font-size: 13.5px; color: var(--gold-1); }
.gu-tag.l { left: 12px; } .gu-tag.r { right: 12px; text-align: right; }
.gu-days { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); padding: 5px 12px; border-radius: 3px; font-family: var(--fx); font-size: 13px; font-weight: 700; white-space: nowrap; color: var(--gold-1); background: rgba(1, 6, 12, .75); border: 1px solid var(--gold-2); pointer-events: none; }
.gu-empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 30px 22px; border-radius: 4px; background: radial-gradient(100% 80% at 50% 0%, rgba(200, 170, 110, .12), transparent 60%), var(--panel-bg); border: 1px dashed var(--line-2); }
.gu-empty-ic { width: 66px; height: 74px; display: grid; place-items: center; clip-path: var(--hexa); color: #2A1D06; background: linear-gradient(180deg, #FFF3CC, var(--gold-2) 55%, var(--gold-4)); }
.gu-empty h3 { font-family: var(--fd); font-weight: 800; font-size: 19px; margin: 14px 0 4px; color: var(--gold-1); }
.gu-empty p { color: var(--mu); font-size: 14px; }
.gu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.gu-th { position: relative; min-width: 0; }
.gu-th-img { display: block; width: 100%; aspect-ratio: 3 / 4; border-radius: 3px; overflow: hidden; border: 2px solid transparent; background: #02060C; }
.gu-th-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gu-th.a .gu-th-img { border-color: var(--hex-2); }
.gu-th.b .gu-th-img { border-color: var(--gold-2); }
.gu-th-d { display: flex; justify-content: space-between; gap: 6px; margin-top: 5px; font-size: 11.5px; color: var(--mu); }
.gu-th-d i { font-style: normal; font-weight: 600; color: var(--tx); }
.gu-del { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: rgba(0, 0, 0, .6); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  .ann { animation: annFade 2s steps(1, end) forwards !important; }
}
@keyframes annFade { 0%, 99% { opacity: 1; } 100% { opacity: 0; } }

r\xEAtes, tu perds tes stacks petit \xE0 petit : 4 \xE0 6 semaines pour revenir \xE0 z\xE9ro.",real:"La cr\xE9atine augmente la phosphocr\xE9atine stock\xE9e dans tes muscles, d'environ 20 \xE0 40 %. C'est le carburant des efforts courts et \xE0 fond, les 10 premi\xE8res secondes. Les premi\xE8res semaines, tu prends souvent un peu d'eau dans le muscle : c'est normal, ce n'est pas du gras.",you:()=>"N'importe quelle cr\xE9atine monohydrate fait le job, pas besoin d'une marque ch\xE8re. L'heure ne compte pas, le tous les jours si. Si \xE7a te barbouille, prends-la avec un repas ou en deux fois."},{id:"calories",ic:"coin",n:"Les calories, c'est ton gold",lol:"Tu ne gagnes pas une game sans farmer. Ton corps non plus.",lines:["Chaque repas, c'est une vague de sbires : tu la farmes, ou tu la laisses mourir sous ta tour.","Le gold sert \xE0 acheter des items. Ici, l'item, c'est du muscle et des kilos.","Pas de surplus de gold, pas d'achat : tu stagnes."],real:"Pour prendre du poids, il faut manger plus que ce que tu d\xE9penses. Un surplus de 300 \xE0 500 kcal par jour donne en gros 0,25 \xE0 0,5 kg de plus par semaine. Un hardgainer d\xE9pense beaucoup : c'est un champion qui a besoin de beaucoup de farm.",you:e=>`Ton objectif : ${Math.round(e.kcal).toLocaleString("fr-FR")} kcal. Si ton rang ne bouge pas pendant 2 semaines, ajoute 200 \xE0 300 kcal par jour, un shaker suffit.`},{id:"proteines",ic:"bolt",n:"Les prot\xE9ines, ce sont les composants",lol:"Le gold ach\xE8te l'item, mais sans les composants, l'item ne se construit pas.",lines:["Les calories donnent l'\xE9nergie pour construire. Les prot\xE9ines, c'est la mati\xE8re.","Sans elles, tu farmes du gold mais tu construis plus de gras que de muscle."],real:"Vise 1,6 \xE0 2 g de prot\xE9ines par kilo de poids et par jour. Au-del\xE0 de 2,2 g/kg, \xE7a n'apporte presque rien de plus. R\xE9partis-les sur la journ\xE9e : 20 \xE0 40 g par repas.",you:e=>`Ton objectif : ${e.prot} g par jour. Un shaker whey et lait en apporte une trentaine.`},{id:"sommeil",ic:"heart",n:"Le sommeil, c'est le recall",lol:"Tu ne r\xE9g\xE9n\xE8res pas tes PV en restant en lane. Tu recall.",lines:["La s\xE9ance casse le muscle. C'est pendant que tu dors qu'il se r\xE9pare et grossit.","Une nuit courte, c'est jouer low HP : moins de force, plus envie de sucre, moins de motivation."],real:"La plus grosse partie de l'hormone de croissance est lib\xE9r\xE9e pendant le sommeil profond, en d\xE9but de nuit. Vise 7 h 30 \xE0 9 h. Te coucher \xE0 heure fixe compte presque autant que la dur\xE9e.",you:e=>`Ton objectif : ${String(e.sleep).replace(".",",")} h. Le bouton \xAB Je pose le t\xE9l\xE9phone \xBB lance ton recall.`},{id:"surcharge",ic:"sword",n:"+1 rep, c'est ton scaling",lol:"Un champion qui ne monte pas de niveau se fait rouler dessus en late game.",lines:["M\xEAme charge, m\xEAmes reps pendant des mois : ton corps n'a aucune raison de changer.","+1 rep ou +2,5 kg d\xE8s que tu peux. Chaque petite marche, c'est un niveau."],real:"La r\xE8gle de ton programme : quand tu atteins le haut de la fourchette sur toutes les s\xE9ries, tu montes la charge. En attendant, tu cherches une rep de plus. Arr\xEAte chaque s\xE9rie \xE0 1 ou 2 reps de l'\xE9chec.",you:()=>"Dans l'Ar\xE8ne, chaque exercice t'affiche ton objectif +1 rep calcul\xE9 sur ta derni\xE8re s\xE9ance."},{id:"recup",ic:"hourglass",n:"Le repos, c'est le cooldown",lol:"Tu ne peux pas relancer ton ultime en boucle.",lines:["Un muscle travaill\xE9 a besoin d'environ 48 h pour r\xE9cup\xE9rer.","En full body 3 fois par semaine, ton sort recharge pile entre deux s\xE9ances.","Relancer trop t\xF4t : moins de d\xE9g\xE2ts, plus de risque de blessure."],real:"Un jour de repos entre deux s\xE9ances, c'est le bon rythme pour ton programme. Par exemple lundi, mercredi, vendredi."},{id:"regularite",ic:"flag",n:"Le farm bat les gros plays",lol:"Les meilleurs joueurs ne gagnent pas avec un pentakill par game. Ils gagnent en ne ratant aucun sbire.",lines:["3 200 kcal tous les jours valent mieux que 5 000 un jour puis 2 000 les trois suivants.","Le boss de la semaine compte tout : un jour rat\xE9 se rattrape un peu, jamais compl\xE8tement."],real:"Ton poids r\xE9agit \xE0 ta moyenne sur la semaine, pas \xE0 un repas \xE9norme."},{id:"pesee",ic:"crown",n:"La pes\xE9e, ce sont tes LP",lol:"Une d\xE9faite ne te fait pas descendre de division d'un coup. Un mauvais chiffre sur la balance non plus.",lines:["Ton poids bouge d'un kilo d'un jour \xE0 l'autre : eau, sel, repas de la veille.","C'est pour \xE7a que ton rang suit la moyenne de tes 3 derni\xE8res pes\xE9es."],real:"P\xE8se-toi toujours dans les m\xEAmes conditions : m\xEAme balance, m\xEAme moment de la journ\xE9e, avant de manger ou avant la s\xE9ance. Ce qui compte, c'est la tendance sur plusieurs semaines."},{id:"tilt",ic:"recall",n:"Le tilt",lol:"Une mauvaise teamfight ne perd pas la game. Le tilt qui suit, si.",lines:["Tu as rat\xE9 un repas ou une s\xE9ance ? Ce n'est pas grave.","Ce qui fait perdre, c'est de tout l\xE2cher apr\xE8s. Reprends au prochain camp."],real:"Une journ\xE9e rat\xE9e ne change rien \xE0 ton corps. Une semaine l\xE2ch\xE9e, oui."},{id:"lumiere",ic:"sun",n:"La lumi\xE8re du matin, c'est ta vision",lol:"Sans ward, tu joues dans le noir. Sans lumi\xE8re le matin, ton horloge aussi.",lines:["10 minutes dehors apr\xE8s le r\xE9veil disent \xE0 ton cerveau que la journ\xE9e commence.","Le soir, la fatigue arrive plus t\xF4t : c'est comme \xE7a qu'on avance son coucher sans forcer."],real:"La lumi\xE8re du jour est le signal le plus fort pour r\xE9gler l'horloge interne. M\xEAme par temps couvert, elle est bien plus forte que la lumi\xE8re d'une pi\xE8ce."},{id:"eau",ic:"potion",n:"L'eau, ce sont tes potions",lol:"Sans potions, tu ne tiens pas la lane.",lines:["La cr\xE9atine fait entrer de l'eau dans tes muscles : il faut boire assez.","D\xE9shydrat\xE9, tu perds de la force avant m\xEAme de le sentir."],real:"2 \xE0 3 litres par jour, plus quand il fait chaud ou que tu transpires. Urine jaune clair : tu es bien hydrat\xE9."}],Qd=["La cr\xE9atine, c'est un item \xE0 stacks : un jour rat\xE9 ne vide pas tout, mais chaque jour compte.","Un shaker whey et lait, c'est une trentaine de grammes de prot\xE9ines en 30 secondes.","Ton rang suit la moyenne de tes 3 derni\xE8res pes\xE9es : une mauvaise pes\xE9e ne te fait pas plonger.","Le boss de la semaine perd 1 PV par kcal. Un repas de 900 kcal, c'est un gros coup.","Le Flash sauve ta s\xE9rie une fois par semaine. Pas deux.","Trois heures sans manger : le camp est r\xE9apparu, va farm.","Vise le +1 rep, pas le record. C'est comme \xE7a que tu scales.","Une nuit sous 6 h, c'est jouer low HP toute la journ\xE9e.","10 minutes dehors le matin avancent ton heure de coucher.","Pas faim ? Les calories liquides passent mieux : lait entier, shaker, smoothie.","Un repas L\xE9gendaire : 900 kcal et 40 g de prot\xE9ines dans la m\xEAme assiette.","Chaque nouvel aliment rejoint ton Alimentdex. Varier, c'est aussi mieux farmer.","La journ\xE9e se gagne \xE0 90 % de ton objectif de calories.","Pentakill : calories, prot\xE9ines, sommeil, cr\xE9atine et s\xE9ance (ou posture) le m\xEAme jour.","Un bon early game : premier repas dans les 2 h apr\xE8s le r\xE9veil.","Tu as rat\xE9 un repas ? Ne tilte pas. Reprends au prochain camp.","Le sommeil, c'est le recall : c'est l\xE0 que le muscle se construit.","L'heure de la cr\xE9atine ne compte pas. Le tous les jours, si.","Ta mana de s\xE9ance d\xE9pend de ta nuit et de ton farm d'hier.","Toujours la m\xEAme balance, au m\xEAme moment : sinon tes LP mentent."],it={v:"8.0",n:"Le Reforge",date:"novembre 2026",intro:"Ton tracker devient une partie de League. Ta vraie vie, c'est la game : chaque repas se farme, chaque nuit est un recall, chaque pes\xE9e te fait gagner des LP. Tout est calcul\xE9 \xE0 partir de tes donn\xE9es : rien n'a \xE9t\xE9 perdu, ton historique a \xE9t\xE9 rejou\xE9.",sections:[{t:"La mana et les stacks (la vid\xE9o)",items:[["NOUVEAU","Barre de mana : l'\xE9nergie de tes muscles pour la s\xE9ance, remplie par ta nuit et ton farm."],["NOUVEAU","La cr\xE9atine monte ta mana max : jusqu'\xE0 +20 \xE0 28 stacks."],["NOUVEAU","Grille de 28 stacks. Un jour rat\xE9 = un stack perdu, comme dans tes muscles."],["NOUVEAU","Tous tes rituels deviennent des items \xE0 stacks, avec leur fiche fa\xE7on boutique."],["NOUVEAU","Objectif +1 rep sur chaque exercice, calcul\xE9 sur ta derni\xE8re s\xE9ance."],["NOUVEAU","Conseil de s\xE9ance selon ta mana : full mana, mana correcte ou low mana."],["NOUVEAU","Codex : la cr\xE9atine, les calories, le sommeil, les prot\xE9ines\u2026 expliqu\xE9s en LoL."]]},{t:"Farm",items:[["REFONTE","Les calories deviennent ton gold : le farm du jour, avec ta courbe et le rythme id\xE9al."],["NOUVEAU","Gold diff : ton avance ou ton retard sur le rythme, en direct."],["NOUVEAU","Phases de jeu : early, mid et late game, avec ce qu'il faut avoir farm\xE9 \xE0 la fin de chacune."],["NOUVEAU","Camp r\xE9apparu : \xE7a fait 3 h que tu n'as pas mang\xE9."],["NOUVEAU","CS du jour : le nombre de repas not\xE9s."],["NOUVEAU","Raret\xE9 des repas : Commun, Rare, \xC9pique, L\xE9gendaire."],["NOUVEAU","Build recommand\xE9 : les repas qui comblent pile ce qu'il te manque."],["NOUVEAU","Alimentdex : chaque nouvel aliment se d\xE9couvre, pour t'aider \xE0 varier."],["NOUVEAU","Vari\xE9t\xE9 de la semaine : le nombre d'aliments diff\xE9rents."],["BUFF","\xAB +X gold \xBB et un petit son \xE0 chaque repas ajout\xE9."]]},{t:"La partie du jour",items:[["NOUVEAU","5 objectifs = 5 kills : First blood, Double kill\u2026 jusqu'au Pentakill."],["NOUVEAU","Note de la journ\xE9e, de D \xE0 S+."],["NOUVEAU","Victoire \xE0 90 % de tes calories, et ton winrate sur 30 jours."],["NOUVEAU","\xC9cran de fin de partie quand tu poses le t\xE9l\xE9phone : victoire ou d\xE9faite."],["NOUVEAU","R\xE9cap de mort : ce qui t'a fait perdre la journ\xE9e, sans filtre."],["NOUVEAU","Historique des parties
