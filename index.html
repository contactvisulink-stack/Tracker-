<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Isma Daily"/>
<meta name="theme-color" content="#080812"/>
<title>Isma Daily</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>/* ─────────────────────────────────────────────────────────────
   Isma Daily · v3 « Focus »
   Trois couleurs = trois objectifs : soleil (calories),
   chair (protéines), lune (sommeil). Le reste reste calme.
   ───────────────────────────────────────────────────────────── */
:root {
  --ink: #0A0B15;
  --ink2: #11131F;
  --ink3: #181B2B;
  --ink4: #22263C;
  --line: rgba(255, 255, 255, .065);
  --line-2: rgba(255, 255, 255, .12);
  --tx: #F4EFE6;
  --mu: #A19DB1;
  --dim: #66627A;
  --sun: #F6A623;
  --flesh: #FF6E5E;
  --moon: #A99BFF;
  --sky: #6CB8FF;
  --up: #7BE0A0;
  --down: #FF8A7A;
  --fd: 'Syne', system-ui, -apple-system, sans-serif;
  --fb: 'DM Sans', system-ui, -apple-system, sans-serif;
  --safe-b: env(safe-area-inset-bottom);
  --safe-t: env(safe-area-inset-top);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--ink); color: var(--tx); font-family: var(--fb); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; overflow-x: hidden; }
body { min-height: 100vh; min-height: 100dvh; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:disabled { cursor: default; }
input, textarea, select { color-scheme: dark; }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; border-radius: 8px; }
::-webkit-scrollbar { width: 0; height: 0; }
b, strong { font-weight: 600; }
h1, h2, h3 { font-weight: inherit; font-size: inherit; }

/* ── Ambiance qui suit l'heure ── */
.app { position: relative; min-height: 100dvh; padding-top: var(--safe-t); padding-bottom: calc(104px + var(--safe-b)); }
.ambient { position: fixed; inset: 0 0 auto 0; height: 560px; z-index: 0; pointer-events: none; transition: background 1.2s ease; }
.amb-dawn .ambient { background: radial-gradient(70% 55% at 50% -6%, rgba(255, 168, 92, .30), transparent 70%), radial-gradient(45% 40% at 90% 10%, rgba(255, 110, 94, .14), transparent 70%); }
.amb-day .ambient { background: radial-gradient(70% 55% at 50% -6%, rgba(246, 166, 35, .20), transparent 70%), radial-gradient(45% 40% at 10% 12%, rgba(108, 184, 255, .10), transparent 70%); }
.amb-dusk .ambient { background: radial-gradient(70% 55% at 50% -6%, rgba(255, 110, 94, .20), transparent 70%), radial-gradient(50% 45% at 85% 15%, rgba(169, 155, 255, .18), transparent 70%); }
.amb-night .ambient { background: radial-gradient(70% 55% at 50% -6%, rgba(169, 155, 255, .20), transparent 70%), radial-gradient(50% 45% at 12% 18%, rgba(60, 64, 160, .20), transparent 70%); }

/* ── En-tête ── */
.top { position: relative; z-index: 2; max-width: 480px; margin: 0 auto; padding: 18px 16px 6px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.top-t { font-family: var(--fd); font-weight: 800; font-size: 27px; letter-spacing: -.6px; line-height: 1.05; }
.top-d { color: var(--mu); font-size: 14px; margin-top: 4px; }
.top-r { display: flex; align-items: center; gap: 8px; padding-top: 2px; }
.streak { font-family: var(--fd); font-weight: 700; font-size: 14px; padding: 7px 11px; border-radius: 99px; background: rgba(246, 166, 35, .13); color: var(--sun); white-space: nowrap; }
.round-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .06); color: var(--tx); flex-shrink: 0; transition: transform .12s, background .2s; }
.round-btn:active { transform: scale(.92); }
.round-btn:disabled { opacity: .3; }

.main { position: relative; z-index: 1; animation: pageIn .22s ease both; }
@keyframes pageIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.page { max-width: 480px; margin: 0 auto; padding: 8px 16px 0; }

/* ── Le viseur ── */
.hero { display: flex; flex-direction: column; align-items: center; padding: 6px 0 4px; }
.reticle { position: relative; display: grid; place-items: center; }
.reticle svg { overflow: visible; }
.ring-arc { transition: stroke-dashoffset 1.15s cubic-bezier(.22, 1, .36, 1); }
.ring-arc.full { filter: drop-shadow(0 0 3px var(--glow)); }
.reticle-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; }
.rc-big { font-family: var(--fd); font-weight: 800; font-size: 38px; letter-spacing: -1px; line-height: 1; font-variant-numeric: tabular-nums; }
.rc-big.long { font-size: 31px; }
.rc-sub { color: var(--mu); font-size: 12.5px; margin-top: 5px; line-height: 1.25; }
.rc-moon { font-size: 34px; line-height: 1; }
.bull-txt { font-size: 21px; letter-spacing: -.3px; max-width: 96px; line-height: 1.1; color: #fff4d6; }
.reticle.bull::after { content: ""; position: absolute; width: 74px; height: 74px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 236, 190, .22), transparent 70%); animation: bull 2.6s ease-in-out infinite; }
@keyframes bull { 0%, 100% { transform: scale(.9); opacity: .6; } 50% { transform: scale(1.12); opacity: 1; } }

.legend { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; margin-top: 14px; }
.lg { display: grid; grid-template-columns: auto 1fr; column-gap: 7px; align-items: center; text-align: left; padding: 10px 10px 9px; border-radius: 16px; transition: background .2s; }
.lg:active { background: rgba(255, 255, 255, .05); }
.lg-dot { width: 8px; height: 8px; border-radius: 50%; }
.lg-l { font-size: 12.5px; color: var(--mu); }
.lg-v { grid-column: 1 / -1; font-family: var(--fd); font-weight: 700; font-size: 19px; margin-top: 3px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lg-g { grid-column: 1 / -1; font-size: 11.5px; color: var(--dim); }
.pace { margin-top: 8px; font-size: 13.5px; padding: 7px 14px; border-radius: 99px; }
.pace.good { color: var(--up); background: rgba(123, 224, 160, .08); }
.pace.late { color: var(--sun); background: rgba(246, 166, 35, .09); }

/* ── Maintenant ── */
.now { --acc: var(--sun); position: relative; margin: 18px 0 8px; padding: 18px 18px 16px; border-radius: 26px; background: linear-gradient(180deg, rgba(255, 255, 255, .055), rgba(255, 255, 255, .02)); border: 1px solid var(--line-2); box-shadow: 0 18px 40px -20px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(255, 255, 255, .05); overflow: hidden; }
.now::before { content: ""; position: absolute; left: 0; top: 18px; bottom: 18px; width: 3px; border-radius: 0 3px 3px 0; background: var(--acc); }
.tone-moon { --acc: var(--moon); } .tone-flesh { --acc: var(--flesh); } .tone-sky { --acc: var(--sky); } .tone-sun { --acc: var(--sun); }
.now-kicker { font-size: 13px; font-weight: 600; color: var(--acc); margin-bottom: 8px; }
.now-main { display: flex; gap: 13px; align-items: flex-start; }
.now-ic { font-size: 30px; line-height: 1; margin-top: 2px; }
.now-title { font-family: var(--fd); font-weight: 800; font-size: 22px; letter-spacing: -.4px; line-height: 1.15; }
.now-text { color: var(--mu); font-size: 14px; margin-top: 4px; }
.now .cta-row, .now .cta-col, .now > .cta { margin-top: 16px; }
.then { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.then-l { font-size: 12.5px; color: var(--dim); margin-right: 2px; }
.then-i { font-size: 13px; color: var(--tx); padding: 6px 11px; border-radius: 99px; background: rgba(255, 255, 255, .06); transition: transform .12s; }
.then-i:active { transform: scale(.95); }

/* ── Boutons d'action ── */
.cta { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 12px 18px; border-radius: 17px; font-family: var(--fd); font-weight: 700; font-size: 15.5px; letter-spacing: -.1px; transition: transform .12s ease, filter .2s, opacity .2s; width: 100%; }
.cta:active { transform: scale(.97); }
.cta:disabled { opacity: .4; }
.cta.sun { background: var(--sun); color: #1E1200; }
.cta.moon { background: var(--moon); color: #140C38; }
.cta.flesh { background: var(--flesh); color: #2B0803; }
.cta.sky { background: var(--sky); color: #03162B; }
.cta.ghost { background: rgba(255, 255, 255, .05); color: var(--tx); border: 1px solid var(--line-2); font-weight: 600; }
.cta.full { width: 100%; }
.cta.shrink { width: auto; flex: 0 0 auto; }
.cta-sub { margin-left: auto; font-family: var(--fb); font-weight: 600; font-size: 13.5px; opacity: .72; white-space: nowrap; }
.cta.sun:has(.cta-sub), .cta.flesh:has(.cta-sub) { justify-content: space-between; text-align: left; }
.cta-row { display: flex; gap: 10px; }
.cta-row > * { flex: 1; }
.cta-col { display: grid; gap: 9px; }
.big-inp { font-family: var(--fd); font-weight: 700; font-size: 20px !important; text-align: center; }

/* ── Blocs ── */
.block { margin: 22px 0 6px; }
.block-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 11px; }
.block-head h3 { font-family: var(--fd); font-weight: 700; font-size: 18px; letter-spacing: -.3px; }
.count { font-family: var(--fd); font-weight: 700; color: var(--mu); font-size: 14px; }
.panel { background: var(--ink2); border: 1px solid var(--line); border-radius: 24px; padding: 18px; margin-bottom: 12px; }
.panel.glow-sky { border-color: rgba(108, 184, 255, .4); box-shadow: 0 0 0 4px rgba(108, 184, 255, .06); }
.panel-t { font-family: var(--fd); font-weight: 700; font-size: 18px; letter-spacing: -.3px; margin-bottom: 10px; }
.hint { color: var(--dim); font-size: 12.5px; line-height: 1.5; margin-top: 10px; }
.muted { color: var(--mu); }
.small { font-size: 12.5px; }
.center { text-align: center; }
.insight-line { text-align: center; color: var(--mu); font-size: 14px; margin: 22px 8px 8px; }
.insight-line.left { text-align: left; margin: 2px 2px 14px; }
.link { color: var(--sun); font-size: 14px; font-weight: 600; padding: 2px 0; }
.link.small { font-size: 12.5px; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.mt6 { margin-top: 6px; } .mt8 { margin-top: 8px; } .mt10 { margin-top: 10px; } .mt14 { margin-top: 14px; } .mt18 { margin-top: 18px; }
.mb10 { margin-bottom: 10px; } .mb18 { margin-bottom: 18px; }

/* ── Missions ── */
.tiles6 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; min-height: 98px; padding: 12px; border-radius: 20px; background: var(--ink2); border: 1px solid var(--line); text-align: left; transition: transform .14s ease, background .25s, border-color .25s; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.tile:active { transform: scale(.95); }
.tile.static:active { transform: none; }
.tile-ic { font-size: 23px; line-height: 1; margin-bottom: auto; position: relative; }
.tile-l { position: relative; font-weight: 600; font-size: 14px; margin-top: 10px; }
.tile-s { position: relative; font-size: 11.5px; color: var(--mu); margin-top: 1px; }
.tile.on { background: rgba(246, 166, 35, .1); border-color: rgba(246, 166, 35, .32); }
.tile.on .tile-l { color: #FFE2AE; }
.tile-ok { position: absolute; top: 10px; right: 10px; width: 22px; height: 22px; border-radius: 50%; background: var(--sun); color: #1E1200; display: grid; place-items: center; animation: pop .32s cubic-bezier(.34, 1.56, .64, 1); }
@keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
.tile-fill { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(0deg, rgba(108, 184, 255, .26), rgba(108, 184, 255, .1)); transition: height .5s cubic-bezier(.22, 1, .36, 1); }
.tile.on .tile-fill { background: linear-gradient(0deg, rgba(108, 184, 255, .3), rgba(108, 184, 255, .14)); }

/* ── Semaine ── */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0 7px; border-radius: 14px; }
.wd.today { background: rgba(255, 255, 255, .06); }
.wd:disabled { opacity: .35; }
.wd-l { font-size: 12px; color: var(--mu); text-transform: uppercase; }
.wd.today .wd-l { color: var(--tx); font-weight: 700; }
.wd-empty { width: 34px; height: 34px; border-radius: 50%; border: 1.5px dashed var(--line-2); }

/* ── Barres avec repère ── */
.pbar { margin-bottom: 14px; }
.pbar-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; font-size: 14px; color: var(--mu); }
.pbar-val { color: var(--mu); font-size: 13px; }
.pbar-val b { font-family: var(--fd); color: var(--tx); font-size: 18px; font-weight: 700; }
.pbar-track { position: relative; height: 10px; border-radius: 99px; background: rgba(255, 255, 255, .07); }
.pbar-fill { height: 100%; border-radius: 99px; transition: width .9s cubic-bezier(.22, 1, .36, 1); }
.pbar-mark { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; border-radius: 2px; background: #fff; box-shadow: 0 0 0 2px var(--ink2); }
.macro-row { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--mu); }
.macro-row b { color: var(--tx); }

/* ── Manger : jour + frise ── */
.daynav { display: flex; align-items: center; gap: 12px; margin: 4px 0 14px; }
.daynav-l { flex: 1; text-align: center; }
.daynav-t { font-family: var(--fd); font-weight: 700; font-size: 18px; }
.timeline { position: relative; margin: 6px 0 14px; }
.tl-row { display: grid; grid-template-columns: 46px 14px 1fr; align-items: start; position: relative; }
.tl-row::before { content: ""; position: absolute; left: 52px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.tl-row:first-child::before { top: 22px; }
.tl-row:last-child::before { bottom: calc(100% - 22px); }
.tl-time { font-family: var(--fd); font-weight: 700; font-size: 13px; color: var(--mu); padding-top: 15px; font-variant-numeric: tabular-nums; }
.tl-dot { position: relative; z-index: 1; width: 12px; height: 12px; margin-top: 17px; border-radius: 50%; background: var(--ink); border: 2.5px solid var(--sun); }
.tl-card { margin: 0 0 10px 8px; background: var(--ink2); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.tl-row.open .tl-card { border-color: var(--line-2); }
.tl-head { display: flex; justify-content: space-between; gap: 12px; width: 100%; text-align: left; padding: 13px 15px; }
.tl-main { min-width: 0; }
.tl-title { font-family: var(--fd); font-weight: 700; font-size: 15.5px; }
.tl-items { font-size: 12.5px; color: var(--mu); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tl-kcal { text-align: right; flex-shrink: 0; display: flex; flex-direction: column; }
.tl-kcal b { font-family: var(--fd); font-weight: 800; font-size: 18px; color: var(--sun); }
.tl-kcal span { font-size: 12px; color: var(--mu); }
.tl-body { padding: 4px 15px 14px; border-top: 1px solid var(--line); }
.tl-body .grid2 { margin-top: 12px; }
.wide-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; border-radius: 17px; background: rgba(246, 166, 35, .12); color: var(--sun); font-family: var(--fd); font-weight: 700; margin-bottom: 10px; }
.wide-btn.ghost { background: rgba(255, 255, 255, .04); color: var(--tx); font-family: var(--fb); font-weight: 600; }

/* ── Aliments ── */
.items { margin: 8px 0 10px; }
.item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: none; }
.item-main { flex: 1; min-width: 0; }
.item-name { font-size: 14.5px; font-weight: 500; }
.item-sub { font-size: 12.5px; color: var(--mu); margin-top: 1px; }
.item.missing .gram { border-color: var(--flesh); }
.warn-txt { color: var(--sun); font-size: 12.5px; margin-top: 3px; }
.gram { display: flex; align-items: center; gap: 4px; height: 42px; padding: 0 11px; border-radius: 13px; background: rgba(255, 255, 255, .06); border: 1px solid var(--line-2); flex-shrink: 0; }
.gram input { width: 54px; background: none; border: none; outline: none; text-align: right; font-family: var(--fd); font-weight: 700; font-size: 16px; }
.gram span { color: var(--mu); font-size: 12.5px; }
.gram.wide { width: 100%; }
.gram.wide input { width: 100%; text-align: left; }
.x-btn { width: 32px; height: 32px; border-radius: 50%; background: rgba(255, 110, 94, .12); color: var(--flesh); display: grid; place-items: center; flex-shrink: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 13px; border-radius: 99px; background: rgba(255, 255, 255, .06); font-size: 13.5px; font-weight: 500; text-decoration: none; transition: transform .12s; }
.chip:active { transform: scale(.95); }
.chip.on { background: rgba(246, 166, 35, .16); color: var(--sun); }
.chip.danger { color: var(--down); }
.tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; margin-left: 7px; vertical-align: 1px; background: rgba(255, 255, 255, .07); color: var(--mu); }
.tag.ok { background: rgba(123, 224, 160, .12); color: var(--up); }
.tag.ia { background: rgba(169, 155, 255, .14); color: var(--moon); }
.tag.new { background: rgba(246, 166, 35, .15); color: var(--sun); }
.tag.warn { background: rgba(255, 110, 94, .14); color: var(--flesh); }
.tag.sun { background: rgba(246, 166, 35, .15); color: var(--sun); }
.unmatched { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 13.5px; padding: 10px 13px; margin: 8px 0; border-radius: 14px; background: rgba(255, 110, 94, .08); border: 1px solid rgba(255, 110, 94, .25); }
.unmatched span { flex: 1; min-width: 150px; }
.list-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; padding: 12px 0; border-bottom: 1px solid var(--line); }
.list-row:last-child { border-bottom: none; }
.nm { font-size: 14.5px; font-weight: 600; }
.row-l { display: flex; align-items: center; gap: 12px; }
.plus-dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: rgba(246, 166, 35, .14); color: var(--sun); flex-shrink: 0; }

/* ── Ajout rapide ── */
.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 4px; border-radius: 16px; background: rgba(255, 255, 255, .045); margin-bottom: 14px; }
.modes button { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 4px; border-radius: 12px; font-size: 14px; font-weight: 600; color: var(--mu); }
.modes button.on { background: var(--ink4); color: var(--tx); box-shadow: 0 2px 8px rgba(0, 0, 0, .3); }
.composer-box { display: grid; gap: 10px; }
.sub-h { font-size: 13.5px; font-weight: 600; color: var(--mu); margin: 18px 0 9px; }
.hscroll { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 16px; margin: 0 -16px; padding: 0 16px 4px; }
.fav { flex: 0 0 172px; scroll-snap-align: start; display: flex; flex-direction: column; border-radius: 20px; background: var(--ink3); border: 1px solid var(--line-2); overflow: hidden; }
.fav-main { display: flex; flex-direction: column; justify-content: space-between; gap: 10px; min-height: 92px; padding: 13px 14px 10px; text-align: left; transition: background .2s; }
.fav-main:active { background: rgba(246, 166, 35, .12); }
.fav-n { font-family: var(--fd); font-weight: 700; font-size: 14.5px; line-height: 1.2; }
.fav-k { font-size: 12.5px; color: var(--mu); }
.fav-k b { font-family: var(--fd); color: var(--sun); font-size: 16px; }
.fav-adj { padding: 9px 14px; border-top: 1px solid var(--line); text-align: left; font-size: 12.5px; font-weight: 600; color: var(--mu); }
.recent { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.recent:last-child { border-bottom: none; }
.recent-main { flex: 1; min-width: 0; text-align: left; }
.recent-n { display: block; font-weight: 600; font-size: 14.5px; }
.recent-i { display: block; font-size: 12.5px; color: var(--mu); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.recent-r { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0; }
.recent-r b { font-family: var(--fd); color: var(--sun); }
.total-line { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.total-line b { font-family: var(--fd); font-size: 22px; color: var(--sun); }
.field { display: block; margin-bottom: 12px; }
.field > span { display: block; font-size: 13px; color: var(--mu); margin-bottom: 6px; }
.inp { width: 100%; background: rgba(255, 255, 255, .06); border: 1px solid var(--line-2); border-radius: 14px; padding: 12px 13px; outline: none; font-size: 16px; transition: border-color .2s; }
textarea.inp { resize: none; line-height: 1.5; }
.inp:focus { border-color: rgba(246, 166, 35, .55); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.err { color: #FFB3A9; background: rgba(255, 110, 94, .1); border: 1px solid rgba(255, 110, 94, .28); border-radius: 14px; padding: 11px 13px; font-size: 13.5px; margin: 10px 0; }
.note { background: rgba(255, 255, 255, .055); border-radius: 14px; padding: 11px 13px; font-size: 13.5px; margin-bottom: 10px; }
.loading { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 20px; color: var(--mu); }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .2); border-top-color: currentColor; animation: spin .8s linear infinite; display: inline-block; }
.loading .spinner { border-top-color: var(--sun); }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { text-align: center; padding: 34px 16px; }
.empty-t { font-family: var(--fd); font-weight: 700; font-size: 17px; margin-bottom: 4px; }

/* ── Sport ── */
.wk-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 16px 0; }
.wk-c { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.wk-l { font-size: 12px; color: var(--mu); text-transform: uppercase; }
.wk-d { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: rgba(255, 255, 255, .05); font-family: var(--fd); font-weight: 800; font-size: 13px; }
.wk-d.on { background: var(--sun); color: #1E1200; }
.wk-d.today { box-shadow: 0 0 0 2px var(--ink2), 0 0 0 3.5px rgba(255, 255, 255, .35); }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 17px; background: rgba(255, 255, 255, .045); margin: 4px 0 14px; }
.seg button { flex: 1; padding: 10px 4px; border-radius: 13px; font-family: var(--fd); font-weight: 700; font-size: 14px; color: var(--mu); line-height: 1.15; }
.seg button.on { background: var(--ink4); color: var(--tx); box-shadow: 0 2px 8px rgba(0, 0, 0, .35); }
.seg button small { display: block; font-family: var(--fb); font-weight: 600; font-size: 10.5px; color: var(--sun); }
.seg.small { background: none; padding: 0; gap: 8px; justify-content: flex-start; }
.seg.small button { flex: 0 0 auto; padding: 7px 14px; font-family: var(--fb); font-weight: 600; font-size: 13.5px; border-radius: 99px; background: rgba(255, 255, 255, .05); }
.seg.small button.on { background: rgba(246, 166, 35, .16); color: var(--sun); box-shadow: none; }
.ex-list { display: grid; gap: 10px; }
.ex { --acc: var(--mu); background: var(--ink2); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.ex.up { --acc: var(--up); } .ex.hold { --acc: var(--sun); } .ex.new { --acc: var(--sky); }
.ex-head { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 14px 15px; }
.ex-main { flex: 1; min-width: 0; }
.ex-name { font-size: 14px; color: var(--mu); font-weight: 500; }
.ex-target { font-family: var(--fd); font-weight: 800; font-size: 19px; letter-spacing: -.3px; color: var(--acc); margin-top: 2px; }
.ex-sub { font-size: 12px; color: var(--dim); margin-top: 2px; }
.ex-body { padding: 2px 15px 15px; border-top: 1px solid var(--line); }
.ex-why { font-size: 13.5px; margin: 12px 0 8px; }
.cues { list-style: none; margin: 10px 0 4px; }
.cues li { position: relative; padding-left: 16px; font-size: 13.5px; margin-bottom: 6px; }
.cues li::before { content: ""; position: absolute; left: 2px; top: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--acc); }
.hist-row { display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.hist-row:last-child { border-bottom: none; }
.hist-row > span:first-child { color: var(--mu); }
.hist-row > span:last-child { text-align: right; white-space: pre; font-variant-numeric: tabular-nums; }
.rules { list-style: none; display: grid; gap: 8px; }
.rules li { font-size: 14px; padding: 12px 14px; border-radius: 16px; background: var(--ink2); border: 1px solid var(--line); }
.wrow { border-bottom: 1px solid var(--line); }
.wrow:last-of-type { border-bottom: none; }
.wrow-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 11px 0; }
.wrow-body { padding-bottom: 12px; }
.chart { display: block; width: 100%; height: auto; overflow: visible; }

/* ── Poids & stats ── */
.w-hero { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 14px; }
.w-big { font-family: var(--fd); font-weight: 800; font-size: 46px; letter-spacing: -1.5px; line-height: 1; }
.w-big span { font-size: 16px; color: var(--mu); font-weight: 600; letter-spacing: 0; }
.w-goal { text-align: right; }
.w-goal-v { font-family: var(--fd); font-weight: 700; font-size: 22px; color: var(--sun); }
.w-ok { font-family: var(--fd); font-weight: 700; font-size: 22px; color: var(--up); }
.up-txt { color: var(--up); font-size: 12.5px; }
.down-txt { color: var(--down); font-size: 12.5px; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.stat { background: var(--ink2); border: 1px solid var(--line); border-radius: 20px; padding: 14px 15px; }
.stat-v { font-family: var(--fd); font-weight: 800; font-size: 25px; letter-spacing: -.5px; line-height: 1.1; }
.stat-v small { font-family: var(--fb); font-weight: 500; font-size: 13px; color: var(--mu); letter-spacing: 0; }
.stat-l { font-size: 12.5px; color: var(--mu); margin-top: 4px; line-height: 1.35; }

/* ── Sommeil ── */
.energy { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.energy button { height: 50px; border-radius: 15px; background: rgba(255, 255, 255, .05); font-size: 22px; opacity: .5; transition: all .15s; }
.energy button.on { opacity: 1; background: rgba(169, 155, 255, .18); box-shadow: inset 0 0 0 1.5px var(--moon); }

/* ── Panneaux ── */
.sheet-wrap { position: fixed; inset: 0; z-index: 200; display: flex; align-items: flex-end; justify-content: center; background: rgba(3, 3, 10, .62); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); animation: fadeIn .2s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.sheet { width: 100%; max-width: 520px; max-height: calc(100dvh - var(--safe-t) - 24px); display: flex; flex-direction: column; background: #12141F; border: 1px solid var(--line-2); border-bottom: none; border-radius: 28px 28px 0 0; animation: rise .32s cubic-bezier(.22, 1, .36, 1); transition: transform .25s ease; box-shadow: 0 -20px 60px rgba(0, 0, 0, .5); }
.sheet.tall { height: calc(100dvh - var(--safe-t) - 24px); }
@keyframes rise { from { transform: translateY(100%); } to { transform: none; } }
.sheet-head { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 22px 16px 12px; touch-action: none; }
.handle { position: absolute; top: 8px; left: 50%; width: 40px; height: 5px; margin-left: -20px; border-radius: 99px; background: rgba(255, 255, 255, .18); }
.sheet-title { font-family: var(--fd); font-weight: 800; font-size: 20px; letter-spacing: -.3px; }
.sheet-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 4px 16px 18px; }
.sheet-foot { padding: 12px 16px calc(12px + var(--safe-b)); border-top: 1px solid var(--line); background: #12141F; }
.toggle { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 12px 0; font-size: 15px; }
.sw { width: 50px; height: 30px; border-radius: 99px; background: rgba(255, 255, 255, .12); position: relative; transition: background .2s; }
.sw i { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
.toggle.on .sw { background: var(--sun); }
.toggle.on .sw i { transform: translateX(20px); }

/* ── Coach ── */
.coach-empty { display: grid; gap: 8px; margin-bottom: 8px; }
.sugg { text-align: left; padding: 13px 15px; border-radius: 16px; background: rgba(255, 255, 255, .05); font-size: 14px; }
.chat { display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 88%; padding: 11px 14px; border-radius: 19px; font-size: 14.5px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; background: rgba(246, 166, 35, .16); border-bottom-right-radius: 6px; }
.msg.assistant { align-self: flex-start; background: rgba(255, 255, 255, .06); border-bottom-left-radius: 6px; }
.msg.err { color: #FFB3A9; background: rgba(255, 110, 94, .1); }
.typing { display: flex; gap: 5px; padding: 15px 16px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--sun); animation: dots .9s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes dots { 0%, 100% { transform: translateY(0); opacity: .5; } 50% { transform: translateY(-4px); opacity: 1; } }
.composer { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1; min-height: 48px; max-height: 120px; }
.send { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--sun); color: #1E1200; flex-shrink: 0; }
.send:disabled { background: rgba(255, 255, 255, .07); color: var(--dim); }

/* ── Barre du bas ── */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 100; padding: 0 12px calc(10px + var(--safe-b)); pointer-events: none; }
.nav-in { pointer-events: auto; max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr 74px 1fr 1fr; align-items: end; padding: 6px 6px 7px; border-radius: 26px; background: rgba(14, 15, 26, .9); border: 1px solid var(--line-2); backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%); box-shadow: 0 10px 40px rgba(0, 0, 0, .55); }
.nb { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0 4px; border-radius: 16px; color: var(--dim); font-size: 11px; font-weight: 600; transition: color .2s; }
.nb.on { color: var(--sun); }
.nb:active { transform: scale(.94); }
.fab { justify-self: center; width: 60px; height: 60px; margin-top: -26px; border-radius: 50%; display: grid; place-items: center; background: var(--sun); color: #1E1200; box-shadow: 0 8px 26px rgba(246, 166, 35, .45), 0 0 0 5px var(--ink); transition: transform .14s ease; }
.fab:active { transform: scale(.9) rotate(90deg); }

/* ── Retours visuels ── */
.toast { position: fixed; left: 50%; bottom: calc(104px + var(--safe-b)); transform: translateX(-50%); z-index: 300; display: flex; align-items: center; gap: 14px; max-width: calc(100% - 28px); width: max-content; padding: 11px 12px 11px 16px; border-radius: 18px; background: #23263A; border: 1px solid var(--line-2); box-shadow: 0 12px 34px rgba(0, 0, 0, .55); font-size: 14px; animation: toastIn .28s cubic-bezier(.22, 1, .36, 1); }
.toast.top { top: calc(14px + var(--safe-t)); bottom: auto; }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
.toast-undo { color: var(--sun); font-weight: 700; padding: 6px 10px; border-radius: 10px; background: rgba(246, 166, 35, .12); white-space: nowrap; }
.cel { position: fixed; left: 50%; top: calc(18px + var(--safe-t)); z-index: 310; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 10px 18px 10px 12px; border-radius: 99px; background: #23263A; border: 1px solid rgba(246, 166, 35, .4); font-family: var(--fd); font-weight: 700; font-size: 15px; box-shadow: 0 12px 40px rgba(246, 166, 35, .18); animation: celIn .5s cubic-bezier(.34, 1.56, .64, 1); white-space: nowrap; }
.cel-ic { font-size: 22px; }
.cel.big { padding: 13px 22px 13px 16px; font-size: 18px; background: linear-gradient(135deg, #3A2A0A, #2A1F4A); border-color: rgba(255, 228, 170, .5); }
@keyframes celIn { from { opacity: 0; transform: translate(-50%, -16px) scale(.85); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
.confetti { position: fixed; z-index: 305; width: 0; height: 0; pointer-events: none; }
.confetti i { position: absolute; left: 0; top: 0; border-radius: 2px; animation: fly 1.4s cubic-bezier(.2, .7, .4, 1) forwards; }
@keyframes fly {
  0% { transform: translate(0, 0) rotate(0); opacity: 1; }
  55% { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 1; }
  100% { transform: translate(calc(var(--x) * 1.15), calc(var(--y) + 280px)) rotate(calc(var(--r) * 1.6)); opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}
@media (min-width: 520px) {
  .tiles6 { grid-template-columns: repeat(3, 1fr); }
}
