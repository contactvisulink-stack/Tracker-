<style>/* ─────────────────────────────────────────────────────────────
   Isma Daily · patch 8 « Le Reforge »
   Thème Hextech : fond abysse, cadres dorés, mana bleue, cyan hextech.
   Cinzel : les noms du jeu (rangs, boss, annonces, résultats).
   Barlow Semi Condensed : chiffres, titres de section, boutons.
   Barlow : le texte courant.
   ───────────────────────────────────────────────────────────── */
:root {
  --abyss: #010A13;
  --navy: #0A1428;
  --gold-1: #F0E6D2;
  --gold-2: #C8AA6E;
  --gold-3: #C89B3C;
  --gold-4: #785A28;
  --hex-1: #CDFAFA;
  --hex-2: #0AC8B9;
  --hex-3: #0397AB;
  --hp: #3DD68C;
  --red: #E84057;
  --flesh: #FF8A3D;
  --purple: #B97CFF;
  --tx: #ECE5D6;
  --mu: #A09B8C;
  --dim: #6E6A61;
  --line: rgba(200, 170, 110, .16);
  --line-2: rgba(200, 170, 110, .34);
  --panel-bg: linear-gradient(180deg, rgba(12, 27, 45, .94), rgba(5, 13, 24, .96));
  --frame-bd: linear-gradient(180deg, rgba(240, 230, 210, .75), rgba(200, 170, 110, .55) 30%, rgba(120, 90, 40, .35) 70%, rgba(200, 170, 110, .45));
  --goldbar: linear-gradient(90deg, #B48934, #E6C26A 55%, #FFF1C4);
  --glow-a: rgba(10, 200, 185, .10);
  --glow-b: rgba(200, 170, 110, .08);
  --bevel: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
  --bevel8: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px);
  --bevel8i: polygon(7.3px 0, calc(100% - 7.3px) 0, 100% 7.3px, 100% calc(100% - 7.3px), calc(100% - 7.3px) 100%, 7.3px 100%, 0 calc(100% - 7.3px), 0 7.3px);
  --hexa: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  /* anciens noms, encore utilisés par quelques composants */
  --sun: var(--gold-2); --moon: #7FA7FF; --sky: var(--hex-2); --up: #3DD68C; --down: #E84057; --amber: #F0B84A; --ink: #010A13; --mint: #3DD68C;
  --fd: 'Cinzel', Georgia, serif;
  --fx: 'Barlow Semi Condensed', 'Barlow', -apple-system, system-ui, sans-serif;
  --fb: 'Barlow', -apple-system, system-ui, sans-serif;
  --safe-b: env(safe-area-inset-bottom);
  --safe-t: env(safe-area-inset-top);
}
/* ── Skins ── */
.skin-neon { --abyss: #03050D; --navy: #0B1233; --gold-1: #F3F0FF; --gold-2: #A89BFF; --gold-3: #FF5FD2; --gold-4: #4C3AA8; --hex-1: #D6E6FF; --hex-2: #4F8DFF; --hex-3: #3A6CE0; --glow-a: rgba(79, 141, 255, .16); --glow-b: rgba(255, 95, 210, .1); --line: rgba(168, 155, 255, .16); --line-2: rgba(168, 155, 255, .34); --frame-bd: linear-gradient(120deg, #4F8DFF, #9B6BFF 55%, #FF5FD2); }
.skin-infernal { --abyss: #0E0405; --navy: #26080A; --gold-1: #FFE8D6; --gold-2: #F09A5C; --gold-3: #FF6A3D; --gold-4: #8A2E14; --hex-1: #FFE7B8; --hex-2: #FFB547; --hex-3: #E07B1A; --glow-a: rgba(255, 106, 61, .16); --glow-b: rgba(255, 181, 71, .08); --line: rgba(240, 154, 92, .16); --line-2: rgba(240, 154, 92, .36); --frame-bd: linear-gradient(180deg, #FFD3A8, #F09A5C 35%, #7A2410); }
.skin-abysse { --abyss: #00090E; --navy: #002230; --gold-1: #DDFBF7; --gold-2: #7FD8D0; --gold-3: #3FE0C8; --gold-4: #1B5E66; --hex-1: #D2EEFF; --hex-2: #2FB7FF; --hex-3: #1A86C7; --glow-a: rgba(47, 183, 255, .16); --glow-b: rgba(63, 224, 200, .1); --line: rgba(127, 216, 208, .16); --line-2: rgba(127, 216, 208, .34); --frame-bd: linear-gradient(180deg, #DDFBF7, #7FD8D0 40%, #1B5E66); }
.skin-prestige { --abyss: #07070A; --navy: #16151C; --gold-1: #FFFFFF; --gold-2: #EADCB8; --gold-3: #FFF4D2; --gold-4: #8C7A4E; --hex-1: #FFF6DE; --hex-2: #E8C66A; --hex-3: #C9A440; --glow-a: rgba(255, 244, 210, .1); --glow-b: rgba(232, 198, 106, .1); --frame-bd: linear-gradient(180deg, #FFFFFF, #EADCB8 40%, #8C7A4E); }
.skin-challenger { --abyss: #020A1C; --navy: #0A1C3F; --gold-1: #FFF8E1; --gold-2: #FFE7A0; --gold-3: #FFD25A; --gold-4: #9C7A22; --hex-1: #D8ECFF; --hex-2: #4FA8FF; --hex-3: #2E78E0; --glow-a: rgba(79, 168, 255, .18); --glow-b: rgba(255, 231, 160, .12); --frame-bd: linear-gradient(120deg, #FFF8E1, #FFE7A0 35%, #4FA8FF 70%, #FFE7A0); }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--abyss); color: var(--tx); font-family: var(--fb); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; overflow-x: hidden; }
body { min-height: 100vh; min-height: 100dvh; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:disabled { cursor: default; }
input, textarea, select { color-scheme: dark; }
:focus-visible { outline: 2px solid var(--hex-2); outline-offset: 2px; border-radius: 3px; }
::-webkit-scrollbar { width: 0; height: 0; }
b, strong { font-weight: 600; }
h1, h2, h3, h4 { font-weight: inherit; font-size: inherit; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ── Fond ── */
.app { position: relative; min-height: 100dvh; padding-top: var(--safe-t); padding-bottom: calc(104px + var(--safe-b)); }
.app::before { content: ""; position: fixed; left: 0; right: 0; top: 0; height: var(--safe-t); z-index: 150; background: rgba(1, 10, 19, .8); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); pointer-events: none; }
.ambient { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(90% 50% at 50% -8%, var(--glow-a), transparent 62%), radial-gradient(70% 45% at 100% 100%, var(--glow-b), transparent 70%), linear-gradient(180deg, var(--navy) 0%, var(--abyss) 58%); }

/* ── En-tête ── */
.top { position: relative; z-index: 2; max-width: 480px; margin: 0 auto; padding: 14px 16px 8px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.top.home { padding: 12px 14px 2px; display: block; }
.top-t { font-family: var(--fd); font-weight: 800; font-size: 27px; line-height: 1.1; color: var(--gold-1); letter-spacing: .5px; }
.top-d { color: var(--mu); font-size: 13.5px; margin-top: 2px; }
.top-r { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.round-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--gold-1); flex-shrink: 0; transition: transform .12s;
  background: radial-gradient(circle at 50% 35%, #142A40, #050C16) padding-box, linear-gradient(180deg, rgba(240, 230, 210, .7), rgba(120, 90, 40, .5)) border-box; border: 1px solid transparent; }
.round-btn:active { transform: scale(.92); }
.round-btn:disabled { opacity: .3; }

/* HUD du champion */
.hud-top { display: flex; align-items: center; gap: 13px; }
.portrait { position: relative; flex-shrink: 0; border-radius: 50%; }
.portrait svg { position: absolute; inset: 0; overflow: visible; }
.pt-track { fill: none; stroke: rgba(200, 170, 110, .28); stroke-width: 3; }
.pt-xp { fill: none; stroke: var(--hex-2); stroke-width: 3; stroke-linecap: round; filter: drop-shadow(0 0 3px var(--hex-2)); transition: stroke-dashoffset 1s cubic-bezier(.22, 1, .36, 1); }
.pt-in { position: absolute; inset: 6px; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 50% 28%, #1E3C58, #06101C 72%);
  box-shadow: inset 0 0 0 1.5px var(--gold-3), inset 0 0 0 3.5px #06101C, inset 0 0 0 4.5px rgba(200, 170, 110, .4), inset 0 -12px 18px rgba(10, 200, 185, .16); }
.pt-l { font-family: var(--fd); font-weight: 900; font-size: 25px; line-height: 1; color: var(--gold-1); text-shadow: 0 0 12px rgba(200, 170, 110, .55); transform: translateY(1px); }
.pt-lvl { position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%); min-width: 25px; height: 20px; padding: 0 6px; display: grid; place-items: center; border-radius: 10px;
  font-family: var(--fx); font-weight: 700; font-size: 13px; line-height: 1; color: var(--gold-1); background: linear-gradient(180deg, #16304A, #050D18); border: 1.5px solid var(--gold-3); box-shadow: 0 2px 8px rgba(0, 0, 0, .7); }
.hud-id { flex: 1; min-width: 0; }
.hud-n { font-family: var(--fd); font-weight: 800; font-size: 23px; line-height: 1.05; color: var(--gold-1); letter-spacing: .6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-t { font-family: var(--fx); font-weight: 600; font-size: 13.5px; color: var(--gold-2); margin-top: 2px; }
.hud-d { font-size: 12.5px; color: var(--mu); }
.hud-bars { display: grid; gap: 6px; margin-top: 14px; }
.hud-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.hchip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px 0 5px; border-radius: 3px; font-family: var(--fx); font-weight: 600; font-size: 13px; color: var(--gold-1); white-space: nowrap;
  background: rgba(5, 13, 24, .85); border: 1px solid var(--line-2); }
.hchip b { color: var(--gold-2); font-weight: 700; }
.hchip.streak { padding-left: 8px; color: #FFC08A; border-color: rgba(255, 138, 61, .42); }
.hchip.flash { padding-left: 8px; color: var(--mu); }
.hchip.flash.on { color: #FFE27A; border-color: rgba(255, 226, 122, .45); box-shadow: inset 0 0 12px rgba(255, 226, 122, .1); }

/* Barres de jeu */
.gbar { display: flex; align-items: center; gap: 7px; width: 100%; text-align: left; }
button.gbar:active .gbar-track { filter: brightness(1.15); }
.gbar-ic { width: 20px; height: 20px; display: grid; place-items: center; flex-shrink: 0; color: var(--bc); filter: drop-shadow(0 0 4px var(--bc)); }
.gbar-track { --ticks: 10; position: relative; flex: 1; min-width: 0; height: 20px; overflow: hidden; border-radius: 2px; background: #02070D;
  box-shadow: inset 0 0 0 1px rgba(200, 170, 110, .42), inset 0 2px 6px rgba(0, 0, 0, .85); }
.gbar-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bf); box-shadow: 0 0 14px var(--bc); transition: width 1s cubic-bezier(.22, 1, .36, 1); }
.gbar-fill::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255, 255, 255, .36), rgba(255, 255, 255, 0) 46%, rgba(0, 0, 0, .28)); }
.gbar-track::after { content: ""; position: absolute; inset: 1px; pointer-events: none;
  background: repeating-linear-gradient(90deg, transparent 0, transparent calc(100% / var(--ticks) - 1px), rgba(1, 8, 15, .6) calc(100% / var(--ticks) - 1px), rgba(1, 8, 15, .6) calc(100% / var(--ticks))); }
.gbar-t { position: absolute; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 6px; white-space: nowrap;
  font-family: var(--fx); font-weight: 700; font-size: 12.5px; color: #fff; text-shadow: 0 1px 2px #000, 0 0 5px #000, 0 0 2px #000; }
.gbar-t em { font-style: normal; font-weight: 600; opacity: .78; }
.gbar.hp { --bc: var(--hp); --bf: linear-gradient(90deg, #105E38, #26B26C 60%, #74F2B2); }
.gbar.mana { --bc: #2F9BFF; --bf: linear-gradient(90deg, #102F96, #2C77FF 55%, #66D6FF); }
.gbar.boss { --bc: var(--red); --bf: linear-gradient(90deg, #5E0B18, #C42A40 60%, #FF6E81); }
.gbar.xp { --bc: var(--hex-2); --bf: linear-gradient(90deg, #00434A, var(--hex-2) 70%, var(--hex-1)); }
.gbar.lp { --bc: var(--gold-2); --bf: linear-gradient(90deg, var(--gold-4), var(--gold-2) 60%, var(--gold-1)); }
.gbar.big .gbar-track { height: 26px; }
.gbar.big .gbar-t { font-size: 14px; }

/* ── Mise en page ── */
.main { position: relative; z-index: 1; animation: pageIn .26s ease both; }
@keyframes pageIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.page { max-width: 480px; margin: 0 auto; padding: 8px 14px 0; }
.card, .panel, .block, .stat, .tl-card, .ex, .fav, .rules li {
  position: relative; border: 1px solid var(--line); background: var(--panel-bg);
  box-shadow: inset 0 1px 0 rgba(240, 230, 210, .045), 0 12px 28px -16px rgba(0, 0, 0, .95);
}
.card, .panel, .block { border-radius: 4px; padding: 14px; margin-bottom: 12px; }
.card::before, .panel::before, .block::before { content: ""; position: absolute; left: 14px; right: 14px; top: -1px; height: 1px; background: linear-gradient(90deg, transparent, rgba(240, 230, 210, .42), transparent); pointer-events: none; }
.frame { --cut: 12px; position: relative; isolation: isolate; padding: 1.5px; background: var(--frame-bd);
  clip-path: polygon(var(--cut) 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, var(--cut) 100%, 0 calc(100% - var(--cut)), 0 var(--cut)); }
.frame::before { content: ""; position: absolute; inset: 1.5px; z-index: -1; background: var(--frame-fill, linear-gradient(180deg, #0D2033, #050D18));
  clip-path: polygon(calc(var(--cut) - .6px) 0, calc(100% - var(--cut) + .6px) 0, 100% calc(var(--cut) - .6px), 100% calc(100% - var(--cut) + .6px), calc(100% - var(--cut) + .6px) 100%, calc(var(--cut) - .6px) 100%, 0 calc(100% - var(--cut) + .6px), 0 calc(var(--cut) - .6px)); }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 11px; }
.sec-h h2 { font-family: var(--fx); font-weight: 600; font-size: 17px; color: var(--gold-1); letter-spacing: .2px; }
.sec-r { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--mu); white-space: nowrap; }
.sec-r b { font-family: var(--fx); font-weight: 700; font-size: 14px; color: var(--tx); }
button.sec-r.link { color: var(--hex-2); font-weight: 600; }

/* ═════════════════════════════════════════════════════════════
   Base (accueil)
   ═════════════════════════════════════════════════════════════ */
.home { padding-top: 4px; }
/* Farm du jour */
.hero { margin: 8px 0 14px; --cut: 14px; }
.hero-in { position: relative; display: block; width: 100%; text-align: left; padding: 15px 16px 6px;
  background: radial-gradient(110% 80% at 0% 0%, rgba(200, 170, 110, .15), transparent 55%), radial-gradient(80% 70% at 100% 100%, rgba(10, 200, 185, .09), transparent 60%); }
.hero-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.hero-k { font-family: var(--fx); font-weight: 600; font-size: 15px; color: var(--gold-2); letter-spacing: .3px; }
.hero-chip { padding: 4px 10px; border-radius: 3px; font-family: var(--fx); font-weight: 700; font-size: 13px; white-space: nowrap; color: var(--gold-1); background: rgba(200, 170, 110, .1); border: 1px solid var(--line-2); }
.hero-chip.ok { color: #9DF5C8; background: rgba(61, 214, 140, .1); border-color: rgba(61, 214, 140, .4); }
.hero-chip.late { color: #FF9AA8; background: rgba(232, 64, 87, .1); border-color: rgba(232, 64, 87, .45); }
.hero-chip.moon { color: #BFD6FF; background: rgba(79, 141, 255, .12); border-color: rgba(79, 141, 255, .4); }
.hero-num { display: flex; align-items: center; gap: 9px; margin-top: 6px; }
.hero-num.center { justify-content: center; }
.hero-big { font-family: var(--fx); font-weight: 700; font-size: 58px; line-height: .95; letter-spacing: -.5px; font-variant-numeric: tabular-nums;
  background: linear-gradient(180deg, #FFF8E2 0%, #F2D892 42%, #C8AA6E 68%, #86611E 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .55)) drop-shadow(0 0 18px rgba(200, 170, 110, .32)); }
.hero-of { align-self: flex-end; margin-bottom: 5px; font-family: var(--fx); font-weight: 600; font-size: 16px; color: var(--mu); white-space: nowrap; }
.hero-sub { margin-top: 6px; font-size: 14px; color: var(--mu); }
.hero-sub.center { text-align: center; }
.hero-sub b { color: var(--gold-1); font-family: var(--fx); font-weight: 700; }
.hero-chart { margin: 8px -4px 0; }
.hero-chart svg { display: block; overflow: visible; }
.hc-goal { font-family: var(--fx); font-size: 10.5px; font-weight: 700; fill: #8C8676; }
.hc-ph { font-family: var(--fx); font-size: 10.5px; font-weight: 600; fill: #6E6A61; letter-spacing: .3px; }
.hc-ph.on { fill: var(--hex-2); }
.hc-now { transform-box: fill-box; transform-origin: center; filter: drop-shadow(0 0 6px rgba(255, 241, 196, .95)); }
.hero-axis { display: flex; justify-content: space-between; margin-top: 4px; padding: 0 2px; font-family: var(--fx); font-size: 11.5px; color: var(--dim); }
.hero-foot { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 9px 16px 12px; border-top: 1px solid var(--line); }
.hf { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--mu); }
.hf svg { color: var(--gold-2); }
.hf b { color: var(--gold-1); font-family: var(--fx); font-weight: 700; font-size: 14px; }
.hf.camp { color: #FFB49B; }
.hf.camp svg { color: #FF8A6E; animation: campPulse 2.2s ease-in-out 3; }
@keyframes campPulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
.boot .hc-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.4s cubic-bezier(.22, 1, .36, 1) .25s forwards; }
.boot .hc-area { opacity: 0; animation: fadeIn .9s ease 1s forwards; }
.boot .hc-dot { opacity: 0; animation: fadeIn .4s ease 1.2s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
/* Recall (la nuit) */
.hero.night { --frame-bd: linear-gradient(180deg, #BFD6FF, #4F8DFF 45%, #16307A); }
.hero.night .hero-in { text-align: center; padding-bottom: 16px; background: radial-gradient(80% 70% at 50% 30%, rgba(79, 141, 255, .2), transparent 70%); }
.hero.night .hero-top { text-align: left; }
.hero.night .hero-big { background: linear-gradient(180deg, #FFFFFF, #CFE0FF 50%, #6FA0FF); -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 0 22px rgba(79, 141, 255, .55)); }
.recall-ring { position: relative; width: 108px; height: 108px; margin: 12px auto 8px; display: grid; place-items: center; color: #CFE0FF; }
.recall-ring span { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(#4F8DFF calc(var(--p) * 360deg), rgba(79, 141, 255, .14) 0);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px)); mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px)); filter: drop-shadow(0 0 8px #4F8DFF); }
.recall-ring::before { content: ""; position: absolute; inset: 15px; border-radius: 50%; border: 1px dashed rgba(127, 167, 255, .5); animation: spin 14s linear infinite; }

/* Maintenant : la prochaine action (ping) */
.now { --pc: #E0B85C; --pg: rgba(224, 184, 92, .15); position: relative; margin-bottom: 18px; padding: 14px 14px 14px 15px; border-radius: 4px;
  background: linear-gradient(100deg, var(--pg), transparent 55%), var(--panel-bg); border: 1px solid var(--line-2); border-left: 2px solid var(--pc);
  box-shadow: 0 14px 30px -18px rgba(0, 0, 0, .95), inset 0 1px 0 rgba(240, 230, 210, .05); }
.now.ping-recall { --pc: #6FA0FF; --pg: rgba(111, 160, 255, .15); }
.now.ping-vision { --pc: #2FE0D2; --pg: rgba(10, 200, 185, .15); }
.now.ping-prot { --pc: #FF9A5C; --pg: rgba(255, 138, 61, .15); }
.now.ping-heal { --pc: #4FE39A; --pg: rgba(61, 214, 140, .14); }
.now.quiet { border-left-color: var(--line-2); }
.now-h { display: flex; align-items: flex-start; gap: 12px; }
.now-ic { position: relative; width: 38px; height: 38px; flex-shrink: 0; display: grid; place-items: center; color: var(--pc); }
.now-ic::before { content: ""; position: absolute; inset: 5px; transform: rotate(45deg); border: 1.5px solid var(--pc); background: var(--pg); box-shadow: 0 0 14px var(--pg); }
.now-ic::after { content: ""; position: absolute; inset: 2px; transform: rotate(45deg); border: 1px solid var(--pc); opacity: 0; animation: pingOut 1.8s ease-out .2s 2; }
.now-ic svg { position: relative; }
@keyframes pingOut { 0% { opacity: .9; transform: rotate(45deg) scale(.8); } 100% { opacity: 0; transform: rotate(45deg) scale(1.7); } }
.now-tx { min-width: 0; padding-top: 1px; }
.now-t { font-family: var(--fx); font-weight: 700; font-size: 18px; line-height: 1.22; color: var(--gold-1); }
.now-s { font-size: 13.5px; color: var(--mu); margin-top: 3px; }
.now-act { display: flex; gap: 8px; margin-top: 13px; }
.now-act.col { flex-direction: column; align-items: stretch; }
.now-btn, .cta.sun, .cta.neon, .update-bar button, .toast-undo {
  background: linear-gradient(180deg, #0F3A4A 0%, #0A2533 55%, #061A26 100%) padding-box, linear-gradient(180deg, var(--gold-1), var(--gold-2) 40%, var(--gold-4)) border-box;
  border: 1.5px solid transparent; color: #E6FFFB; text-shadow: 0 0 10px rgba(10, 200, 185, .55);
  box-shadow: inset 0 0 18px rgba(10, 200, 185, .22), 0 6px 18px -8px rgba(10, 200, 185, .5); }
.now-btn { flex: 1; min-height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 3px; font-family: var(--fx); font-weight: 700; font-size: 16px; letter-spacing: .3px; transition: transform .12s; }
.now-btn.moon { background: linear-gradient(180deg, #1A3478, #0E1E4C 60%, #08122E) padding-box, linear-gradient(180deg, var(--gold-1), var(--gold-2) 40%, var(--gold-4)) border-box; color: #E6EEFF; text-shadow: 0 0 10px rgba(111, 160, 255, .7); box-shadow: inset 0 0 18px rgba(79, 141, 255, .28), 0 6px 18px -8px rgba(79, 141, 255, .55); }
.now-btn.ghost { color: var(--gold-1); text-shadow: none; background: rgba(5, 13, 24, .8); border: 1px solid var(--line-2); box-shadow: none; font-weight: 600; }
.now-btn:active, .now-fav:active, .nx:active, .now-alt:active { transform: scale(.97); }
.now-fav { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 9px 9px 9px 14px; border-radius: 3px; text-align: left; transition: transform .12s;
  background: linear-gradient(90deg, rgba(200, 170, 110, .16), rgba(200, 170, 110, .04)); border: 1px solid var(--line-2); }
.nf-tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.nf-n { font-family: var(--fx); font-weight: 700; font-size: 16px; color: var(--gold-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nf-k { font-size: 12.5px; color: var(--gold-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nf-plus { width: 36px; height: 36px; flex-shrink: 0; display: grid; place-items: center; color: #E6FFFB; clip-path: var(--hexa);
  background: radial-gradient(circle at 50% 40%, #18D8C8, #0A7E7A 60%, #04343E); }
.now-alt { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; padding: 4px 2px; font-size: 13px; font-weight: 500; color: var(--mu); transition: transform .12s; }
.now-next { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; }
.now-nl { font-size: 12px; color: var(--dim); margin-right: 2px; }
.nx { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 3px; font-size: 12.5px; color: var(--tx); background: rgba(5, 13, 24, .7); border: 1px solid var(--line); transition: transform .12s; }
.nx svg { color: var(--gold-2); }

/* Objectifs du jour : les kills */
.kills { margin: 0 0 18px; }
.kname { font-family: var(--fd); font-weight: 900; font-size: 15px; letter-spacing: .6px; color: #FFD27A; text-shadow: 0 0 12px rgba(255, 190, 90, .5); }
.khex-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.khex { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; transition: transform .12s; }
.khex:active { transform: scale(.94); }
.khex-b { position: relative; display: block; width: 54px; height: 60px; padding: 1.5px; clip-path: var(--hexa); background: linear-gradient(180deg, rgba(240, 230, 210, .55), rgba(120, 90, 40, .45)); }
.khex-in { position: relative; display: grid; place-items: center; width: 100%; height: 100%; overflow: hidden; clip-path: var(--hexa); color: var(--mu); background: radial-gradient(circle at 50% 30%, #12263B, #040A13 75%); }
.khex-fill { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(0deg, rgba(10, 200, 185, .5), rgba(10, 200, 185, .12)); transition: height .9s cubic-bezier(.22, 1, .36, 1); }
.khex-in svg { position: relative; }
.khex.on .khex-b { background: linear-gradient(180deg, #FFF3CC, var(--gold-2) 50%, var(--gold-4)); }
.khex.on .khex-in { color: #FFE9AE; background: radial-gradient(circle at 50% 30%, #4A3610, #140B02 78%); }
.khex.on .khex-fill { background: linear-gradient(0deg, rgba(224, 184, 92, .55), rgba(224, 184, 92, .1)); }
.khex.on { filter: drop-shadow(0 0 7px rgba(224, 184, 92, .5)); }
.khex-l { max-width: 100%; font-family: var(--fx); font-weight: 600; font-size: 12.5px; color: var(--mu); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.khex.on .khex-l { color: var(--gold-1); }
.khex-v { margin-top: -3px; font-family: var(--fx); font-size: 11.5px; color: var(--dim); white-space: nowrap; }

/* Inventaire : items à stacks */
.inv { margin: 0 0 18px; }
.inv-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 6px; }
.islot { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.islot-f { display: block; width: 60px; height: 60px; transition: filter .25s, transform .12s; }
.islot:active .islot-f { transform: scale(.93); }
.islot-in { position: relative; display: grid; place-items: center; width: 100%; height: 100%; clip-path: var(--bevel8); background: linear-gradient(180deg, rgba(240, 230, 210, .5), rgba(90, 70, 30, .5)); }
.islot-in::before { content: ""; position: absolute; inset: 1.5px; clip-path: var(--bevel8i); background: radial-gradient(circle at 50% 32%, #15304A, #040A13 78%); }
.islot-in .iart { position: relative; filter: saturate(.3) brightness(.6); transition: filter .25s; }
.islot.on .islot-in { background: linear-gradient(180deg, #FFF3CC, var(--gold-2) 45%, var(--gold-4)); }
.islot.on .islot-in .iart { filter: none; }
.islot.on .islot-f { filter: drop-shadow(0 0 7px var(--ic)); }
.islot-n { position: absolute; top: 40px; right: calc(50% - 27px); font-family: var(--fx); font-weight: 700; font-size: 14px; line-height: 1; color: #fff; text-shadow: 0 0 3px #000, 0 1px 2px #000, 1px 0 2px #000, -1px 0 2px #000; pointer-events: none; }
.islot-pip { position: absolute; top: -5px; left: calc(50% - 35px); width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%; font-family: var(--fx); font-weight: 800; font-size: 12px; color: #fff; background: var(--red); box-shadow: 0 0 8px var(--red); pointer-events: none; }
.islot-l { max-width: 100%; font-family: var(--fx); font-weight: 600; font-size: 12.5px; color: var(--mu); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.islot.on .islot-l { color: var(--gold-1); }
.islot.risk .islot-l { color: #FFB0BA; }
.iart { display: block; overflow: visible; }

/* Grille de stacks */
.sgrid { --cols: 7; display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 3px; }
.sgrid i { position: relative; aspect-ratio: 1; border-radius: 1px; background: rgba(240, 230, 210, .05); box-shadow: inset 0 0 0 1px rgba(200, 170, 110, .16); }
.sgrid i.on { background: linear-gradient(180deg, var(--hex-1), var(--hex-2) 60%, var(--hex-3)); box-shadow: 0 0 6px rgba(10, 200, 185, .55); }
.sgrid i.last { animation: stackIn .6s cubic-bezier(.34, 1.56, .64, 1); }
.sgrid i.lost::before, .sgrid i.lost::after { content: ""; position: absolute; left: 18%; right: 18%; top: calc(50% - 1px); height: 2px; border-radius: 1px; background: var(--red); transform: rotate(45deg); }
.sgrid i.lost::after { transform: rotate(-45deg); }
@keyframes stackIn { from { transform: scale(.2); opacity: 0; } to { transform: none; opacity: 1; } }

/* Quêtes */
.quests { padding-bottom: 6px; }
.qst { display: flex; align-items: center; gap: 11px; padding: 9px 0; border-top: 1px solid var(--line); }
.sec-h + .qst { border-top: none; padding-top: 2px; }
.qst-c { width: 18px; height: 18px; margin: 0 2px; flex-shrink: 0; display: grid; place-items: center; transform: rotate(45deg); border: 1.5px solid var(--gold-4); background: rgba(5, 13, 24, .8); }
.qst-c svg { transform: rotate(-45deg); }
.qst.on .qst-c { color: #1A1204; background: var(--gold-2); border-color: var(--gold-1); box-shadow: 0 0 8px rgba(200, 170, 110, .55); }
.qst-tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.qst-tx b { font-family: var(--fx); font-weight: 600; font-size: 15px; color: var(--tx); }
.qst-tx span { font-size: 12.5px; color: var(--mu); }
.qst.on .qst-tx b { color: var(--gold-1); }
.qst.on .qst-tx span { color: var(--dim); }
.qst-xp { font-family: var(--fx); font-weight: 700; font-size: 13.5px; color: var(--hex-2); white-space: nowrap; }
.qst.on .qst-xp { color: var(--dim); }

/* Boss de la semaine */
.bossc { display: flex; align-items: center; gap: 13px; width: 100%; text-align: left; border-color: rgba(232, 64, 87, .32); transition: transform .12s; }
.bossc::before { background: linear-gradient(90deg, transparent, rgba(255, 110, 130, .55), transparent); }
.bossc:active { transform: scale(.99); }
.bossc-art { flex-shrink: 0; filter: drop-shadow(0 0 10px rgba(232, 64, 87, .35)); }
.bossc-m { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.bossc-k { font-size: 12px; color: #E89AA6; }
.bossc-n { font-family: var(--fd); font-weight: 800; font-size: 18px; color: #FFD6DC; letter-spacing: .3px; }
.bossc-s { font-size: 12.5px; color: var(--mu); }
.bossc.rage { box-shadow: inset 0 0 30px rgba(232, 64, 87, .12), 0 12px 28px -16px rgba(0, 0, 0, .95); }
.bossc.dead { border-color: var(--line-2); }
.bossc.dead .bossc-n { color: var(--mu); text-decoration: line-through; text-decoration-color: rgba(232, 64, 87, .7); }
.bossart.dead { filter: grayscale(1) brightness(.55); }

/* Barre du coach et plan */
.cbar { display: flex; align-items: center; gap: 12px; width: 100%; margin-bottom: 12px; padding: 12px; border-radius: 4px; text-align: left; transition: transform .12s;
  background: linear-gradient(100deg, rgba(10, 200, 185, .1), transparent 60%), var(--panel-bg); border: 1px solid rgba(10, 200, 185, .3); }
.cbar:active { transform: scale(.98); }
.cbar-ic { width: 38px; height: 42px; flex-shrink: 0; display: grid; place-items: center; color: #E6FFFB; clip-path: var(--hexa); background: radial-gradient(circle at 50% 40%, #18D8C8, #0A7E7A 60%, #04343E); }
.cbar-tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.cbar-tx b { font-family: var(--fx); font-weight: 700; font-size: 16px; color: var(--gold-1); }
.cbar-tx span { font-size: 12.5px; color: var(--mu); }
.cbar-go { color: var(--hex-2); }
.plan { border-color: rgba(111, 160, 255, .38); }
.plan-sum { font-size: 15px; font-weight: 500; margin: -4px 0 10px; }
.plan-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.ptag { font-size: 12.5px; padding: 5px 10px; border-radius: 3px; background: rgba(5, 13, 24, .7); border: 1px solid var(--line); }
.ptag.moon { background: rgba(79, 141, 255, .14); border-color: rgba(79, 141, 255, .38); color: #CFE0FF; }
.plan-meals { display: flex; flex-direction: column; margin-bottom: 12px; }
.pm { display: grid; grid-template-columns: 44px 14px 1fr auto; align-items: center; gap: 0 8px; padding: 8px 0; position: relative; }
.pm + .pm::before { content: ""; position: absolute; left: 57px; top: -10px; height: 20px; width: 2px; background: rgba(111, 160, 255, .25); }
.pm-t { font-family: var(--fx); font-size: 13.5px; font-weight: 600; color: var(--mu); font-variant-numeric: tabular-nums; }
.pm-dot { width: 10px; height: 10px; transform: rotate(45deg); border: 2px solid #6FA0FF; justify-self: center; }
.pm.done .pm-dot { background: #6FA0FF; box-shadow: 0 0 8px #6FA0FF; }
.pm.now .pm-dot { background: var(--gold-2); border-color: var(--gold-2); box-shadow: 0 0 10px var(--gold-2); }
.pm.now .pm-l { color: var(--gold-1); }
.pm.past { opacity: .5; }
.pm-main { display: flex; flex-direction: column; min-width: 0; }
.pm-l { font-size: 14.5px; font-weight: 500; }
.pm-i { font-size: 12px; color: var(--mu); }
.pm-k { font-family: var(--fx); font-size: 13.5px; color: var(--gold-2); font-variant-numeric: tabular-nums; }
.pm.done .pm-k { color: #6FA0FF; }
.plan-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.plan-chip { align-self: flex-start; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; max-width: 88%; padding: 8px 12px; border-radius: 3px; background: rgba(79, 141, 255, .12); border: 1px solid rgba(79, 141, 255, .35); font-size: 13px; color: #CFE0FF; }

/* La semaine en parties */
.wks-row { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.wk { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 6px 0 7px; border-radius: 3px; }
.wk.today { background: rgba(10, 200, 185, .07); box-shadow: inset 0 0 0 1px rgba(10, 200, 185, .32); }
.wk:active:not(:disabled) { background: rgba(240, 230, 210, .06); }
.wk-d { font-family: var(--fx); font-weight: 600; font-size: 12.5px; color: var(--dim); }
.wk.today .wk-d { color: var(--hex-2); }
.wk-r { width: 30px; height: 33px; display: grid; place-items: center; clip-path: var(--hexa); font-family: var(--fd); font-weight: 900; font-size: 14px; background: rgba(240, 230, 210, .06); }
.wk-r.w { color: #2A1D06; background: linear-gradient(180deg, #FFF3CC, var(--gold-2) 55%, var(--gold-4)); }
.wk-r.l { color: #FFE6EA; background: linear-gradient(180deg, #FF6E81, #A61D33 60%, #5E0B18); }
.wk-r.cur { color: var(--hex-2); background: rgba(10, 200, 185, .14); }
.wk-r.fut { background: rgba(240, 230, 210, .03); }
.grade-ph { height: 17px; }
.kdots { display: flex; gap: 3px; height: 6px; align-items: center; }
.kdots i { width: 4px; height: 4px; transform: rotate(45deg); background: rgba(240, 230, 210, .14); }
.kdots i.on { background: var(--gold-2); box-shadow: 0 0 4px var(--gold-2); }

/* Notes S+ → D */
.grade { display: inline-grid; place-items: center; min-width: 28px; height: 22px; padding: 0 5px; border-radius: 2px; font-family: var(--fd); font-weight: 900; font-size: 13px; line-height: 1; color: #1A1204; }
.g-sp { background: linear-gradient(180deg, #FFF6D1, #F0B84A); box-shadow: 0 0 10px rgba(240, 184, 74, .6); }
.g-s { background: linear-gradient(180deg, #FFE8B0, var(--gold-2)); }
.g-a { background: linear-gradient(180deg, #D8FFFA, var(--hex-2)); }
.g-b { background: linear-gradient(180deg, #D6E4FF, #6E93FF); }
.g-c { background: linear-gradient(180deg, #E8E3D8, #8E887B); }
.g-d { color: #FFE6EA; background: linear-gradient(180deg, #E8566B, #8E1B2C); }
.grade.lg { min-width: 58px; height: 42px; font-size: 25px; padding: 0 8px; }
.grade.sm { min-width: 26px; height: 20px; font-size: 12px; }
.grade.xs { min-width: 22px; height: 17px; font-size: 10.5px; padding: 0 3px; }

/* Classé */
.rankc { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; transition: transform .12s; }
.rankc:active { transform: scale(.99); }
.rankc-m { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.rankc-k { font-size: 12px; color: var(--mu); }
.rankc-n { font-family: var(--fd); font-weight: 800; font-size: 20px; line-height: 1.15; color: var(--gold-1); }
.rankc-s { font-size: 12.5px; color: var(--mu); }
.rankc-s b.up, .up-txt { color: var(--hp); }
.rankc-s b.down, .down-txt { color: var(--red); }
.emblem { flex-shrink: 0; overflow: visible; filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .65)); }
.emblem.dim { filter: grayscale(1) brightness(.55); opacity: .75; }
.coin { flex-shrink: 0; vertical-align: -2px; }

/* ── Boutons ── */
.cta { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; padding: 12px 18px; border-radius: 3px; font-family: var(--fx); font-weight: 700; font-size: 16px; letter-spacing: .3px; color: var(--gold-1); transition: transform .12s ease, opacity .2s; }
.cta:active { transform: scale(.97); }
.cta:disabled { opacity: .4; }
.cta.ghost { background: rgba(5, 13, 24, .75); border: 1px solid var(--line-2); font-weight: 600; }
.cta.moon { background: linear-gradient(180deg, #1A3478, #0A1740) padding-box, linear-gradient(180deg, var(--gold-1), var(--gold-4)) border-box; border: 1.5px solid transparent; color: #E6EEFF; }
.cta.sky { background: linear-gradient(180deg, #0F3A4A, #061A26) padding-box, linear-gradient(180deg, var(--gold-1), var(--gold-4)) border-box; border: 1.5px solid transparent; color: #E6FFFB; }
.cta.flesh { background: linear-gradient(180deg, #5A2A0E, #2A1205) padding-box, linear-gradient(180deg, var(--gold-1), var(--gold-4)) border-box; border: 1.5px solid transparent; color: #FFE3CF; }
.cta.neon { color: #E6FFFB; }
.cta.full { width: 100%; }
.cta.shrink { width: auto; flex: 0 0 auto; }
.cta-row { display: flex; gap: 10px; }
.cta-row > * { flex: 1; }
.big-inp { font-family: var(--fx); font-weight: 700; font-size: 21px !important; text-align: center; }
.pill-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 14px; border-radius: 3px; font-family: var(--fx); font-weight: 600; font-size: 14px; color: var(--gold-1); background: rgba(5, 13, 24, .75); border: 1px solid var(--line-2); transition: transform .12s; }
.pill-btn:active { transform: scale(.95); }
.pill-btn.ghost { color: var(--mu); border-color: var(--line); }
.wide-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; margin-bottom: 10px; border-radius: 3px; font-family: var(--fx); font-weight: 700; font-size: 16px; color: var(--gold-1);
  background: linear-gradient(180deg, #0F3A4A, #061A26) padding-box, linear-gradient(180deg, var(--gold-1), var(--gold-2) 40%, var(--gold-4)) border-box; border: 1.5px solid transparent; }
.wide-btn.ghost { background: rgba(5, 13, 24, .75); border: 1px solid var(--line-2); font-weight: 600; }
.link { color: var(--hex-2); font-size: 14px; font-weight: 600; padding: 2px 0; }
.link.small { font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 12px; border-radius: 3px; background: rgba(5, 13, 24, .75); border: 1px solid var(--line); font-size: 13.5px; font-weight: 500; text-decoration: none; transition: transform .12s; }
.chip:active { transform: scale(.95); }
.chip.on { background: rgba(10, 200, 185, .14); border-color: rgba(10, 200, 185, .5); color: var(--hex-1); }
.chip.danger { color: #FF8A9A; }
.chip:disabled { opacity: .45; }
.tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 2px; margin-left: 7px; vertical-align: 1px; background: rgba(240, 230, 210, .08); color: var(--mu); }
.tag.ok { background: rgba(61, 214, 140, .14); color: var(--hp); }
.tag.ia { background: rgba(185, 124, 255, .16); color: #D7BEFF; }
.tag.new { background: rgba(240, 184, 74, .16); color: #F0C878; }
.tag.warn { background: rgba(232, 64, 87, .16); color: #FF8A9A; }
.tag.sun { background: rgba(10, 200, 185, .16); color: var(--hex-1); }

/* ── Textes et utilitaires ── */
.block { margin-top: 4px; }
.block-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.block-head h3, .panel-t { font-family: var(--fx); font-weight: 600; font-size: 17px; color: var(--gold-1); }
.panel-t { margin-bottom: 10px; }
.count { font-family: var(--fx); font-weight: 700; color: var(--mu); font-size: 14px; }
.panel.glow-sky { border-color: rgba(10, 200, 185, .5); box-shadow: 0 0 0 3px rgba(10, 200, 185, .07), 0 12px 28px -16px rgba(0, 0, 0, .95); }
